name: build-android

# Builds the Setnayan Android app bundle (.aab) for Google Play upload.
#
# Why CI instead of a local build: the Capacitor shell needs a full Android
# SDK + JDK 21 toolchain that we don't keep on dev machines. This workflow
# compiles a SIGNED release .aab in the cloud and uploads it as an artifact
# you download and hand to the Play Console. It mirrors build-desktop.yml's
# "CI is the build machine" pattern.
#
# REQUIRED SECRETS (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of apps/mobile upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  the keystore/key password (same value for both)
# The key alias is fixed to "setnayan" (matches how the keystore was generated).
#
# Run it: Actions tab → build-android → "Run workflow" (workflow_dispatch).
# Manual-only on purpose — it needs the keystore secrets below to exist first,
# so we don't want it auto-firing on every mobile change and failing red until
# they're set. Flip on a push trigger later once secrets are in place.

on:
  workflow_dispatch:

jobs:
  build:
    name: build signed .aab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8 (@capacitor/android ^8.4) compiles its library modules
          # with Java 21 source/target — JDK 17 fails with "invalid source
          # release: 21". AGP 8.13 supports 21, so this is the floor.
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # The mobile package is npm-managed and excluded from the pnpm workspace
      # (see apps/mobile/README.md "npm, not pnpm"). Install + sync regenerate
      # the gitignored Capacitor glue (assets/public, capacitor.config.json,
      # res/xml/config.xml) that a bare gradle build would be missing.
      - name: Install mobile deps + sync Capacitor
        working-directory: apps/mobile
        run: |
          npm ci
          npx cap sync android

      # Decode the upload keystore from the secret and write the gitignored
      # keystore.properties that android/app/build.gradle reads. Nothing
      # sensitive is ever committed; both live only on the runner.
      - name: Decode upload keystore
        working-directory: apps/mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. See build-android.yml header."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PW"
            echo "keyAlias=setnayan"
            echo "keyPassword=$KEYSTORE_PW"
          } > keystore.properties

      - name: Build release bundle
        working-directory: apps/mobile/android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Verify the bundle is signed
        working-directory: apps/mobile/android
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "Built: $AAB"
          test -n "$AAB" || { echo "::error::No .aab produced"; exit 1; }

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: setnayan-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # ── A DIRECTLY INSTALLABLE APK, alongside the Play bundle ──────────────
      #
      # An .aab is an upload format: Google Play splits it into per-device APKs
      # at install time, and it CANNOT be sideloaded. So while the Play org
      # account is blocked (the D-U-N-S requested 2026-06-25 has not arrived —
      # see build-sessions/STORE-SHELL-CLOSEOUT-2026-09-07.md § 5), the bundle
      # this workflow produced was unreachable by any human: no store, and no
      # way to put it on a phone.
      #
      # `assembleRelease` produces one universal APK signed with the SAME
      # upload keystore as the bundle, so it can be copied to an Android 10+
      # device and installed directly ("Install unknown apps" must be allowed
      # for whichever app opens it).
      #
      # 🔑 THIS IS ALSO HOW THE APP FINALLY GETS RUN ON REAL HARDWARE. Nobody
      # has ever launched it on a physical Android device — CI has only ever
      # compiled it (DECISION_LOG 2026-06-07: "NOT runtime-tested (no AVD) —
      # compile-verified only"; the 2026-06-25 row still lists an on-device
      # smoke test as an open gate). A shipping app nobody has opened is worth
      # more attention than a build number.
      #
      # ⚠ NOT a substitute for the Play upload: an APK installed this way gets
      # no Play updates, no Play integrity checks, and Play Console still needs
      # the .aab above. It is for testing and for hand-distribution.
      - name: Build release APK (directly installable)
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify the APK exists and is signed
        working-directory: apps/mobile/android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::No .apk produced"; exit 1; }
          echo "Built: $APK"
          # apksigner lives under an unpredictable build-tools version dir, so
          # find it rather than pinning a path that rots on the next SDK bump.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" || {
              echo "::error::APK failed signature verification"; exit 1; }
          else
            echo "::warning::apksigner not found — APK built but signature unverified"
          fi

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: setnayan-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
