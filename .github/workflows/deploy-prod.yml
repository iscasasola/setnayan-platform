name: deploy-prod

# ─── WHY THIS EXISTS ─────────────────────────────────────────────────
# Sequences DB migrations BEFORE the Vercel production deploy, so deployed code
# never outruns its schema. Today Vercel's NATIVE git auto-deploy fires on every
# push to main and runs FULLY IN PARALLEL with `supabase-migrations.yml`
# (`supabase db push`). Vercel's build+deploy usually finishes before the Action
# (checkout → install CLI → link → push) does, so freshly-merged code lands in
# prod referencing columns/tables/functions the migration hasn't applied yet —
# a multi-minute window where the new feature 42703/42P01-errors (the apply-lag
# that recurred 3× during the 2026-06-29 vendor-benefits build: the Wave-2
# substrate, No-Show, and Batch-1 Wave-5 all caught it). See memory
# project_setnayan_migration_application.
#
# THE FIX: make ONE pipeline own the order — apply migrations, THEN trigger the
# Vercel deploy (via a Deploy Hook). Vercel still builds; it's just triggered by
# this Action AFTER db push succeeds, so the schema is always ahead of the code.
#
# ─── ✅ CUTOVER COMPLETE 2026-07-30 — verified end-to-end on #3936 ────
#
# This workflow is now the ONLY thing that deploys `main`, and it deploys only
# after `db push` succeeds. Vercel's native git auto-deploy for main is OFF
# (apps/web/vercel.json → "git.deploymentEnabled.main": false — JSON takes no
# comments, so this is its note). Schema is therefore always ahead of code.
#
# ── The prerequisite, and why it took two tries ──
# The first attempt (#3916) turned Vercel's auto-deploy off while push-triggered
# workflows were SILENTLY SUPPRESSED, so nothing deployed at all for three
# merges. The cause:
#
#   **GitHub does not run `push`-triggered workflows for a push made with
#   GITHUB_TOKEN.** `auto-enable-automerge.yml` armed auto-merge with that token,
#   GitHub completed the merge as `github-actions[bot]`, and the resulting push
#   fired NOTHING — not deploy-prod, not ci, not e2e.
#
# Measured that day: of five merges to main, the one human-authored (8760e19e6)
# produced push runs; the four bot-authored (#3916 4ba1703d0, #3919 d8216cb13,
# #3918 25bec371d, #3920 052ff19c4) produced none. That — not concurrency
# supersession — is why five migrations needed a manual `gh workflow run`.
#
# FIXED by adding repo secret **AUTOMERGE_PAT** (fine-grained: Contents RW +
# Pull requests RW + Metadata R). `auto-enable-automerge.yml` already read it
# with a `|| github.token` fallback, so no code change was needed.
#
# Verified on #3936 (merge 9752224e4): auto-merge enabledBy=iscasasola, merge
# commit authored by iscasasola, and push runs [deploy-prod, e2e, ci] all fired —
# db push applied, hook returned success, Vercel deployed.
#
# ── 🚨 THE TELL IF THIS EVER BREAKS AGAIN ──
# If merge commits start showing **`github-actions[bot]`** as author, the PAT has
# expired or been revoked. Symptom: `main` silently stops deploying and
# migrations silently stop applying — CI stays green because it never runs.
#   Check:    gh run list --workflow deploy-prod.yml --json event,headSha
#             git log -1 --format='%an' origin/main
#   Recover:  gh workflow run deploy-prod.yml --ref main   (always available)
#   Fix:      re-issue AUTOMERGE_PAT, or revert vercel.json's
#             git.deploymentEnabled.main to true so Vercel deploys again.
# ⚠ The tempting alternative — triggering off `pull_request: [closed]` — may be
# suppressed by the same GITHUB_TOKEN rule. Verify before depending on it;
# assuming a trigger fires is exactly what caused the outage.
#
# ─── Hook + secret setup, kept for lineage ───────────────────────────
# Hook `migrate-then-deploy` (branch main) created in Vercel; secret
# VERCEL_DEPLOY_HOOK_URL added; verified by a manual dispatch — gate printed
# "✅ Configured", `db push` ran, hook returned HTTP 201, and Vercel showed a
# deployment carrying deployHookName=migrate-then-deploy. Vercel's native git
# auto-deploy for `main` is now OFF via apps/web/vercel.json
# ("git.deploymentEnabled.main": false) — JSON takes no comments, so this is the
# note for it. Between the secret landing and that line merging, every push to
# main built TWICE (Vercel's own trigger + this hook); the vercel.json line is
# what ends that.
#
# ⛔ DO **NOT** ADD A `schedule:` TRIGGER TO THIS WORKFLOW.
# It was proposed as a safety-net for skipped runs and it is a trap: the
# "Trigger Vercel production deploy" step below is gated ONLY on
# `steps.gate.outputs.enabled`, never on whether `db push` actually applied
# anything — so a cron would POST the deploy hook on every firing. At the
# '17,47 * * * *' cadence that is ~48 production builds a day of unchanged code.
# The migration safety-net belongs in `supabase-migrations.yml`, which already
# has that cron and never deploys anything.
#
# And a skipped run here is NOT the hole it looks like: the hook deploys the
# `main` REF, not a pinned SHA (deployHookRef=main), so whichever run survives a
# concurrency supersession deploys main's tip — which already contains the
# commits whose runs were dropped. Same self-healing shape as
# `db push --include-all`. Verify with `gh run list`, dispatch manually if a
# burst really did drop the last one, and leave the cron alone.
#
# ─── CUTOVER (owner, one-time — kept for lineage) ─────────────────────
# Until the cutover this workflow is a GREEN NO-OP and Vercel's native git
# auto-deploy stays in charge — so MERGING this file changes NOTHING. Flip it on
# in ONE maintenance window (order matters — avoid both a no-deployer gap and
# double-deploys):
#
#   1. Vercel → Project → Settings → Git → turn OFF "Automatically deploy"
#      for the production (main) branch — OR add to apps/web/vercel.json:
#        "git": { "deploymentEnabled": { "main": false } }
#      (Now nothing auto-deploys on push — this is the brief gap; do step 2 next.)
#   2. Vercel → Project → Settings → Git → Deploy Hooks → create a hook for the
#      production branch (main); copy its URL into a repo secret:
#        Settings → Secrets and variables → Actions → New repository secret
#          Name:  VERCEL_DEPLOY_HOOK_URL
#          Value: https://api.vercel.com/v1/integrations/deploy/prj_…/…
#      (The 3 supabase secrets — SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD /
#      the SUPABASE_PROJECT_REF variable — are already set; this workflow reuses
#      them. The moment VERCEL_DEPLOY_HOOK_URL exists, the gate below flips on.)
#   3. Retire `supabase-migrations.yml` (this workflow subsumes its db push). To
#      avoid two concurrent db-pushes during any overlap, this workflow shares
#      its concurrency group (`supabase-migrations-prod`) so they SERIALIZE even
#      before you delete it — deleting it is just cleanup.
#   4. Verify: Actions → deploy-prod → "Run workflow" on main → confirm it
#      applies migrations (or no-ops) THEN the deploy hook returns 201, and the
#      Vercel deployment shows the migrated commit. Then merge a normal change
#      and watch the order hold.
#
# After cutover: push to main → migrations apply (db push) → on SUCCESS → the
# deploy hook fires → Vercel builds + deploys the already-migrated commit. If
# db push FAILS, the deploy never triggers (fail-closed — far safer than today's
# deploy-anyway race).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Share the supabase-migrations concurrency group so this and the legacy
# workflow never run `db push` against prod at the same time (they SERIALIZE;
# a half-applied set is worse than a queued run, so cancel-in-progress is false).
concurrency:
  group: supabase-migrations-prod
  cancel-in-progress: false

jobs:
  migrate-then-deploy:
    name: apply migrations → deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      # The Supabase CLI flushes telemetry to PostHog on exit; in CI that egress
      # intermittently times out and the CLI exits non-zero AFTER the work
      # succeeded. DO_NOT_TRACK skips telemetry so exit codes reflect only the
      # migration work (same rationale as supabase-migrations.yml).
      DO_NOT_TRACK: "1"

    steps:
      # Dormant-until-configured gate (mirrors supabase-migrations.yml). With the
      # push trigger live, this runs on every merge to main — but GREEN no-ops
      # until VERCEL_DEPLOY_HOOK_URL (+ the 3 supabase secrets) are present, so
      # merging this file is non-breaking. Vercel's native git auto-deploy stays
      # in charge until the owner does the cutover above.
      - name: Gate — is migrate-then-deploy configured?
        id: gate
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ Configured — applying migrations, then triggering the deploy."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=migrate-then-deploy DORMANT::Set VERCEL_DEPLOY_HOOK_URL (the 3 supabase secrets are already set) AND disable Vercel git auto-deploy to flip this on — see the header CUTOVER steps. Vercel's native auto-deploy remains in charge until then; nothing changed."
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        if: steps.gate.outputs.enabled == 'true'
        uses: supabase/setup-cli@v1
        with:
          # PINNED, not `latest`. Supabase CLI v2.112.0 (released 2026-08-07
          # 10:08 UTC) broke `supabase link` with
          #   failed to get api keys: SchemaError(Expected a string matching the RegExp ...)
          # — it validates a timestamp the API returns against a stricter
          # RFC3339 regex than the API emits. Every prod deploy from 11:17 that
          # day failed at the link step, so THREE migrations merged green and
          # never reached the database: venue dimensions (the column did not
          # exist while the code reading it was live), creator-offers-free, and
          # an OAuth credential backfill.
          #
          # 🔑 `version: latest` means a third party can break this pipeline
          # without anyone touching this repo — and it fails AFTER the merge, so
          # CI is green and nobody is told. v2.111.0 (2026-07-31) is the last
          # release every deploy succeeded on.
          #
          # To move off the pin: bump it deliberately and watch one deploy go
          # green. Do not put `latest` back.
          version: 2.111.0

      - name: Link Supabase project
        if: steps.gate.outputs.enabled == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Apply BEFORE deploy. --include-all matches supabase-migrations.yml so an
      # out-of-order tail still applies; idempotent / no-op when nothing pends.
      - name: Apply pending migrations (db push) — BEFORE deploy
        if: steps.gate.outputs.enabled == 'true'
        run: supabase db push --include-all --yes

      # Only reached when db push SUCCEEDED (fail-closed). Trigger the Vercel
      # production build+deploy for the now-migrated commit. -f → curl exits
      # non-zero on an HTTP error so a failed hook reddens the run.
      - name: Trigger Vercel production deploy (post-migration)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          echo "Migrations applied — triggering Vercel production deploy of the migrated commit."
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" -o /dev/null -w "Vercel deploy hook → HTTP %{http_code}\n"

      - name: Show migration history
        if: always() && steps.gate.outputs.enabled == 'true'
        run: supabase migration list
