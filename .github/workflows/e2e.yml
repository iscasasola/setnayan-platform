name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: playwright e2e (chromium)
    runs-on: ubuntu-latest
    # Critical-path E2E tests (Task #35) — homepage renders, health
    # endpoints respond, signup routing works, 404 surface ships
    # editorial-brand-voice copy. Six tests today; future PRs extend
    # by copying patterns from apps/web/tests/e2e/*.spec.ts.
    #
    # Strategy: build + start the production server in CI, then run
    # Playwright against http://localhost:3000. Avoids the Vercel
    # preview-URL discovery dance (which requires a preview to already
    # have deployed by the time this job kicks off — race-y at best).
    # When Vercel preview deployments are integrated later, set
    # E2E_BASE_URL on the runner to skip the build + start step.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # Cache the browser binary, keyed on the resolved Playwright version.
      #
      # WHY: this job's timeout-minutes is 15, and every cancellation observed
      # on 2026-08-19 was EXACTLY 15m — i.e. the timeout, not a test failure —
      # with the job dying inside this step. Measured over 30 runs: 22 success
      # (5–14 min), 5 cancelled at 15m, and one of those was on `main`, so it is
      # not branch-specific. Successes at 14m are one slow minute from the cap.
      # The browser download is the variable part; caching removes it rather
      # than raising the ceiling and waiting for the tail to catch up again.
      #
      # The key includes the version so a Playwright bump misses the cache and
      # re-downloads, instead of silently testing against a stale browser.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @setnayan/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium

      # A cache hit still needs the OS-level shared libraries, which live
      # outside ~/.cache and are NOT restored by the cache. `--with-deps` on a
      # hit installs those without re-downloading the browser.
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter @setnayan/web exec playwright install-deps chromium
          else
            pnpm --filter @setnayan/web exec playwright install --with-deps chromium
          fi

      - name: Build web app
        run: pnpm --filter @setnayan/web build
        env:
          # Same dummy env-var pattern as the existing `build` job in
          # ci.yml — real values are set on Vercel; CI only needs the
          # build to succeed for E2E to have a server to hit.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Start production server
        # `next start` binds to port 3000 (per the script in package.json).
        # Background it + wait for the health endpoint to confirm boot.
        run: |
          pnpm --filter @setnayan/web start &
          echo "Waiting for server to boot..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to boot in 30s"
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run Playwright tests
        run: pnpm --filter @setnayan/web test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
