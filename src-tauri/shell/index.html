<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Only without scripts (never in the app): the page below checks for a connection before it leaves. -->
    <noscript><meta http-equiv="refresh" content="0; url=https://setnayan.com" /></noscript>
    <title>Setnayan</title>
    <style>
      :root {
        color-scheme: light;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #faf7f2;
        color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }
      .mark {
        width: auto;
        height: 96px;
      }
      p {
        font-size: 14px;
        color: #1a1a1a99;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      a {
        color: #c97b4b;
      }
      /* 📶 No connection (controller review #2 item 23): said plainly, with the one way to keep working. */
      .offline {
        display: none;
        max-width: 320px;
        text-align: center;
      }
      .offline h1 {
        font-size: 19px;
        margin: 0 0 8px;
        font-weight: 600;
      }
      .offline .line {
        font-size: 14px;
        margin: 0 0 16px;
        color: #1a1a1acc;
        text-transform: none;
        letter-spacing: 0;
      }
      .offline button {
        font: inherit;
        font-size: 14px;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        /* the house action colour: white on it measures 4.8:1 (the lighter link copper measured 3.3:1) */
        border: 1px solid #c24e25;
        background: #c24e25;
        color: #ffffff;
        cursor: pointer;
      }
      body.is-offline .offline {
        display: block;
      }
      body.is-offline .loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Setnayan official gold mark (owner-supplied 2026-05-31) — kept byte-identical
         to src-tauri/icons/icon.svg + /brand/setnayan-mark.svg so the splash matches the
         app icon and the in-app <Logo>. (Was a stale pre-2026-05-31 black glyph.) -->
    <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5333.3335 5333.3335" role="img" aria-label="Setnayan">
      <defs>
        <clipPath id="setnayan-mark-clip" clipPathUnits="userSpaceOnUse">
          <path d="M 0,0 H 4000 V 4000 H 0 Z" />
        </clipPath>
      </defs>
      <path
        d="M 1859.526,3749.781 C 1458.028,3717.757 1065.454,3548.554 758.3406,3241.44 451.2286,2934.328 282.2397,2541.742 250.2195,2140.255 l 1326.8215,1.536 V 661.7647 C 1368.543,727.4195 1172.067,841.5416 1006.804,1006.804 768.3191,1245.29 633.8543,1548.261 602.7217,1859.526 H 250 C 282.024,1458.028 451.2265,1065.455 758.3406,758.3406 1065.453,451.2287 1458.039,282.2396 1859.526,250.2195 V 2422.739 H 661.7647 c 65.6549,208.498 179.7773,404.975 345.0393,570.237 238.486,238.486 541.457,372.95 852.722,404.083 z m 280.948,0 1.537,-1609.307 h 280.948 v 1197.761 c 208.498,-65.655 404.974,-179.776 570.237,-345.039 238.485,-238.486 372.95,-541.457 404.082,-852.722 H 3750 c -32.024,401.498 -201.226,794.071 -508.341,1101.185 -307.112,307.112 -699.697,476.101 -1101.185,508.122 z m 0,-1890.255 c 32.025,-401.498 201.227,-794.073 508.341,-1101.1854 0.658,-0.6584 1.316,-1.3173 1.975,-1.9754 -80.395,-42.041 -163.892,-76.0428 -249.331,-101.7389 -85.439,-25.696 -172.821,-43.0864 -260.985,-51.9046 V 250.2195 c 401.497,32.0253 794.073,201.0094 1101.185,508.1211 307.114,307.1134 476.317,699.6874 508.341,1101.1854 h -352.722 c -31.132,-311.265 -165.597,-614.236 -404.082,-852.722 -15.719,-15.7189 -32.464,-29.741 -48.727,-44.5564 -15.975,14.4789 -31.774,29.1397 -47.191,44.5564 -238.485,238.486 -372.95,541.457 -404.082,852.722 z"
        fill="#cb9e4b" fill-rule="nonzero"
        transform="matrix(1.3333333,0,0,-1.3333333,0,5333.3333)"
        clip-path="url(#setnayan-mark-clip)" />
    </svg>
    <p class="loading">Loading Setnayan…</p>
    <div class="offline" role="status" aria-live="polite">
      <h1>You’re offline</h1>
      <p class="line">Open setnayan.com in your browser to work offline.</p>
      <button type="button" id="again">Try again</button>
    </div>
    <noscript><a href="https://setnayan.com">Open Setnayan</a></noscript>
    <script>
      // 📶 THE DESKTOP APP WITH NO CONNECTION (controller review #2 item 23). This window shows the live site, which a
      // desktop app cannot keep for offline use (the browser and the Home Screen app can). So before leaving this page
      // it checks for a connection: with one it goes straight on, as it always did; with none it says so, with the one
      // way to keep working — never a blank error page. "Try again" checks again.
      var SITE = 'https://setnayan.com';
      function offline() {
        document.body.classList.add('is-offline');
      }
      function go() {
        document.body.classList.remove('is-offline');
        if (navigator.onLine === false) return offline();
        var done = false;
        var timer = setTimeout(function () {
          if (!done) {
            done = true;
            offline();
          }
        }, 6000);
        fetch(SITE + '/api/health', { mode: 'no-cors', cache: 'no-store' }).then(
          function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            window.location.replace(SITE);
          },
          function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            offline();
          },
        );
      }
      document.getElementById('again').addEventListener('click', go);
      window.addEventListener('online', go);
      go();
    </script>
  </body>
</html>
