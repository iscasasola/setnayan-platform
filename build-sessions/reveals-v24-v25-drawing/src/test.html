<!doctype html><meta charset="utf-8"><body style="margin:0;background:#888">
<div id="ph" style="position:relative;width:300px;height:520px;overflow:hidden;border-radius:30px;background:#222 center/cover">
<canvas id="c" style="position:absolute;inset:0;width:300px;height:520px"></canvas></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="tex.js"></script><script src="old.js"></script><script src="core4.js"></script><script src="oldcloth.js"></script><script src="rigid.js"></script><script src="fx.js"></script><script src="drape.js"></script><script src="aisle.js"></script><script src="ribbon.js"></script><script src="round3.js"></script><script src="env2.js"></script><script src="gift3.js"></script>
<script>
window.onerror=function(m,u,l){document.body.insertAdjacentHTML('beforeend','<pre style="color:#fff;position:absolute;top:0;left:0;font-size:9px;white-space:pre-wrap;width:480px">'+m+' @'+l+'</pre>');};
var q=new URLSearchParams(location.search), r=q.get('r')||'veil', t=parseFloat(q.get('t')||'0'), m=q.get('m')||'tap';
document.getElementById('ph').style.backgroundImage='url('+TEX.coverCale+')';
(q.get('o')||'').split(',').forEach(function(kv){ if(!kv) return; var a=kv.split(':'); RV.opts[r]=RV.opts[r]||{}; RV.opts[r][a[0]]=a[1]; });
RV.mount(document.getElementById('c'));
var sc = m==='tap' ? [[0.5,null],[t,function(){ if(t>0){ if(q.get('x')) RV.tapOpen(parseFloat(q.get('x')),parseFloat(q.get('y'))); else RV.play(); } }]] :
  /* hold: pinch at a point and pull, for t seconds, then let go and wait w seconds */
  [[0.5,null],[0.01,function(){RV.down(1,0,-0.2);}],[0.25,function(){RV.move(1,0.15,0.05);}],[t,function(){RV.move(1,0.3,0.25);}],[parseFloat(q.get('w')||'0'),function(){ if(q.get('w')) RV.up(1,0.3,0.25); }]];
if(m==='hold') RV.rules.TAP_MS=0;
RV.seek(r, sc);
</script>
