   hand the light-glass recipes back a light edge so they still read. (Same
   dormancy caveat as .sn-ambient above: correct now so it is not a trap.) */

html.dark {
  --sn-glass-line: rgba(255,255,255,.18);
}

.sn-glass-dark {
  background: var(--sn-glass-dark-bg);
  border: 1px solid var(--sn-glass-dark-line);
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  color: var(--sn-gold-100);
}

/* ---------- home-launcher fidelity surfaces (2026-07-15 pixel pass) ----------
 * Each recipe defined ONCE here (owner: "do not hard code values that should be
 * dependent") and referenced by class from the launcher components. In
 * @layer components so Tailwind hover/state utilities on the same element
 * (e.g. hover:border-mulberry/30) still win the cascade. */

/* ---------- Atelier-Glass SHELL KIT (Glass PR-1, 2026-07-15) ----------
 * The shared surface + type primitives every dashboard view consumes (rollout
 * plan § 1.2). Defined once here; page bodies reference by class. In
 * @layer components so page-level Tailwind state utilities still win the
 * cascade. Blur budget (§ 1.6): .sn-tile / .sn-card / .sn-tile-dark are the
 * ONLY page-level blurred surfaces — repeated rows use the flat .sn-row. */

/* Hover lifts (proto .cmd:hover -2px · .tile.glass:hover -3px · .ev:hover -4px)
 * — shared .32s ease + shadow deepen to --sn-sh-hi. The transition list also
 * covers border/opacity hovers the launcher cards layer on top. */

.sn-lift-2,
.sn-lift-3,
.sn-lift-4 {
  transition:
    transform 0.32s var(--sn-ease),
    box-shadow 0.32s var(--sn-ease),
    border-color 0.2s,
    background-color 0.2s,
    color 0.2s,
    opacity 0.2s,
    scale 0.13s var(--sn-ease);
}

.sn-lift-2:hover {
  transform: translateY(-2px);
  box-shadow: var(--sn-sh-hi);
}

.sn-lift-3:hover {
  transform: translateY(-3px);
  box-shadow: var(--sn-sh-hi);
}

.sn-lift-4:hover {
  transform: translateY(-4px);
  box-shadow: var(--sn-sh-hi);
}

/* (Press feedback for Link cards is the `.sn-press` opt-in on the base-layer
 * universal press rule near the top of this file.) */

/* ---------- Inspector column (Finder-style master ▸ detail, ≥xl) ----------
 * Shared primitive: app/_components/inspector/inspector-column.tsx. Below xl the
 * rail is hidden and the triggers navigate normally (mobile unchanged). At ≥xl
 * the shell is a flex row; selecting a row animates the rail open (flex-basis)
 * and the master reflows to the remaining width — one --sn-ease 320ms transition.
 * Blur budget (§ 1.6): the panel is the ONLY blurred surface the inspector adds
 * (one `.sn-tile`); its body sections stay opaque. */

.sn-inspector-rail {
  display: none;
}

@media (min-width: 1280px) {
  .sn-inspector-shell {
    display: flex;
    align-items: flex-start;
  }

  .sn-inspector-master {
    flex: 1 1 0%;
    min-width: 0;
  }

  .sn-inspector-rail {
    display: block;
    flex: 0 0 0px;
    align-self: stretch;
    margin-left: 0;
    /* `clip`, NOT `hidden`. Both clip the panel while flex-basis animates open,
       but `hidden` makes this rail a SCROLL CONTAINER — and a `position: sticky`
       child cannot stick to the viewport from inside one, so
       `.sn-inspector-panel`'s `position: sticky; top: 1.25rem` was declared and
       INERT: the panel scrolled away with the roster. `clip` clips without
       creating a scroll container, so the sticky finally applies.
       (Reported 2026-09-14: "this show persist even when scrolled down".) */
    overflow: clip;
    opacity: 0;
    transition:
      flex-basis var(--sn-dur-elem) var(--sn-ease),
      margin-left var(--sn-dur-elem) var(--sn-ease),
      opacity var(--sn-dur-elem) var(--sn-ease);
  }

  .sn-inspector-shell[data-open='true'] .sn-inspector-rail {
    flex-basis: clamp(340px, 30vw, 420px);
    margin-left: 24px;
    opacity: 1;
  }
}

/* The panel itself: sticky, own scroll, viewport-minus-chrome height. Its width
 * is fixed to the open rail width so the body does NOT reflow while the rail
 * animates — it wipes in cleanly under the rail's overflow clip. */

.sn-inspector-panel {
  position: sticky;
  top: 1.25rem;
  width: clamp(340px, 30vw, 420px);
  max-height: calc(100vh - 2.5rem);
  overflow-y: auto;
  overscroll-behavior: contain;
  border-radius: 20px;
  padding: 20px;
}

.sn-inspector-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.sn-inspector-title {
  font-family: var(--sn-font);
  font-weight: 800;
  font-size: 21px;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--sn-ink-900);
}

.sn-inspector-close {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 999px;
  color: var(--sn-ink-500);
  background: rgba(30, 26, 18, 0.05);
  transition: background var(--sn-dur-control), color var(--sn-dur-control);
}

.sn-inspector-close:hover {
  background: rgba(30, 26, 18, 0.1);
  color: var(--sn-ink-900);
}

.sn-inspector-close:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--sn-gold-100);
}

.sn-inspector-fulllink {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--sn-font);
  font-size: 12px;
  font-weight: 700;
  color: var(--sn-gold-700);
}

.sn-inspector-fulllink:hover {
  text-decoration: underline;
}

.sn-inspector-body {
  margin-top: 14px;
  border-top: 1px solid var(--sn-hairline);
  padding-top: 16px;
}

/* Keyed body remount animation (`.sn-lens-swap`) — a gentle rise+fade as the
 * selection swaps, keyed by the selection id in InspectorColumn. */

@keyframes sn-lens-swap {
  from {
    opacity: 0;
    transform: translateY(6px);
  }

  to   {
    opacity: 1;
    transform: none;
  }
}

.sn-lens-swap {
  animation: sn-lens-swap var(--sn-dur-elem) var(--sn-ease-out) both;
}

/* Selected-row affordance — the master row that owns the open inspector. */

[data-inspector-selected='true'] {
  background: var(--sn-gold-100);
  box-shadow: inset 0 0 0 1.5px var(--sn-gold-500);
}

/* …except the Guests roster, where the trigger is only the name cell of a wider
 * <tr>: the WHOLE row wears the gold selected tint (set in guest-list-multiselect
 * DesktopRow) instead, so the name link opts out of the default per-element wash
 * to avoid double-marking. */

.sn-guest-namelink[data-inspector-selected='true'] {
  background: transparent;
  box-shadow: none;
}

@media (prefers-reduced-motion: reduce) {
  .sn-inspector-rail {
    transition: none !important;
  }

  .sn-lens-swap {
    animation: none !important;
  }
}

/* ---------- buttons ---------- */

.sn-btn {
  font-family: var(--sn-font);
  font-weight: 700;
  font-size: 14.5px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 22px;
  border-radius: var(--sn-r-md);
  border: none;
  cursor: pointer;
  transition: transform var(--sn-dur-control) var(--sn-ease),
              box-shadow var(--sn-dur-control), background var(--sn-dur-control);
}

.sn-btn-primary {
  background: var(--sn-gold-500);
  color: #FFFDF8;
}

.sn-btn-primary:hover {
  background: var(--sn-gold-600);
  transform: translateY(-2px);
  box-shadow: 0 14px 26px -12px var(--sn-gold-500);
}

.sn-btn-secondary {
  background: transparent;
  color: var(--sn-ink-900);
  border: 1.5px solid var(--sn-ink-900);
}

.sn-btn-secondary:hover {
  background: var(--sn-ink-900);
  color: var(--sn-paper);
  transform: translateY(-2px);
}

.sn-btn-ghost {
  background: transparent;
  color: var(--sn-ink-700);
}

.sn-btn-ghost:hover {
  background: var(--sn-gold-100);
  color: var(--sn-gold-700);
}

.sn-btn:disabled {
  background: var(--sn-hairline);
  color: var(--sn-ink-300);
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* on ink / over video */

.sn-btn-on-ink {
  background: var(--sn-gold-300);
  color: var(--sn-ink-black);
}

.sn-btn-on-ink:hover {
  background: #D8B979;
  transform: translateY(-2px);
}

/* ---------- inputs ---------- */

.sn-input {
  font-family: var(--sn-font);
  font-size: 14px;
  color: var(--sn-ink-900);
  background: var(--sn-paper);
  border: 1.5px solid var(--sn-line);
  border-radius: var(--sn-r-md);
  padding: 12px 14px;
  outline: none;
  transition: border-color var(--sn-dur-control), box-shadow var(--sn-dur-control);
}

.sn-input:hover  {
  border-color: var(--sn-gold-500);
}

.sn-input:focus  {
  border-color: var(--sn-gold-500);
  box-shadow: 0 0 0 3px var(--sn-gold-100);
}

.sn-input-error  {
  background: #FBF3F1;
  border-color: var(--sn-danger);
  color: #8F3D31;
}

/* ---------- cards ---------- */

.sn-card {
  background: var(--sn-glass-bg);
  border: 1px solid var(--sn-glass-line);
  backdrop-filter: var(--sn-glass-blur);
  -webkit-backdrop-filter: var(--sn-glass-blur);
  border-radius: var(--sn-r-xl);
  box-shadow: var(--sn-sh-sm);
  transition: transform var(--sn-dur-elem) var(--sn-ease), box-shadow var(--sn-dur-elem);
}

.sn-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--sn-sh-hi);
}

/* ---------- chips & badges ---------- */

.sn-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: var(--sn-r-pill);
  font: 600 13px var(--sn-font);
  cursor: pointer;
  background: var(--sn-surface);
  border: 1px solid var(--sn-line);
  color: var(--sn-ink-700);
  transition: border-color var(--sn-dur-control), color var(--sn-dur-control);
}

.sn-chip:hover {
  border-color: var(--sn-gold-500);
  color: var(--sn-gold-700);
}

.sn-chip.selected {
  background: var(--sn-gold-100);
  border-color: transparent;
  color: var(--sn-gold-700);
  font-weight: 700;
}

.sn-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--sn-r-pill);
  font: 700 12px var(--sn-font);
}

.sn-badge-verified {
  background: var(--sn-gold-100);
  color: var(--sn-gold-700);
}

.sn-badge-going    {
  background: var(--sn-success-soft);
  color: var(--sn-success);
}

.sn-badge-flag     {
  background: var(--sn-danger-soft);
  color: var(--sn-danger);
}

/* ============================================================
   SETNAYAN MOTION LIBRARY (kit setnayan-animations.css)
   Prefer transform+opacity only.
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
  .sn-reveal, .sn-skeleton, .sn-bar > i, .sn-scrim, .sn-modal {
    animation: none !important;
  }

  .sn-acc, .sn-btn, .sn-card, .sn-chip, .sn-input {
    transition: none !important;
  }
}

/* ---------- entrances ---------- */

@keyframes sn-rise     {
  from {
    opacity:0;
    transform:translateY(22px);
  }

  to {
    opacity:1;
    transform:none;
  }
}

@keyframes sn-fade     {
  from {
    opacity:0;
  }

  to {
    opacity:1;
  }
}

@keyframes sn-scale-in {
  from {
    opacity:0;
    transform:scale(.94);
  }

  to {
    opacity:1;
    transform:none;
  }
}

@keyframes sn-blur-in  {
  from {
    opacity:0;
    filter:blur(10px);
  }

  to {
    opacity:1;
    filter:blur(0);
  }
}

.sn-reveal {
  animation: sn-rise var(--sn-dur-enter) both var(--sn-ease-out);
}

.sn-reveal:nth-child(2) {
  animation-delay:.08s
}

.sn-reveal:nth-child(3) {
  animation-delay:.16s
}

.sn-reveal:nth-child(4) {
  animation-delay:.24s
}

.sn-reveal:nth-child(5) {
  animation-delay:.32s
}

/* scroll-gate: start paused; flip to running with IntersectionObserver */

[data-reveal] .sn-reveal {
  animation-play-state: paused;
}

/* ---------- loaders ---------- */

@keyframes sn-spin  {
  to {
    transform:rotate(360deg);
  }
}

@keyframes sn-dots  {
  0%,80%,100% {
    transform:none;
    opacity:.45;
  }

  40% {
    transform:translateY(-7px);
    opacity:1;
  }
}

@keyframes sn-sheen {
  from {
    background-position:-200% 0;
  }

  to {
    background-position:200% 0;
  }
}

@keyframes sn-indet {
  from {
    left:-35%;
  }

  to {
    left:105%;
  }
}

.sn-skeleton {
  background:linear-gradient(90deg,#EDE8DE 25%,#F5F0E6 50%,#EDE8DE 75%);
  background-size:200% 100%;
  animation:sn-sheen 1.4s linear infinite;
}

/* ---------- data viz ---------- */

@keyframes sn-grow    {
  from {
    width:0;
  }
}

/* horizontal bars */

@keyframes sn-grow-y  {
  from {
    transform:scaleY(0);
  }
}

/* bar charts: transform-origin:bottom */

@keyframes sn-donut   {
  from {
    stroke-dashoffset:251.2;
  }
}

/* r=40 circle; dasharray = pct * 2.512 */

@keyframes sn-shimmer {
  from {
    transform:translateX(-120%);
  }

  to {
    transform:translateX(340%);
  }
}

.sn-bar > i {
  display:block;
  height:100%;
  border-radius:inherit;
  animation: sn-grow var(--sn-dur-enter) var(--sn-ease-out) both;
}

/* ---------- live signatures (pulse ONLY on genuinely live states) ---------- */

@keyframes sn-pulse {
  0%,100% {
    opacity:1;
    transform:scale(1);
  }

  50% {
    opacity:.4;
    transform:scale(.7);
  }
}

@keyframes sn-ring  {
  0% {
    box-shadow:0 0 0 0 rgba(169,131,75,.45);
  }

  100% {
    box-shadow:0 0 0 14px rgba(169,131,75,0);
  }
}

@keyframes sn-marquee {
  from {
    transform:translateX(0);
  }

  to {
    transform:translateX(-50%);
  }
}

/* duplicate run once */

/* ---------- expand / collapse (no height measuring) ---------- */

.sn-acc {
  display:grid;
  grid-template-rows:0fr;
  grid-template-columns:minmax(0,1fr);
  transition:grid-template-rows var(--sn-dur-elem) var(--sn-ease);
}

.sn-acc.open {
  grid-template-rows:1fr;
}

.sn-acc > * {
  overflow:hidden;
  min-height:0;
  min-width:0;
}

/* HORIZONTAL CONTAINMENT (the twin of min-height:0, which only frees the vertical axis).
 * Without an explicit column track the implicit column is `auto`, so it sizes to the
 * child's max-content: a wide child — a horizontally-scrolling rail, a table, a long
 * unbroken string — inflates the collapse past its container. `minmax(0,1fr)` pins the
 * track to the container in every engine; min-width:0 on the child is belt-and-braces
 * (a child with overflow:hidden already resolves its automatic minimum to 0, so the
 * TRACK, not the child, is what must be constrained). Any collapse built on this
 * template inherits the fix — copy BOTH lines if you duplicate the pattern. */

/* ---------- overlays ---------- */

.sn-scrim {
  background:rgba(27,26,23,.14);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  animation:sn-fade .3s both;
}

.sn-modal {
  animation:sn-scale-in .4s both var(--sn-ease-out);
}

/* route change: main { animation:sn-fade .32s both; } */

/* ---------- home-launcher fidelity motion (2026-07-15 pixel pass) ----------
 * All `both`-filled or single-run, so the global reduced-motion freeze above
 * (0.001ms + iteration-count 1) snaps every one to its safe end state. */

/* Obsidian Alaala tile entrance — materializes LAST, after the glass cascade. */

@keyframes sn-bloom {
  0%   {
    opacity:0;
    transform:translateY(22px) scale(.96);
    filter:blur(12px);
  }

  62%  {
    filter:blur(0);
  }

  100% {
    opacity:1;
    transform:none;
    filter:blur(0);
  }
}

.sn-bloom {
  animation: sn-bloom 1s 1.05s both var(--sn-ease-out);
}

/* Command-palette panel pop-in (proto popIn). */

@keyframes sn-pop-in {
  from {
    opacity:0;
    transform:scale(.94) translateY(8px);
  }

  to   {
    opacity:1;
    transform:none;
  }
}

.sn-pop-in {
  animation: sn-pop-in .38s both var(--sn-ease-out);
}

/* Alaala lens-body cross-fade on lens switch (proto lensIn; re-triggered by a
 * React key remount per switch). */

@keyframes sn-lens-in {
  from {
    opacity:0;
    transform:translateY(9px);
    filter:blur(4px);
  }
}

.sn-lens-swap > * {
  animation: sn-lens-in .42s backwards var(--sn-ease-out);
}

.sn-lens-swap > :nth-child(2) {
  animation-delay:.06s;
}

.sn-lens-swap > :nth-child(3) {
  animation-delay:.12s;
}

/* Lens chip pop on select (proto chipPop — gentler than .sn-pick-bounce). */

@keyframes sn-chip-pop {
  0% {
    transform:scale(1);
  }

  45% {
    transform:scale(1.09);
  }

  100% {
    transform:scale(1);
  }
}

.sn-chip-pop {
  animation: sn-chip-pop .34s var(--sn-ease-out);
}

/* Progress-ring entrance sweep — generalizes sn-donut: the circle sets its own
 * circumference via --sn-ring-circ (keyframes may read custom properties). */

@keyframes sn-ring-sweep {
  from {
    stroke-dashoffset: var(--sn-ring-circ);
  }
}

/* Route-transition rise — one per shell via a template.tsx wrapping {children}
 * in `.sn-page-enter` (App Router remounts templates on pathname change, so
 * every in-shell nav gets a soft rise; search-param changes don't remount).
 * The template.tsx files land per-surface in PR-2/5/6/8; the CSS lands here. */

@keyframes sn-rise-soft {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}

/* 🔴 `backwards`, NEVER `both` — measured on production 2026-09-18.
 * `both` keeps the animation's TRANSFORM applied after it finishes, at its
 * identity value `matrix(1,0,0,1,0,0)`. That moves nothing and is invisible —
 * and per CSS spec ANY transform on an ancestor makes it the containing block
 * for every `position: fixed` descendant. So this wrapper silently unpinned
 * every fixed overlay on the page: the 3-step vendor coach-mark measured
 * 636 x 2444 instead of 636 x 1107, and with `items-end` its card sat at
 * y 1052-1393 against a 1107px viewport — 341px of it, Skip and Next
 * included, below the fold. The owner could see a sliver of a dialog he could
 * not reach, on a page that looked like a layout failure.
 * `backwards` holds the FROM state before the run (no flash) and returns the
 * element to its own styles afterwards — visually identical, structurally
 * inert. The keyframe declares only `from`, so nothing is lost by not holding
 * an end state. */

.sn-page-enter {
  animation: sn-rise-soft 400ms backwards var(--sn-ease-out);
}

/* R8 — mobile bottom-nav View-Transition interplay (rollout plan § 2a + § 6):
 * during the directional VT slide the incoming pane is a LIVE capture, so the
 * template rise would play inside it — the slide's first frames would carry a
 * near-transparent pane (the rise starts at opacity 0), visibly fighting the
 * 320ms slide. While a view transition is active, the slide IS the entrance:
 * suppress the rise. Browsers without :active-view-transition also lack
 * startViewTransition, so the plain rise is all they ever run. */

html:active-view-transition .sn-page-enter {
  animation: none;
}

/* Live-state dot — the ONE sanctioned infinite pulse on genuinely-live signals
 * (unread bell, day-of live dot, active livestream, the Watch "quiet" dot). */

.sn-live-dot {
  animation: sn-pulse 1.9s infinite;
}

/* Reduced motion: snap the route rise to its end state and stop the live pulse
 * (belt-and-braces beyond the global freeze blocks). */

@media (prefers-reduced-motion: reduce) {
  .sn-page-enter, .sn-live-dot {
    animation: none !important;
  }
}

/* Life-Flash veil lift + capiz shimmer sweep — the Alaala tile's signature
 * flourish (proto .veil/.capiz). Decorative spans, pointer-events none. */

.sn-veil {
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  background: linear-gradient(180deg, rgba(23,22,15,0), rgba(203,167,102,.12) 55%, rgba(23,22,15,.6));
  animation: sn-veil-lift 1.5s 1.9s both var(--sn-ease);
}

@keyframes sn-veil-lift {
  to {
    transform:translateY(-103%);
    opacity:0;
  }
}

.sn-capiz {
  position:absolute;
  top:-10%;
  bottom:-10%;
  left:-42%;
  width:34%;
  z-index:3;
  pointer-events:none;
  transform: skewX(-14deg);
  filter: blur(2px);
  background: linear-gradient(105deg, rgba(255,255,255,0), rgba(255,255,255,.13) 50%, rgba(255,255,255,0));
  animation: sn-capiz-sweep 2s 2.4s ease-in-out both;
}

@keyframes sn-capiz-sweep {
  to {
    transform:translateX(560%) skewX(-14deg);
  }
}

/* Belt-and-braces beyond the global freeze: the veil's from-state COVERS the
 * tile, so under reduced motion both decorations are removed outright (matches
 * the prototype's own RM rule). */

@media (prefers-reduced-motion: reduce) {
  .sn-veil, .sn-capiz {
    display:none !important;
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
 * ZERO-STEP SERVICE CARD MAKER — motion (canvas-maker.tsx, flag-dark behind
 * NEXT_PUBLIC_CANVAS_MAKER_ENABLED). Transcribed from artifact 15007a4d, which
 * is the design spec for this surface.
 *
 * Three signals, and nothing else moves:
 *   • a SHEET rises from the bottom edge when a card region is tapped,
 *   • newly-revealed content (the coach chip, a sheet's body) RISES in, so the
 *     eye is told something changed rather than having to notice,
 *   • the health METER slides to its new width instead of jumping, so a
 *     blocker being cleared is felt.
 *
 * The global `prefers-reduced-motion` freeze near the top of this file already
 * neutralises all of it; the explicit guards below are belt-and-braces (same
 * idiom as .subnav-lift / .sn-veil) because these three carry a from-state that
 * must never be the resting state.
 * ═══════════════════════════════════════════════════════════════════════════ */

@keyframes sn-canvas-sheet-up {
  from {
    transform: translateY(24px);
    opacity: 0;
  }

  to   {
    transform: none;
    opacity: 1;
  }
}

@keyframes sn-canvas-rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to   {
    opacity: 1;
    transform: none;
  }
}

.sn-canvas-sheet {
  animation: sn-canvas-sheet-up 280ms ease both;
}

.sn-canvas-rise  {
  animation: sn-canvas-rise 250ms ease both;
}

/* The meter is a width transition, not a keyframe — it animates from wherever
 * it already was, so an edit that lifts the score reads as a climb. */

.sn-canvas-meter {
  transition: width 450ms ease;
}

/* ═══════════════════════════════════════════════════════════════════════════
 * Add-manually sheet (owner 2026-09-20: "make sure it is fully animated").
 *
 * The Add-a-contact modal had NO entrance at all — it appeared, fully formed,
 * with only `transition-colors` on its buttons. These reuse the maker's own
 * motion vocabulary above rather than inventing a second one, because the
 * add-manually sheet IS a maker: same rise, same 280ms, same curve.
 *
 * 🔴 `backwards`, NEVER `both`, ON THE SHEET — the lesson `sn-rise-soft`
 * carries, measured on production 2026-09-18. `both` holds the animation's
 * TRANSFORM after it finishes, at its identity value; per CSS spec ANY
 * transform on an ancestor makes it the containing block for every
 * `position: fixed` descendant. The sheet is inside a `fixed inset-0` dialog
 * and its own children include absolutely-positioned dropdowns today and may
 * include fixed ones tomorrow. `backwards` holds the FROM state before the
 * run (no flash) and returns the element to its own styles afterwards —
 * visually identical, structurally inert.
 * ═══════════════════════════════════════════════════════════════════════════ */

@keyframes sn-addman-veil {
  from {
    opacity: 0;
  }
}

@keyframes sn-addman-sheet {
  from {
    opacity: 0;
    transform: translateY(26px);
  }
}

@keyframes sn-addman-sheet-sm {
  from {
    opacity: 0;
    transform: translateY(10px) scale(.985);
  }
}

.sn-addman-veil  {
  animation: sn-addman-veil 180ms ease backwards;
}

.sn-addman-sheet {
  animation: sn-addman-sheet 280ms cubic-bezier(.2,.7,.2,1) backwards;
}

@media (min-width: 640px) {
  .sn-addman-sheet {
    animation-name: sn-addman-sheet-sm;
  }
}

/* Each field group enters just behind the sheet. The delay is set inline per
 * row so one class serves every field without a rule per index. */

.sn-addman-field {
  animation: sn-canvas-rise 240ms ease backwards;
}

@media (prefers-reduced-motion: reduce) {
  .sn-addman-veil,
  .sn-addman-sheet,
  .sn-addman-field {
    animation: none;
    opacity: 1;
    transform: none;
  }

  .sn-canvas-sheet,
  .sn-canvas-rise {
    animation: none;
    opacity: 1;
    transform: none;
  }

  .sn-canvas-meter {
    transition: none;
  }
}

/* ═══ THE CARD PAINTS ITSELF (owner 2026-08-28) ═════════════════════════════
 * The first pass shows no meter and no score, so the ONLY progress a supplier
 * gets is the card visibly becoming a card. These three carry that:
 *
 *   .sn-paint-in   one value arriving on the card — replayed by REMOUNTING the
 *                  node (React `key` = the value), never by a class toggle,
 *                  which cannot restart an animation that is already finished.
 *   .sn-paint-cover the cover photo landing: a settle, not a slide, because it
 *                  is replacing a placeholder in the same box.
 *   .sn-paint-live  the card going live at publish.
 *
 * ⚠ EVERY ONE CARRIES A FROM-STATE THAT MUST NEVER BE THE RESTING STATE, so the
 * reduced-motion guard below is not optional — without it a supplier who has
 * asked for no motion gets a card stuck at opacity 0.
 * ═════════════════════════════════════════════════════════════════════════ */

@keyframes sn-paint-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }

  to   {
    opacity: 1;
    transform: none;
  }
}

@keyframes sn-paint-cover {
  from {

/* ═══ THE LAPTOP GETS ITS TWO COLUMNS (owner 2026-08-28) ════════════════════
 * Whenever a question is open — the two-question guided pass, and since SUP-10
 * (2026-09-18) any edit after it — the drawn desktop layout pins the card
 * beside the question instead of shrinking it inside the page's centred
 * `max-w-2xl` column. (The class names still say "pass"; they are pinned by
 * name in laptop-gets-two-columns.test.ts.) Below 1024px NEITHER rule exists — both classes are
 * declared only inside this one media query, so a phone renders exactly what
 * it rendered before this change, unconditionally.
 *
 *   .sn-canvas-pass-pin   the card itself. `position: fixed` so it escapes
 *                         the page's own max-width the same way the guided
 *                         question sheet already does (see .sn-canvas-sheet's
 *                         `lg:` rules) — `left` reads the shared shell's own
 *                         `--fd-rail` custom property, so it sits beside the
 *                         app rail rather than under it, at either rail width
 *                         (240px full / 72px icon-strip).
 *   .sn-canvas-pass-hide  everything that used to render BELOW the card
 *                         during the pass (recap, publish, "make it richer").
 *                         The pass already treats that content as noise on a
 *                         phone-sized page — see HealthHeader's own
 *                         `{inPass ? null : …}` two lines up — but on a
 *                         laptop that content is left with nothing to sit
 *                         under (the fixed card doesn't reserve height in the
 *                         page's flow), so it is hidden here rather than left
 *                         to float up and overlap the pinned card. It is
 *                         still rendered, just not painted, so the sheet's own
 *                         fields keep posting.
 *
 * The fallback values (240px / 61px) are only for a render that somehow never
 * inherits `.fd`'s custom properties (a corrupted style tree); on every real
 * paint of this page the vendor dashboard is always the app-chrome rail.
 * ═════════════════════════════════════════════════════════════════════════ */

@media (min-width: 1024px) {
  .sn-canvas-pass-pin {
    position: fixed;
    z-index: 30;
    left: var(--fd-rail, 240px);
    top: calc(var(--fd-bar, 61px) + 24px);
    bottom: 24px;
    width: 420px;
    overflow-y: auto;
    padding-right: 8px;
  }

  .sn-canvas-pass-hide {
    display: none;
  }
}

/* Phone ergonomics for the whole canvas, including the SHIPPED editors it
 * mounts (customization / inclusions / discounts / pricing). iOS zooms the
 * viewport on focus for any control under 16px, which on a bottom sheet throws
 * the vendor out of the sheet they just opened. Scoped to `.sn-canvas` so the
 * editors render byte-identically everywhere else — this is the cheapest way to
 * fix the zoom without forking a single component. (Artifact 15007a4d ships the
 * same rule as its `@media(max-width:700px){.fld,.stsel{font-size:16px}}`.) */

@media (max-width: 700px) {
  .sn-canvas input:not([type='checkbox']):not([type='radio']),
  .sn-canvas select,
  .sn-canvas textarea {
    font-size: 16px;
  }
}

/* ============================================================================
   THE GALLERY ARCHETYPE — the obsidian surface, ported not redrawn
   ----------------------------------------------------------------------------
   Source of truth: prototypes/archetype_content_editorial_gallery_detail_2026-08-01.html
   § 2 · GALLERY (obsidian), owner-approved 2026-08-04 with no changes requested.
   That drawing is BINDING: a delta between a ported screen and it is a defect in
   the port, not a fresh design decision.

   Its own designer's note names the three rules these classes carry:
     · "Dark is a surface, not a mode."  Obsidian exists only here.
     · "Credit is a feature."  Every tile names its camera, because in a samahan
       album who shot it is part of the memory.
     · "Lightbox honours the scroll."  It rises over the grid; the grid never
       re-renders.

   ⚠ COLOURS ONLY COME FROM --sn-ob-*. See the measured failure table beside
   those tokens: every theme colour is unreadable on this surface, silently.

   ⚠ THESE ARE THREE SCREENS, NOT ONE COMPONENT IN THREE COSTUMES. The couple's
   grid, the guest's "photos of you" and the day-of wall have different data,
   different gates and different jobs. They share this SKIN and the lightbox;
   they are deliberately not merged.
   ========================================================================== */

.sn-gal {
  background: var(--sn-ob-page);
  color: var(--sn-ob-text);
  border: 1px solid rgb(251 250 247 / 0.10);
  border-radius: 16px;
}

/* The couple's grid renders inside the dashboard's own page flow rather than as
   a card, so it takes the surface without the card's border radius. */

.sn-gal-page {
  background: var(--sn-ob-page);
  color: var(--sn-ob-text);
}

.sn-gal-kick  {
  color: var(--sn-ob-gold);
}

/* 7.99:1 */

.sn-gal-soft  {
  color: var(--sn-ob-soft);
}

/* 9.22:1 */

.sn-gal-text  {
  color: var(--sn-ob-text);
}

/* 17.37:1 */

.sn-gal-link  {
  color: var(--sn-ob-link);
}

/* 8.37:1 */

.sn-gal-tile {
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  background: var(--sn-ob-card);
  border: 1px solid rgb(251 250 247 / 0.07);
}

/* THE CREDIT. A gradient foot, not a solid bar: the photograph keeps the tile
   and the name still clears AA over the darkest stop (paper on rgba(23,22,15,.82)
   measures 16.70:1). It is `pointer-events-none` so it can never eat the tap
   that opens the lightbox. */

.sn-gal-credit {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 22px 8px 6px;
  pointer-events: none;
  background: linear-gradient(180deg, rgb(23 22 15 / 0), rgb(23 22 15 / 0.82));
  color: rgb(251 250 247 / 0.85);
}

/* Chip row — the filter bar. `.on` is the archetype's gold wash. */

.sn-gal-credit-raised {
  bottom: 44px;
  padding-bottom: 2px;
}

.sn-gal-chip {
  color: var(--sn-ob-soft);
  border: 1px solid rgb(251 250 247 / 0.18);
  background: transparent;
  transition: color .18s ease, border-color .18s ease, background .18s ease;
}

.sn-gal-chip:hover {
  border-color: rgb(251 250 247 / 0.40);
  color: var(--sn-ob-text);
}

.sn-gal-chip.is-on {
  background: rgb(203 167 102 / 0.16);
  border-color: var(--sn-ob-gold);
  color: var(--sn-ob-gold);
}

.sn-gal-badge {
  background: rgb(23 22 15 / 0.72);
  border: 1px solid rgb(251 250 247 / 0.20);
  color: var(--sn-ob-text);
}

.sn-gal-badge-gold {
  color: var(--sn-ob-gold);
}

/* Outline action on obsidian — the lightbox's Save/Close pair. */

.sn-gal-btn {
  border: 1px solid rgb(251 250 247 / 0.28);
  color: var(--sn-ob-text);
  background: transparent;
  transition: border-color .18s ease, background .18s ease;
}

.sn-gal-btn:hover {
  border-color: rgb(251 250 247 / 0.55);
  background: rgb(251 250 247 / 0.06);
}

.sn-gal-btn-cta {
  background: var(--sn-ob-cta);
  border-color: var(--sn-ob-cta);
  color: var(--sn-ob-page);
}

/* Lightbox — obsidian scrim + raised card. */

.sn-gal-scrim {
  background: rgb(23 22 15 / 0.92);
}

.sn-gal-lb-card {
  background: var(--sn-ob-card);
  border: 1px solid rgb(251 250 247 / 0.14);
  color: var(--sn-ob-text);
  border-radius: 18px;
  box-shadow: 0 30px 80px rgb(0 0 0 / 0.5);
}

/* ═══════════════════════════════════════════════════════════════════════════
   THE STORY, BY THE MINUTE — the spine's own two rules
   (Design_Editorial_By_The_Minute_2026-09-07 · 01_The_Story.md §3.3 + §7)
   ═══════════════════════════════════════════════════════════════════════════ */

/* The write-up's drop cap. A minute reads as a piece of writing, not a caption. */

.sn-dropcap::first-letter {
  font-family: var(--font-condensed), 'Saira Condensed', sans-serif;
  font-weight: 900;
  font-size: 3.2em;
  float: left;
  line-height: 0.78;
  padding: 5px 9px 0 0;
}

/* ENTRIES RISE — THEY NEVER FADE (review finding).
   The first cut held every entry at opacity .65 until an observer fired, which
   is dim in a screenshot, dim to a crawler, dim with JS off, and took muted text
   down to about 2.5:1. So: no opacity anywhere in this, and the offset itself is
   applied ONLY once the script has run — `data-story-js` is set on mount. With
   JavaScript off the entries have no transform at all and the page is simply
   the page. `prefers-reduced-motion` removes it as well, in the stylesheet AND
   in the script that would otherwise still animate the count-up. */

@media (prefers-reduced-motion: no-preference) {
  .sn-story[data-story-js] [data-story-entry] {
    transform: translateY(14px);
    transition: transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .sn-story[data-story-js] [data-story-entry][data-story-in] {
    transform: none;
  }
}

/* THE COUNT-UP IS PAINTED OVER THE TEXT, NEVER WRITTEN INTO IT (story-clock.tsx).
   While a minute's stamp counts up, the digits in flight sit in
   `data-story-counting` and are drawn by ::before; the server's own text keeps
   its box (so nothing moves) and is only hidden underneath. Writing the text
   instead broke hydration on parts of the story that had not hydrated yet. */

[data-story-countup][data-story-counting] {
  position: relative;
  visibility: hidden;
}

[data-story-countup][data-story-counting]::before {
  content: attr(data-story-counting);
  position: absolute;
  left: 0;
  top: 0;
  visibility: visible;
}

/* Wide content scrolls inside its own container — the body never scrolls
   sideways at 390px (§11). */

.sn-story {
  overflow-x: clip;
}

.sn-story [data-story-scroller] {
  overflow-x: auto;
  scrollbar-width: none;
}

.sn-story [data-story-scroller]::-webkit-scrollbar {
  display: none;
}

/* FIND IN THIS DAY — non-matching minutes dim (§8).
   A PRESENTATIONAL marker and never a gate. Everything it dims is already in
   the served HTML, which is exactly why the LAYERS this reader may not have are
   taken out of the payload upstream instead of being hidden here: `opacity` on
   a node whose contents were serialised into the page is the same paragraph,
   one View Source away.
   It is cleared when the search closes, and on unmount, so nobody is left
   reading a greyed-out story. */

.sn-story [data-story-entry][data-story-dim] {
  opacity: 0.3;
  filter: saturate(0.5);
}

@media (prefers-reduced-motion: no-preference) {
  .sn-story [data-story-entry] {
    transition-property: transform, opacity;
  }
}
