[workspace]
members = ["crates/encoder"]
resolver = "2"

[package]
name = "setnayan-desktop"
version = "0.0.1"
description = "Setnayan desktop wrapper (macOS + Windows + Linux)"
authors = ["Setnayan"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "setnayan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Desktop OAuth: open the provider consent flow in the system browser and catch
# the redirect on a temporary localhost loopback (Google refuses OAuth inside the
# embedded WebView). tauri-plugin-oauth runs the loopback; tauri-plugin-opener
# opens the external browser. Both are driven from the bundled web app via
# window.__TAURI__ (withGlobalTauri) under the scoped capability in capabilities/.
tauri-plugin-oauth = "2"
tauri-plugin-opener = "2"
# S12 (build-sessions/encoder/S12.md) — the auto-updater. Default features
# (`rustls-tls`, and the confusingly-named `zip` feature which actually gates
# `tar`+`flate2`, the crates the REAL macOS `.app.tar.gz` extraction path
# needs — see tauri-plugin-updater's own `updater.rs`) are exactly what this
# project wants: rustls to match every other reqwest use here, both platforms'
# real install paths compiled in.
tauri-plugin-updater = "2"
# S8 (build-sessions/encoder/S8.md) — the hosted-channel stream-key exchange.
# rustls, NOT the platform TLS stack / OpenSSL (rule 22's "reqwest (rustls, no
# OpenSSL)"): default-features = false drops reqwest's default `default-tls`.
# json: the exchange endpoint speaks JSON in and out.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Zeroises the stream key's backing memory on drop / explicit forget — Part C.
zeroize = "1"

# The native RTMPS/FLV encoder. Its own crate since 2026-09-05 so it can be
# tested on every PR without compiling tauri — `crates/encoder/Cargo.toml`
# explains why at length. Depended on here (rather than merely living beside
# the app) so the desktop build still proves it links.
setnayan-encoder = { path = "crates/encoder" }
# S5 (build-sessions/encoder/S5.md) — the bounded producer/consumer channel
# between `encoder_push`/`encoder_config` (encoder_ipc.rs) and the stub sink
# task S6 replaces. `rt`+`macros` so `#[tauri::command] pub async fn
# encoder_start` can `tokio::spawn` the sink loop from inside Tauri's own
# async runtime (which is tokio already) rather than needing a second one.
tokio = { version = "1", features = ["sync", "rt", "macros"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Any transitive `rml_rtmp` resolves to the vendored copy too, so there is exactly
# one RTMP implementation in the binary. See vendor/rml_rtmp/NOTICE.md.
[patch.crates-io]
rml_rtmp = { path = "vendor/rml_rtmp" }
