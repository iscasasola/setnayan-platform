name: migration-drift-monitor

# Watches for the ONE failure class behind ~every migration incident in this
# repo: a migration reaches the prod ledger BEFORE its PR merges (a local
# `db push` from a feature worktree, an MCP apply, a raw `db query`). That
# "orphan" (ledger row, no file on main) jams `supabase db push` for everyone,
# and later-merged migrations then silently STRAND (shipped in code via Vercel,
# never applied to the DB) until a user hits a broken feature — sometimes days
# later. This job makes that visible in minutes instead of days.
#
# It runs `scripts/migration-doctor.mjs`, which diffs the prod ledger against
# origin/main and FAILS (red workflow → GitHub e-mails the owner) when it finds:
#   • an ORPHAN   — ledger row with no file on main (jams the pipeline), or
#   • a STRANDED  — merged-but-unapplied migration older than the grace window.
# Freshly-merged files still within the grace window are treated as normal
# post-merge apply latency, NOT drift, so a green apply run never trips this.
#
# It uses the SAME three pieces of state as supabase-migrations.yml
# (SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD secrets, SUPABASE_PROJECT_REF
# variable) and, like that workflow, GREEN no-ops until they are set.

on:
  # ── The 2-hourly schedule was REMOVED 2026-07-30 (Setnayan is cron-free —
  # owner 2026-07-12, after stuck Vercel crons; memory
  # project_setnayan_cron_free). Drift is now caught by the EVENT that can cause
  # it: an apply finishing. ──
  #
  # ⚠ `deploy-prod` is listed FIRST and matters most. Since the
  # migrate-then-deploy cutover it is the primary applier — it runs
  # `db push --include-all` on every push to main, while `supabase-migrations`
  # only fires on merges touching supabase/migrations/**. Watching only the
  # latter (as this did) would have meant the drift check almost never ran after
  # the cutover: a schedule removed without re-pointing this list would have been
  # a silent loss of coverage, not a saving.
  workflow_run:
    workflows: ['deploy-prod', 'supabase-migrations']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: migration-drift-monitor
  cancel-in-progress: true

jobs:
  check:
    name: check ledger vs main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      DO_NOT_TRACK: '1'
    steps:
      - name: Gate — is the DB configured?
        id: gate
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Drift monitor dormant::Set the SUPABASE_* secrets/variable to enable (see supabase-migrations.yml header)."
          fi

      # Full history + all origin branches so the doctor can name the branch that
      # still carries an orphan's file (its owning, not-yet-merged PR).
      - name: Checkout (full history)
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all origin branches (for orphan → owning-branch mapping)
        if: steps.gate.outputs.enabled == 'true'
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' || true

      - name: Setup Node
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        if: steps.gate.outputs.enabled == 'true'
        uses: supabase/setup-cli@v1
        with:
          # PINNED, not `latest`. Supabase CLI v2.112.0 (released 2026-08-07
          # 10:08 UTC) broke `supabase link` with
          #   failed to get api keys: SchemaError(Expected a string matching the RegExp ...)
          # — it validates a timestamp the API returns against a stricter
          # RFC3339 regex than the API emits. Every prod deploy from 11:17 that
          # day failed at the link step, so THREE migrations merged green and
          # never reached the database: venue dimensions (the column did not
          # exist while the code reading it was live), creator-offers-free, and
          # an OAuth credential backfill.
          #
          # 🔑 `version: latest` means a third party can break this pipeline
          # without anyone touching this repo — and it fails AFTER the merge, so
          # CI is green and nobody is told. v2.111.0 (2026-07-31) is the last
          # release every deploy succeeded on.
          #
          # To move off the pin: bump it deliberately and watch one deploy go
          # green. Do not put `latest` back.
          version: 2.111.0

      - name: Link to Supabase project
        if: steps.gate.outputs.enabled == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Run migration doctor (fails on real drift)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -o pipefail
          node scripts/migration-doctor.mjs --linked | tee "$GITHUB_STEP_SUMMARY"
