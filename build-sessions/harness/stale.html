     * "Facebook grey #F0F2F5 page + white cards" direction. Owner chose warm
     * over cool the same week; page and card are deliberately the SAME cream,
     * so the `paper`→`cream` alias in tailwind.config.ts stays intact and the
     * 337 hardcoded `bg-white` files need no audit. Card separation is carried
     * by border + shadow, not by a second surface value.
     *
     * Gold is UNCHANGED and keeps every decorative role (active tabs, rules,
     * pills, eyebrows, selected states) — the accent budget stays at two.
     *
     * ⚠ THE PAGE IS WHITE AGAIN — owner, 2026-08-20: *"let's also make the
     * background not beige. let's keep it same color as facebook/youtube.
     * having a white background."* This reverses the 2026-07-13 move to cream

     * because a later reader will find that lock and need to know it was the
     * owner who lifted it.

     * EVERY RATIO IMPROVED AND NONE REGRESSED — white is lighter than cream, so

  /* accent hover → #A88340 */

  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;

  color: rgb(var(--color-ink));

/* Touch targets ≥ 44pt per kickoff multi-platform rules. */

button,
  [role='button'],
  a.button,
  input[type='submit'] {
  min-height: 44px;

/*
   * Press feedback (owner directive 2026-05-31 — "buttons don't feel like
   * buttons; no animation when pressed"; made universal 2026-06-13). We kill
   * the default mobile tap-highlight above, so every button-like control needs
   * its own press response or taps feel dead. Give a quick scale-down + slight
   * darken on :active and pointer cursor. Excludes :disabled / [aria-disabled].
   *
   * Uses the standalone `scale` PROPERTY, NOT `transform: scale()`. This is the
   * key to it being truly universal: `scale` is its own property, so it
   * COMPOSES with whatever `transform` an element already carries (a seat-plan
   * table is `translate(-50%,-50%) scale(N)`, nav pills/cards may be
   * translated, etc.). The old `transform: scale(0.96)` silently CLOBBERED
   * those transforms on press — the element jumped instead of pressing. With
   * the `scale` property the press composes everywhere. (Modern browsers only;
   * very old engines just skip the press scale — graceful, no breakage.)
   *
   * `.m-btn` (template utility) carries its own more-specific hover/active —
   * left intact. prefers-reduced-motion (block below) snaps it instantly,
   * which is still felt as feedback.
   */

/* `.sn-press` — same press feedback as an OPT-IN for <Link>-based cards
   * (home-launcher pixel pass 2026-07-15: event cards, ghost card, space rows,
   * moment rows, the Play pill), which the button-shaped selectors below can't
   * match. Base-layer on purpose so Tailwind transition utilities on the same
   * element keep winning exactly as they do for buttons. */

button,
  [role='button'],
  a.button,
  .sn-press,
  input[type='submit'],
  input[type='button'],
  summary {
  transition: scale 0.13s cubic-bezier(0.2, 0.7, 0.2, 1),
      filter 0.13s ease;
}

button:not(:disabled),
  [role='button']:not([aria-disabled='true']),
  a.button,
  input[type='submit']:not(:disabled),
  input[type='button']:not(:disabled),
  summary {
  cursor: pointer;
}

button:not(:disabled):active,

 * Hanken Grotesk (--font-hanken) + Space Mono (--font-space-mono) are loaded
 * in app/layout.tsx and are the ONLY chrome families going forward. The
 * variables below keep every shipped consumer working without churn:
 *   - --font-app          was Source Sans 3 (retired) — dashboards inherit
 *     it through `.app-surface`, which now resolves to Hanken.
 *   - --font-*-marketing / --font-condensed  were the retired v2.1 quartet
 *     (Saira Condensed / Geist / Instrument Serif / JetBrains Mono).
 * Root --font-sans / --font-display / --font-mono deliberately KEEP their
 * Cormorant / Manrope / DM Mono faces: the /[slug] guest invitation surfaces
 * are owner-excluded from the reskin and inherit those root vars. Chrome
 * scopes (.app-surface below · marketing pages as they restyle in Phase 3)
 * opt in to the Atelier faces instead.
 */

:root {
  /* Chrome typography = Atelier everywhere (2026-07-12 consistency pass).
   * The editorial Cormorant/Manrope/DM Mono faces now load under
   * --font-editorial-* (app/layout.tsx) and reach pages ONLY through the
   * .sn-editorial scope below — applied at the /[slug] guest-tree root, the
   * one surface family owner-excluded from the reskin. Everything else
   * (marketing + dashboards + tools) reads the Atelier faces. */
  --font-display: var(--font-hanken);
  --font-sans: var(--font-hanken);
  --font-mono: var(--font-space-mono);
  --font-app: var(--font-hanken);
  --font-condensed: var(--font-hanken);
  --font-sans-marketing: var(--font-hanken);
  --font-serif-marketing: var(--font-hanken);
  --font-mono-marketing: var(--font-space-mono);
}

/*
 * Universal "bounce on pick" — the companion to the press feedback above, for
 * SELECTION states (a table / seat / card / tab just became picked). A 15%
 * scale pop that overshoots and settles. Like the press rule it uses the
 * standalone `scale` PROPERTY, so it composes with any element's existing
 * `transform` instead of clobbering it — drop `.sn-bounce` on anything,
 * however it's already positioned, and it bounces in place.
 *
 * Re-trigger: a CSS animation only plays when the element starts matching /
 * mounts, so to replay on EACH new selection give the bouncing element a React
 * `key` that changes per selection (it remounts and the animation runs from 0),
 * or toggle the class. The global prefers-reduced-motion block above freezes it
 * to instant. `transform-origin` is centre by default → it pops about its own
 * middle.
 */

@keyframes sn-pick-bounce {
  0% {
    scale: 1;
  }

  38% {
    scale: 1.15;
  }

  68% {
    scale: 0.98;
  }

  100% {
    scale: 1;
  }
}

.sn-bounce {
  animation: sn-pick-bounce 0.42s cubic-bezier(0.2, 0.7, 0.2, 1);
  /* Promote to its own layer so the pop never reflows neighbours. */
  will-change: scale;
}

/*
 * Canonical bottom-nav pill travel-stretch — owner-locked 2026-06-13
 * (project_setnayan_bottom_nav_canonical). The active pill in <BottomNav>
 * gives a subtle horizontal "liquid" stretch as it glides between tabs.
 * Re-triggered by keying the inner pill on the active index (remount →
 * replay). Peak + duration read the --bn-stretch / --bn-dur custom props
 * set on the nav root, so the whole interaction retunes from ONE place.
 * This nav treatment supersedes the generic .sn-bounce for bottom navs.
 */

@keyframes nav-pill-travel {
  0% {
    transform: scaleX(1);
  }

  45% {
    transform: scaleX(var(--bn-stretch, 1.1));
  }

  100% {
    transform: scaleX(1);
  }
}

.nav-pill-stretch {
  animation: nav-pill-travel var(--bn-dur, 500ms) cubic-bezier(0.34, 1.4, 0.5, 1);
}

/*
 * Canonical bottom-nav press-light — a one-shot white bloom under the
 * finger on press-DOWN (project_setnayan_bottom_nav_canonical). Runs to
 * completion on every tap (re-keyed per press), so even a quick tap shows
 * the full bloom-and-fade — it is NOT tied to holding. Peak brightness
 * reads the --bn-glow knob; duration reads --bn-dur. Ends at opacity 0 so
 * the element reverts to its hidden inline base between taps.
 */

@keyframes nav-press-flash {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scaleX(0.6);
  }

  28% {
    opacity: calc(var(--bn-glow, 1.5) * 0.62);
    transform: translate(-50%, -50%) scaleX(1);
  }

  100% {
    opacity: 0;
    transform: translate(-50%, -50%) scaleX(1);
  }
}

.nav-press-flash {
  animation: nav-press-flash var(--bn-dur, 500ms) ease-out;
}

/*
 * Pill segmented control — the shared in-page MENU template (owner-locked
 * 2026-06-14 "make each menu a pill, not rectangles"). A rounded pill TRACK
 * holding evenly-sized options; the active option is a raised pill. Matches
 * the floating-pill bottom nav's pill language so every menu in the app reads
 * consistently. Apply `.sn-seg` to the container, `.sn-seg-item` to each
 * option, and mark the active one with aria-selected / aria-current="page" /
 * `.is-active`. Logic (handlers/state) is the caller's — this is style only.
 */

.sn-seg {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: var(--m-r-full);
  background: color-mix(in srgb, var(--m-ink) 5%, transparent);
  border: 0.5px solid var(--m-line);
}

.sn-seg-item {
  flex: 1 1 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 34px;
  padding: 0 10px;
  border: 0;
  background: transparent;
  border-radius: var(--m-r-full);
  color: var(--m-slate);
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s ease, background 0.2s ease;
}

.sn-seg-item:disabled {
  opacity: 0.5;
  cursor: default;
}

.sn-seg-item[aria-selected='true'],
.sn-seg-item[aria-current='page'],
.sn-seg-item.is-active {
  background: var(--m-paper);
  color: var(--m-ink);
  box-shadow: 0 1px 3px rgba(30, 34, 41, 0.12);
}

/*
 * .subnav-lift — the "lift" reveal for the reusable <SubNav> (the section
 * sub-nav docked above the bottom nav · owner-picked 2026-06-16 · component at
 * app/_components/nav/sub-nav.tsx). Plays ONCE on mount, so it fires when a
 * tab's page enters (e.g. /vendors → Explore) and NOT when switching between
 * sub-tabs (those are client-state, no remount). The pill starts tucked 16px
 * lower (it sits a hair behind the nav at z-20 < nav's z-30, so it appears to
 * rise out of the dock) and settles into place as it fades in. `both` holds the
 * end frame. Decelerating ease so it eases into rest, never overshoots.
 */

@keyframes subnav-lift {
  from {
    opacity: 0;
    transform: translateY(16px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

.subnav-lift {
  animation: subnav-lift 200ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

@media (prefers-reduced-motion: reduce) {
  .subnav-lift {
    animation: none;
  }
}

/*
 * Journey view (event-lifecycle arc, /schedule ?view=journey) — entrance
 * choreography. Pure CSS so the Journey mode stays a server component. Every
 * animation here is frozen to instant by the global prefers-reduced-motion
 * block above, so reduced-motion users still get the fully-rendered page (no
 * JS gate). Stagger is driven by an inline `--journey-delay` custom property
 * the component sets per element, so the arc → phase headers → rows cascade in
 * top-to-bottom.
 *
 *   .journey-rise      — fade + lift for the arc, phase headers, and each row
 *   .journey-rail-fill — the progress bar grows left→right once on mount
 *   .journey-today     — the "you are here" marker pops in, then breathes
 *   .journey-node-pop  — milestone nodes scale-in (uses the `scale` PROPERTY so
 *                        it composes with the node's left/top positioning)
 */

@keyframes journey-rise {
  from {
    opacity: 0;
    transform: translateY(14px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

.journey-rise {
  animation: journey-rise 460ms cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: var(--journey-delay, 0ms);
}

@keyframes journey-rail-grow {
  from {
    transform: scaleX(0);
  }

  to {
    transform: scaleX(1);
  }
}

.journey-rail-fill {
  transform-origin: left center;
  animation: journey-rail-grow 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
  animation-delay: 160ms;
}

@keyframes journey-today-in {
  from {
    opacity: 0;
    scale: 0.3;
  }

  to {
    opacity: 1;
    scale: 1;
  }
}

@keyframes journey-beacon {
  0%,
  100% {
    scale: 1;
    box-shadow: 0 0 0 0 rgb(var(--color-mulberry) / 0.4);
  }

  50% {
    scale: 1.14;
    box-shadow: 0 0 0 5px rgb(var(--color-mulberry) / 0);
  }
}

.journey-today {
  animation:
    journey-today-in 400ms cubic-bezier(0.2, 0.7, 0.2, 1) both 900ms,
    journey-beacon 2.6s ease-in-out infinite 1500ms;
}

@keyframes journey-node-pop {
  0% {
    opacity: 0;
    scale: 0.2;
  }

  70% {
    opacity: 1;
    scale: 1.18;
  }

  100% {
    opacity: 1;
    scale: 1;
  }
}

.journey-node-pop {
  animation: journey-node-pop 440ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: var(--journey-delay, 0ms);
}

/*
 * Bottom-clearance for a docked <SubNav>. When a section shelf is on screen it
 * flags <html> — <GuestsSectionSubnav> uses `guests-subnav-docked`,
 * <VendorsSectionSubnav> (Explore/Services takeover) uses the shared
 * `subnav-docked`, and <TeamSummaryChip> (the Marketplace's mobile team chip,
 * which replaced that takeover dock) uses its own `teamchip-docked` so two
 * components can never fight over one class — and the floating pill sits ~76px–132px above the viewport
 * bottom, above the layout's own pb-20 (80px) for the bottom nav. Without extra
 * room the last ~50px of scrolling content would hide behind the pill, so give
 * the shell-main column enough bottom padding to clear it. Mobile-only — the
 * pill is lg:hidden, so cancel the padding on desktop where it would just be
 * dead space.
 */

html.guests-subnav-docked [data-shell-main],
html.teamchip-docked [data-shell-main],
html.subnav-docked [data-shell-main] {
  padding-bottom: calc(env(safe-area-inset-bottom) + 8.5rem);
}

/*
 * ⭐ LIVE STUDIO CONTROLLER · WAVE 8 (§ 4g) — THE MONITOR YIELDS TO A WARNING.
 *
 * The controller is a fixed, scroll-free viewport: every row is `shrink-0` except
 * the camera grid, so anything that appears has to come out of the grid's height.
 * The Wave 7 broadcast-window strip is exactly that — it materialises mid-show on
 * a time crossing, and two of them can be up at once (day ending + 12-hour archive
 * cap). MEASURED at 360×640 with both up, the grid fell to 27px: still scrolling,
 * still not overflowing, but too small to be a camera grid.
 *
 * So the CH 1 monitor gives the space back for as long as a warning is showing. It
 * is the right thing to shrink: the picture is `object-cover` and every overlay is
 * positioned against the box, so a shorter monitor crops rather than breaks, while
 * a squeezed grid costs the operator the ability to cut.
 *
 * Written here rather than as a utility because it needs `:has()` on a PREVIOUS
 * sibling's ancestor — the warning renders after the monitor, and CSS has no
 * previous-sibling combinator. Degrades safely: a browser without `:has()` simply
 * keeps the 34dvh cap (the pre-Wave-8 measured behaviour), and nothing overflows
 * either way. Scoped to `[data-lsc-*]`, which only the controller emits.
 */

[data-lsc-left]:has([data-lsc-window]:not(:empty)) [data-lsc-monitor] {
  max-height: 20dvh;
}

@media (min-width: 1024px) {
  /* Desktop has the height to spare — the two-column layout puts the grid in its
     own column, so a warning does not compete with it. */

  [data-lsc-left]:has([data-lsc-window]:not(:empty)) [data-lsc-monitor] {
    max-height: 40dvh;
  }

  html.guests-subnav-docked [data-shell-main],
  html.teamchip-docked [data-shell-main],
  html.subnav-docked [data-shell-main] {
    padding-bottom: 0;
  }
}

@keyframes sk-shimmer {
  to {
    background-position: 150% 0;
  }
}

@keyframes loading-status-fade {
  from {
    opacity: 0;
    transform: translateY(3px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

/*
 * Aurora hero motion — iteration 0015 § Section 2 visual differentiation.
 * Two warm-toned radial gradients that slowly drift across the hero, blended
 * behind the photographic backdrop. Pure CSS keyframes — no JS, no
 * runtime cost beyond compositor-only `transform` updates (GPU-accelerated).
 *
 * The aurora layer is intentionally subtle (~10–15% opacity); it's meant to
 * make the hero feel alive without competing with the headline or any
 * eventual photograph. Inspired by the Aceternity/Magic UI aurora pattern
 * but hand-rolled so we don't take on a third-party motion lib.
 *
 * `prefers-reduced-motion: reduce` is already handled by the global block
 * above which forces `animation-duration: 0.001ms`. No extra guard needed.
 */

@keyframes aurora-drift-1 {
  0%,
  100% {
    transform: translate3d(-8%, -6%, 0) scale(1);
  }

  50% {
    transform: translate3d(6%, 4%, 0) scale(1.05);
  }
}

@keyframes aurora-drift-2 {
  0%,
  100% {
    transform: translate3d(6%, 8%, 0) scale(1.02);
  }

  50% {
    transform: translate3d(-4%, -6%, 0) scale(0.96);
  }
}

@keyframes aurora-drift-3 {
  0%,
  100% {
    transform: translate3d(0%, 0%, 0) scale(0.95);
  }

  50% {
    transform: translate3d(-3%, 5%, 0) scale(1.04);
  }
}

/*
 * Service-poster motion — owner directive 2026-05-23 PM:
 * "services must look like live/animated posters instead of cards."
 *
 * Three keyframe variants drive every poster on the add-ons grid. Each
 * service picks one variant via its catalogue `poster.motion`:
 *   - poster-drift: slow radial gradient drift (calm services — Orders,
 *     Photo Delivery, Landing Page)
 *   - poster-pulse: centered scaling pulse (creative/generative services —
 *     Papic, Music Creator, Monogram Creator)
 *   - poster-scan: horizontal sweep line (broadcast/render services —
 *     Panood, Save the Date Video, Patiktok, Paprint, LED Background)
 *
 * All three are transform/opacity-only so they composite on the GPU
 * without forcing layout/paint. `will-change: transform` hints the
 * compositor to promote the layer once. `prefers-reduced-motion: reduce`
 * is already handled by the global block at line 114 — keyframe duration
 * collapses to 0.001ms so reduced-motion users see a still poster.
 *
 * Color-on-poster comes from the catalogue's per-service backgrounds, set
 * inline by the Services tab (plan-budget-accordion.tsx); this stylesheet only owns the motion
 * primitives so adding a new service is one variant pick + one color
 * pair, never a CSS edit.
 */

@keyframes poster-drift {
  0%,
  100% {
    transform: translate3d(-6%, -4%, 0) scale(1.05);
  }

  50% {
    transform: translate3d(4%, 6%, 0) scale(1.1);
  }
}

@keyframes poster-pulse {
  0%,
  100% {
    transform: scale(1) translate3d(0, 0, 0);
    opacity: 0.7;
  }

  50% {
    transform: scale(1.15) translate3d(0, 0, 0);
    opacity: 1;
  }
}

@keyframes poster-scan {
  0% {
    transform: translate3d(-110%, 0, 0) skewX(-12deg);
    opacity: 0;
  }

  10% {
    opacity: 0.55;
  }

  90% {
    opacity: 0.55;
  }

  100% {
    transform: translate3d(110%, 0, 0) skewX(-12deg);
    opacity: 0;
  }
}

/*
 * Marketing palette — WARM EDITORIAL ARCHIVE (owner 2026-08-01).
 *
 * Supersedes the Clean Editorial lock of 2026-05-29 (alabaster · obsidian ·
 * champagne · obsidian CTA), which itself superseded the v2.1 burnt-sienna
 * register. The register moves back toward warm — an editorial, magazine
 * canvas for a Filipino-first event platform — while keeping gold.
 * The 4 canonical colours:
 *   #FDFBF7 Soft Cream        → --m-paper     (60% background)
 *   #2C2A29 Espresso          → --m-ink       (30% text/structure)
 *   #A9834B Champagne Gold    → --m-orange    (10% accent · token name kept)
 *   #C24E25 Terracotta        → --m-mulberry  (CTA buttons · token name kept)
 *
 * Token names retained (esp. --m-orange, --m-mulberry) to avoid 200+ file
 * churn — a value-only swap auto-propagates through every component that
 * consumes `var(--m-*)`. The app-chrome family (--color-*) is kept in step
 * at the top of this file; the two must not drift.
 *
 * USAGE: in a marketing component, reference these via
 *   style={{ background: 'var(--m-mulberry)' }}
 * or via Tailwind arbitrary syntax
 *   className="bg-[var(--m-mulberry)]"
 *
 * WCAG measured against #FDFBF7 (not estimated — recomputed 2026-08-01):
 *   espresso on cream        13.82:1  AAA
 *   white on terracotta CTA   4.76:1  AA   ← .m-btn-primary labels with #fff
 *   slate indigo on cream     8.22:1  AAA  ← links + secondary buttons
 *   champagne on cream        3.37:1  NON-TEXT UI + LARGE TEXT ONLY
 *                                     (WCAG 1.4.11; escalate --m-orange-2
 *                                      #8A6B39 → 4.79:1 AA when gold must
 *                                      carry real text)
 *
 * ⚠ The obsidian CTA this replaces measured 16.42:1. The drop to 4.76:1 is a
 * deliberate exchange — the CTA now reads as a brand accent rather than as
 * text. It is still AA. Do not lighten it toward the originally-requested
 * #E05A2B (3.71:1); that fails with every possible label.
 */

:root {
  /* Surfaces — Soft Cream (Warm Editorial Archive 2026-08-01 · was Warm
   * Alabaster #FBFAF7 · before that warm paper #FBF8F2). Kept in step with
   * --color-cream above; the two families must not drift. */
  --m-paper:      #FFFFFF;
  --m-paper-2:    #F4F2EC;
  --m-ivory:      #EDEAE0;
  --m-line:       #E1DCD1;
  --m-line-soft:  #EDE8DE;
  /* Ink — Espresso (Warm Editorial Archive 2026-08-01 · was Atelier warm ink
   * #1B1A17 · before that slate #2D3038). 13.82:1 on #FDFBF7 — AAA. */
  --m-ink:        #2C2A29;
  --m-slate:      #3A382F;
  --m-slate-2:    #6E6A62;
  --m-slate-3:    #8A857B;
  --m-slate-4:    #B5AF9E;
  /* Accent — Royal Champagne Gold (Clean Editorial · was burnt sienna #C96B3A) */
  --m-orange:     #A9834B;
  --m-orange-2:   #8A6B39;
  --m-orange-3:   #CBA766;
  --m-orange-4:   #F3ECDF;
  /* Deep gold — the ONLY gold that may carry TEXT. #A9834B/#8A6B39 score
     3.37:1 / 4.21:1 against the pale gold wash, below the 4.5:1 AA floor for
     normal text; this clears it at 7.50:1. Same value as tailwind
     terracotta-800. Added 2026-08-08 with lint-label-on-fill-contrast.mjs. */
  --m-orange-deep: #5C4726;
  /* Chrome nav active-state — Atelier GOLD (owner-locked 2026-07-12 design
   * finalization: gold supersedes wine; kit gold-700 for text/active contrast).
   * The 2026-07-09 wine treatment is retired — chrome and content now share
   * the one gold decorative family, so the old rail/content seam is gone. */
  --m-nav-active:      #8A6B39;
  /* = --color-mulberry (light) — active bar · icon · focus ring */
  --m-nav-active-soft: color-mix(in srgb, var(--m-nav-active) 10%, #ffffff);
  /* active-row wash — matches the lightness of the old --m-orange-4 gold wash */
  /* Admin doorway accent — RETIRED (Glass PR-1, 2026-07-15). Violet is gone:
   * admin's identity is the ShieldCheck + "HQ" label, not a colour fork (kit
   * rule: gold is the only decorative colour). The Internal role badge now uses
   * the warm info-slate semantic; the sidebar-header dot uses --m-sidebar-accent
   * (gold). */
  /* Vendor doorway accent — PHOTOGRAPHY BLUE: RETIRED (gold-only finalization,
   * 2026-07-12). The vendor Overview's rings/eyebrows/KPI accents are gold; the
   * `--v-blue` token had zero remaining consumers, so its definition is gone.
   * The vendor identity is carried by the ShieldCheck + shop label, not a colour
   * fork (kit rule: gold is the only decorative colour). */
  /* CTA — TERRACOTTA (Warm Editorial Archive 2026-08-01; token name `mulberry`
   * kept, as it has been through obsidian and gold, to avoid call-site churn).
   * This is the family behind the marketing "Start planning · free" button via
   * .m-btn-primary below, which labels with literal `#fff` → 4.76:1, AA.
   * (Kept in step with --color-mulberry above; the two families must not drift.)
   *
   * ⚠ TRADE-OFF, stated so nobody "fixes" it later: the obsidian CTA this
   * replaces measured 16.42:1 — the strongest a button could be, because the
   * CTA WAS the ink colour. Terracotta is a deliberate drop to 4.76:1 in
   * exchange for the CTA reading as a brand accent rather than as text.
   * Still AA; do not lighten it further (the owner's original #E05A2B was
   * 3.71:1 and failed).
   *
   * ⚠ -3 and -4 are NOT terracotta and must NOT be "corrected" to match.
   * They stopped being CTA tints long ago: --m-mulberry-3 is consumed as
   * MUTED LIGHT TEXT ON DARK (vendor-grow-sections.tsx sets it as `color`
   * over `background: var(--m-ink)`; vendor-tier-matrix.tsx does the same),
   * plus the disabled-button fill. Making them orange would put terracotta
   * body copy on the vendor pages. Left neutral on purpose. */
  --m-mulberry:    #C24E25;
  --m-mulberry-2:  #B04722;
  --m-mulberry-deep: #974930;
  /* text on a mulberry WASH (5.38:1; the plain CTA on it is 4.04:1) */
  --m-mulberry-3:  #C9CBCE;
  /* neutral — light text on dark + disabled fill (see above) */
  --m-mulberry-4:  #ECEDEE;
  /* neutral — pairs with -3 */
  /* Supporting (retained from v2.1 pending owner future call) */
  --m-blush:      #F4D7C9;
  --m-blush-deep: #B65A3A;
  --m-blush-deepest: #783B28;
  /* label on --m-blush (6.28:1; -deep on it is 3.41:1) */
  --m-sage:       #C5D2BD;
  --m-sage-deep:  #4F6B4A;
  --m-sage-deeper: #3C5237;
  /* label on --m-sage (5.44:1; -deep on it is 3.77:1) */
  /* Semantic */
  --m-accent:      var(--m-orange);
  --m-accent-deep: var(--m-orange-2);
  --m-cta:         var(--m-mulberry);
  --m-cta-deep:    var(--m-mulberry-2);
  /* Radii */
  --m-r-xs: 4px;
  --m-r-sm: 8px;
  --m-r-md: 14px;
  --m-r-lg: 22px;
  --m-r-xl: 36px;
  --m-r-full: 999px;
  /* Shadows (Obsidian-tinted · paper-friendly · was rgba(45,48,56,…) for v2.1 ink) */
  --m-shadow-sm: 0 1px 2px rgba(30,26,18,.05), 0 1px 1px rgba(30,26,18,.04);
  --m-shadow-md: 0 8px 24px -10px rgba(30,26,18,.18), 0 2px 6px -2px rgba(30,26,18,.08);
  --m-shadow-lg: 0 40px 80px -30px rgba(30,26,18,.28), 0 10px 30px -8px rgba(30,26,18,.10);
  /*
   * ⚠ `--sidebar-width` IS GONE (2026-08-15). It existed for one reader,
   * `sidebar-shell.tsx`, and that file was deleted when the shared rail took

   */
  /*
   * ── Sidebar chrome — Atelier frosted glass (2026-07-12; was the dark
   *    obsidian island of the 2026-07-09 "Energy" reskin) ─────────────────

   * vendor,admin}-energy.html): the DESKTOP sidebar is a permanently-dark

   *
   * Consumed EXPLICITLY by the shared nav primitives (sidebar-item ·
   * sidebar-section) + the sidebar-owned chrome (doorway-sidebar-header ·
   * customer-sidebar).
   *
   * ⚠ NONE OF THOSE IS MOUNTED ANY MORE (the shared rail took the desktop

   * to remap these onto the panel went with `sidebar-shell.tsx` on 2026-08-15.

  /* elevated tiles — switcher · identity · footer chips */

  /* warm ink — active label · wordmark · primary text */
  --m-sidebar-fg-soft:   #3A382F;
  /* inactive nav labels · icons */
  --m-sidebar-fg-muted:  #6E6A62;
  /* section labels · chevrons · sub-text */
  /* 2026-07-28 — .08 → .12. This is the sidebar's OUTER edge as well as its
     internal dividers (sidebar-shell.tsx borderColor), and the sidebar is a
     45%-white frosted panel: on the warm-white ground its FILL computes 1.03:1
     against the page, i.e. the rail has no body of its own and the hairline is
     the only thing separating it from the content area. At .08 that hairline
     was 1.14:1; .12 takes it to 1.22:1. Kept deliberately subtle — this token

  --m-sidebar-line:      rgba(30,26,18,.12);
  /* hairline dividers on glass */

  /* hover-row wash */

/*

 */

/*

/*

/* ----------------------------------------------------------------------------
 * Native-app feel — kill UNEXPECTED zoom, keep deliberate pinch-zoom.
 *
 * Three real-device papercuts that make the installed PWA stop feeling like a
 * native app:
 *
 *   1. iOS focus-zoom. Mobile Safari auto-zooms into any form field whose
 *      *computed* font-size is < 16px and never fully settles back — the classic
 *      "tapped a field and the whole screen zoomed in and won't let go" bug.
 *      Inputs are `font: inherit` (Tailwind preflight), so a field nested inside
 *      a `text-sm` / `text-xs` wrapper silently renders at 14px and trips it.
 *      A 16px floor on text-entry controls is the fix. Scoped to `pointer:
 *      coarse` so desktop form density (intentional 14px inputs) is untouched,
 *      and left UNLAYERED on purpose so it outranks the Tailwind `text-sm`
 *      utility — unlayered CSS beats any @layer, including @layer utilities.
 *      The `!important` is load-bearing: several fields (e.g. /login, /signup
 *      FormFields) set `style={{ fontSize: 13 }}` INLINE, and an inline
 *      declaration outranks every selector-based rule — layered or not — so
 *      only `!important` lifts those to the 16px floor. Verified no input sets
 *      an inline font-size ABOVE 16, so this only ever raises, never shrinks.
 *
 *   2. Double-tap-to-zoom + the legacy 300ms tap delay + PINCH-zoom.
 *      `touch-action: pan-x pan-y` on the root removes all three for the whole
 *      tree (touch-action intersects down through ancestors) while keeping
 *      panning/scrolling. This — not the viewport meta — is the Android/Chromium
 *      pinch-disable lever: `user-scalable=no` / `maximum-scale=1` in the meta
 *      would do it too, but that trips the Lighthouse `meta-viewport` a11y audit
 *      (drops every page below the CI ≥0.9 gate), so the meta stays at
 *      `maximumScale: 5` and the pinch-disable lives here instead.
 *
 *   3. Pull-to-refresh / rubber-band overscroll on the document scroller —
 *      `overscroll-behavior: none` stops the page bouncing like a web page.
 *
 * Pinch-zoom is DISABLED app-wide for a native-app feel (owner directive
 * 2026-06-15): `touch-action: pan-x pan-y` (below) covers Android/Chromium,
 * <ZoomGuard/> (app/_components/zoom-guard.tsx) prevents WebKit `gesturestart`
 * on iOS (which ignores both the viewport meta AND root touch-action for the
 * deliberate pinch), and the 16px input floor above covers the iOS input
 * focus-zoom. The seat-plan editor canvas keeps its gestures: ZoomGuard skips
 * its [data-allow-zoom] subtree, and its own pointer-event pan/pinch runs on a
 * `touch-none` element, so the root touch-action never mattered to it.
 * ⚠ This trades away WCAG 1.4.4 browser pinch-zoom by owner decision;
 * OS-level Accessibility → Zoom remains the user fallback.
 * ------------------------------------------------------------------------- */

@media (pointer: coarse) {
  input:not([type='checkbox']):not([type='radio']):not([type='range']):not([type='color']),
  select,
  textarea {
    font-size: 16px !important;
  }
}

html {
  /* Ancestor of all content → disables double-tap zoom AND pinch-zoom
     site-wide (native-app feel, owner 2026-06-15), keeps panning/scrolling.
     Deliberately NOT the viewport meta (`user-scalable=no`) — that fails the
     Lighthouse `meta-viewport` a11y audit; touch-action doesn't. iOS pinch is
     handled by <ZoomGuard/> (WebKit ignores this for the deliberate pinch). */
  touch-action: pan-x pan-y;
  /* Root scroller → no pull-to-refresh / rubber-band bounce. */
  overscroll-behavior: none;
}

/* ---------------------------------------------------------------------------
 * <SDLoader> — the shared brand "thinking / analyzing" loader.

 * Native port of the `Organic loaders` handoff (owner 2026-06-07). Gold binds

 * The label fade reuses `.loading-status-line` (defined above). The blanket
 * `prefers-reduced-motion: reduce` block above freezes every animation/

@keyframes sd-glow {

}

@keyframes sd-spin {

}

@keyframes sd-blob {

@keyframes sd-td {

@keyframes sd-bloom {

  }

@keyframes sd-overlay-in {

/* Loader variant motion (owner 2026-07-05). The universal prefers-reduced-motion
   block near the top of this file freezes both to a static frame automatically
   (it matches `*`), so no per-selector a11y guard is needed here. */

@keyframes sd-aurora-spin {

    transform: rotate(360deg);
  }

@keyframes sd-sonar {
