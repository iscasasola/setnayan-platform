name: build-desktop

# Produces buildable .app (macOS) + .exe / .msi (Windows) artifacts on every
# push to main and on PRs touching the desktop wrapper, and (S10, 2026-09-05)
# publishes the freshest installers to the PUBLIC `setnayan-media` R2 bucket —
# the actual release channel `/download` and the desktop updater (S12) read
# from. `publish-latest` used to target a `desktop-latest` GitHub Release, but
# that URL 404s for the public: this repo is private, and GitHub Release asset
# URLs require auth regardless of `prerelease`. That publish step is KEPT here
# only as an internal/CI artifact mirror (useful to a logged-in maintainer);
# it is no longer anything `/download` or `lib/desktop-release.ts` points at.
#
# macOS signing: if the APPLE_* repo secrets are present, `tauri build`
# Developer-ID-signs + notarizes the bundle (no Gatekeeper warning on
# download); if they're absent it falls back to ad-hoc signing (the old
# Sprint-0 behavior, so CI never breaks) and the job summary says so LOUDLY —
# an ad-hoc build is not shippable. Windows signing (S11,
# build-sessions/encoder/S11.md) follows the identical gated shape: if the
# SSL_COM_ESIGNER_* repo secrets are present, `tauri build`'s `signCommand`
# (src-tauri/scripts/windows-codesign.ps1) signs the .exe/.msi via SSL.com eSigner
# CodeSignTool (the X0-decided cloud signer — Azure excludes PH orgs, a file
# cert can't sign from Actions since 2023-06-01); if absent, the script is a
# safe no-op and the build stays unsigned exactly as before S11.
# `release.json`'s `windows.signed` and the job summary both reflect whichever
# is true. The desktop-encoder README's rehearsal script (S13) teaches
# "More info → Run anyway" for the SmartScreen warning on an unsigned build.

on:
  # DEFERRED 2026-06-20 (owner): website-first. The desktop (macOS/Windows)
  # builds are now MANUAL-ONLY until the website ships — then the desktop +
  # native (iOS/Android/iPadOS) app phase begins. The previous push:main +
  # pull_request(apps/web/**) triggers ran a macOS (10x minutes) + Windows (2x)
  # Tauri build on EVERY web PR, which dominated GitHub Actions usage. These
  # are non-required checks, so removing the auto-triggers does not gate merges.
  # Re-add `push: { branches: [main] }` + the pull_request block when app work
  # resumes. Run on demand meanwhile: Actions → build-desktop → Run workflow.
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: 'aarch64-apple-darwin'
            # S12: with `bundle.createUpdaterArtifacts: true` (this PR), a
            # non-v1-compatible macOS build ALSO produces `Setnayan.app.tar.gz`
            # + `.sig` next to the `.app` (`tauri-bundler`'s own
            # `updater_bundle.rs`: the updater installs from that .tar.gz, not
            # from the .dmg — a `.dmg` isn't a gzip stream and the plugin's
            # macOS `install_inner` unconditionally treats the download as
            # one). Both must ship alongside the .dmg or the updater manifest
            # has nothing valid to point at.
            artifact-glob: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - platform: windows-latest
            target: 'x86_64-pc-windows-msvc'
            # S12: for a WindowsMsi bundle in non-v1-compatible mode,
            # tauri-bundler signs the .msi directly (no separate zip wrapper —
            # see `tauri-cli`'s `sign_updaters`), so the sibling `.sig` is all
            # that's new here.
            artifact-glob: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig

    runs-on: ${{ matrix.platform }}

    # macOS signing is now GATED (re-added 2026-06-16, fixing the 2026-06-15
    # empty-string bug). The "Configure macOS signing" step below exports the
    # APPLE_* vars to $GITHUB_ENV ONLY when the APPLE_CERTIFICATE secret is
    # non-empty. This is the safe shape: a MISSING secret is never exported as an
    # empty string (an empty APPLE_CERTIFICATE makes `tauri build` attempt a cert
    # import on nothing and fail the whole macOS build — the 2026-06-15 break).
    #   - cert secrets present  → tauri Developer-ID-signs + notarizes; verify step runs.
    #   - cert secrets absent   → nothing exported; ad-hoc fallback step runs (unsigned).
    # So forks / pre-secrets builds still succeed unsigned, exactly as before.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Tauri CLI
        run: pnpm add -g @tauri-apps/cli@^2

      - name: Generate Tauri icons (from icon.svg)
        run: tauri icon src-tauri/icons/icon.svg

      - name: Configure macOS signing (only when the cert secret exists)
        if: matrix.platform == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          A_ID: ${{ secrets.APPLE_ID }}
          A_PW: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "No APPLE_CERTIFICATE secret — macOS build will be UNSIGNED (ad-hoc)."
            exit 0
          fi
          # A real Developer ID cert is present: export the signing vars so the
          # next step's `tauri build` signs + notarizes. Written here (not as
          # job-level env) so an ABSENT secret is never exported as an empty
          # string — empty APPLE_CERTIFICATE fails the whole build (2026-06-15).
          {
            echo "APPLE_CERTIFICATE<<__P12__"
            echo "$CERT"
            echo "__P12__"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$A_ID"
            echo "APPLE_PASSWORD=$A_PW"
            echo "APPLE_TEAM_ID=$TEAM"
          } >> "$GITHUB_ENV"
          echo "Developer ID cert present — macOS build will be SIGNED + NOTARIZED."

      - name: Configure Windows signing (only when eSigner credentials exist)
        # Mirrors the macOS step above: an ABSENT secret is never exported, so
        # src-tauri/scripts/windows-codesign.ps1 (wired via tauri.conf.json's
        # bundle.windows.signCommand) sees no ES_USERNAME and no-ops, leaving
        # the build unsigned exactly as it was before S11. Flipping the four
        # SSL_COM_ESIGNER_* secrets on turns signing on with no code change.
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          ES_USERNAME: ${{ secrets.SSL_COM_ESIGNER_USERNAME }}
          ES_PASSWORD: ${{ secrets.SSL_COM_ESIGNER_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.SSL_COM_ESIGNER_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.SSL_COM_ESIGNER_TOTP_SECRET }}
        run: |
          if [ -z "$ES_USERNAME" ]; then
            echo "No SSL_COM_ESIGNER_USERNAME secret — Windows build will be UNSIGNED (cert ordered in X0, not yet issued)."
            echo "windows_signing_configured=false" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "ES_USERNAME=$ES_USERNAME"
            echo "ES_PASSWORD=$ES_PASSWORD"
            echo "ES_CREDENTIAL_ID=$ES_CREDENTIAL_ID"
            echo "ES_TOTP_SECRET=$ES_TOTP_SECRET"
            echo "windows_signing_configured=true"
          } >> "$GITHUB_ENV"
          echo "SSL.com eSigner credentials present — Windows build will be SIGNED."

      - name: Install SSL.com CodeSignTool (Windows, only when signing configured)
        # Downloads the official Windows release (bundles its own JRE, so no
        # separate Java install) into $RUNNER_TEMP/CodeSignTool. Gated behind
        # the secret check above so a pre-cert build doesn't pay this download
        # on every run for a tool it will never invoke.
        if: matrix.platform == 'windows-latest' && env.windows_signing_configured == 'true'
        shell: pwsh
        run: |
          $ZipPath = Join-Path $env:RUNNER_TEMP "CodeSignTool.zip"
          Invoke-WebRequest -Uri "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip" -OutFile $ZipPath
          Expand-Archive -Path $ZipPath -DestinationPath $env:RUNNER_TEMP -Force
          $Extracted = Get-ChildItem -Path $env:RUNNER_TEMP -Directory -Filter "CodeSignTool*" | Select-Object -First 1
          if (-not $Extracted) {
            Write-Error "CodeSignTool zip did not extract a CodeSignTool* directory — release asset layout may have changed."
            exit 1
          }
          $ToolDir = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          if ($Extracted.FullName -ne $ToolDir) {
            Rename-Item -Path $Extracted.FullName -NewName "CodeSignTool"
          }
          if (-not (Test-Path (Join-Path $ToolDir "CodeSignTool.bat"))) {
            Write-Error "CodeSignTool.bat not found after extraction at $ToolDir."
            exit 1
          }
          Write-Host "CodeSignTool installed at $ToolDir"

      - name: Build desktop bundle
        run: tauri build --target ${{ matrix.target }}
        env:
          # S11: a real ed25519 updater keypair now exists as repo secrets.
          # This is inert until S12 sets bundle.createUpdaterArtifacts + adds
          # tauri-plugin-updater — Tauri only signs updater artifacts when ALL
          # THREE of {createUpdaterArtifacts, this env var, the plugin} are
          # present, so wiring the env var now cannot change today's output.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://placeholder' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://setnayan.com' }}

      - name: Ad-hoc codesign macOS bundle (fallback — only when no Developer ID cert)
        # Skipped once APPLE_SIGNING_IDENTITY is set: `tauri build` has already
        # Developer-ID-signed + notarized the bundle, and re-running an ad-hoc
        # codesign would strip that real signature.
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY == ''
        run: |
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Setnayan.app"
          DMG_PATH=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
          codesign --force --deep --sign - "$APP_PATH"
          xattr -cr "$APP_PATH"
          xattr -cr "$DMG_PATH"
          echo "Ad-hoc signed (unsigned distribution): $APP_PATH"
          echo "## :rotating_light: AD-HOC SIGNED — not shippable :rotating_light:" >> "$GITHUB_STEP_SUMMARY"
          echo "No \`APPLE_CERTIFICATE\` secret — this .dmg is ad-hoc signed, not Developer-ID-signed or notarized. Gatekeeper will refuse to open it on any other Mac. Do not publish this build." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Developer ID signature + notarization (macOS, when signed)
        # Informational: logs the signing authority, Gatekeeper verdict, and
        # whether the notarization ticket is stapled. Non-fatal for now so a
        # transient check can't block the publish; can be hardened to fail-on-
        # reject once a clean run is confirmed.
        if: matrix.platform == 'macos-latest' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Setnayan.app"
          DMG_PATH=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
          echo "== codesign authority =="
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier|flags|Runtime" || true
          echo "== Gatekeeper assessment (.app) =="
          spctl -a -vvv -t exec "$APP_PATH" || true
          echo "== notarization staple (.dmg) =="
          xcrun stapler validate "$DMG_PATH" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: setnayan-desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact-glob }}
          # error (not warn): a desktop build that produces no installer is a
          # real failure — surface it instead of silently shipping nothing.
          if-no-files-found: error
          retention-days: 14

  # Publish the freshest macOS .dmg + Windows .msi to the public `setnayan-media`
  # R2 bucket, under BOTH an immutable `desktop/<version>/` path and a rolling
  # `desktop/latest/` path — so `/download` (via `lib/desktop-release.ts` ->
  # `desktop/latest/release.json`) and the future updater (S12, via
  # `desktop/latest/latest.json`) always resolve the freshest build without a
  # code change on every release. `setnayan-media` is the ONLY publicly-served
  # R2 bucket (`lib/r2.ts`'s `publicUrlFor` — the other four hold vendor
  # contracts/IDs/private uploads); everything under `desktop/` here is meant to
  # be fetched by an anonymous browser or `tauri`'s Rust-side updater check.
  publish-latest:
    name: publish desktop-latest
    needs: build
    # Runs on a manual dispatch (today's only trigger — see the `on:` block
    # above) AND on a future push-to-main, and even if one matrix leg flaked —
    # Windows is a non-required check, so a Windows hiccup must not freeze the
    # Mac download. Previously gated on `github.event_name == 'push'` alone,
    # which made this job UNREACHABLE while the trigger is workflow_dispatch-only
    # (measured 2026-09-05 — `desktop-latest` had been frozen since 2026-06-19).
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # macOS and Windows artifacts land in their own subdirectories.
          pattern: setnayan-desktop-*
          merge-multiple: true

      - name: List downloaded installers
        run: ls -laR dist

      - name: Publish to rolling desktop-latest release (internal/CI mirror only)
        # Kept as a maintainer-facing artifact mirror. The repo is PRIVATE, so
        # these asset URLs 404 for an anonymous visitor regardless of
        # `prerelease` — this is NOT what `/download` or the updater use; see
        # the R2 steps below for the actual public release channel.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Setnayan Desktop — latest main build
          # Pre-release so it doesn't steal the "Latest" badge from a future
          # semantic release; this is the rolling edge build off main.
          prerelease: true
          files: dist/**/*
          fail_on_unmatched_files: true
          body: |
            **Rolling desktop build — always tracks the latest `main`.**

            Commit `${{ github.sha }}` · built ${{ github.run_id }}

            Downloads:
            - **macOS (Apple Silicon):** `Setnayan_*_aarch64.dmg`
            - **Windows (x64):** `Setnayan_*_x64_en-US.msi`

            macOS builds are Developer-ID-signed + notarized when the signing
            secrets are configured (open normally). If you hit a Gatekeeper
            warning on an unsigned fallback build, right-click the app →
            **Open**, or run `xattr -cr /Applications/Setnayan.app`. Apple
            Silicon only for now (no Intel build yet).

            This GitHub Release is an internal mirror only — the repo is
            private, so these asset links 404 for the public. The real
            download channel is https://setnayan.com/download (R2-backed).

      - name: Resolve version + installer paths
        id: rel
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          DMG=$(find dist -iname '*.dmg' | head -1)
          MSI=$(find dist -iname '*.msi' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::no .dmg found under dist/ — macOS build must have failed; refusing to publish a release with no macOS artifact."
            exit 1
          fi
          if [ -z "$MSI" ]; then
            echo "::warning::no .msi found under dist/ — Windows build likely failed. Publishing macOS only; the Windows link on /download will keep pointing at the last successful Windows build until this is fixed."
          fi

          # S12: the updater's REAL macOS artifact. `tauri-bundler` writes this
          # as `<AppBundle>.app.tar.gz` next to the `.app` the moment
          # `bundle.createUpdaterArtifacts` is on — the plugin's macOS
          # `install_inner` gunzips+untars whatever URL `latest.json` gives
          # it, so pointing that URL at the `.dmg` instead would fail on every
          # install attempt. Both artifacts now come out of the SAME `tauri
          # build` invocation that already produces the (required) `.dmg`, so
          # a missing tar.gz/.sig here means the updater half of that same
          # build is broken, not a separate leg that can fail independently —
          # hard-fail like the `.dmg` check above, don't publish a manifest
          # the updater cannot use.
          TARGZ=$(find dist -iname '*.app.tar.gz' | head -1)
          TARGZ_SIG=$(find dist -iname '*.app.tar.gz.sig' | head -1)
          if [ -z "$TARGZ" ] || [ -z "$TARGZ_SIG" ]; then
            echo "::error::no .app.tar.gz / .app.tar.gz.sig found under dist/ — bundle.createUpdaterArtifacts is on but tauri build didn't emit the updater archive (or didn't sign it, e.g. TAURI_SIGNING_PRIVATE_KEY missing). Refusing to publish a macOS updater manifest the plugin can't actually install from."
            exit 1
          fi

          # S12: the Windows updater artifact IS the .msi itself (tauri-bundler
          # signs a WindowsMsi bundle's own file directly — no separate zip
          # wrapper in non-v1-compatible mode), so only its sibling `.sig` is
          # new. Optional like $MSI above: a Windows-leg failure must not
          # block the (required) macOS publish.
          MSI_SIG=""
          if [ -n "$MSI" ]; then
            MSI_SIG=$(find dist -iname '*.msi.sig' | head -1)
            if [ -z "$MSI_SIG" ]; then
              echo "::warning::.msi built but no .msi.sig found — publishing the Windows download link with an EMPTY updater signature (the client-side guard in src-tauri/src/updater.rs refuses to install an unsigned manifest, so this degrades to 'no Windows auto-update' rather than an unsafe install)."
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "msi=$MSI" >> "$GITHUB_OUTPUT"
          echo "targz=$TARGZ" >> "$GITHUB_OUTPUT"
          echo "targz_sig=$TARGZ_SIG" >> "$GITHUB_OUTPUT"
          echo "msi_sig=$MSI_SIG" >> "$GITHUB_OUTPUT"
          echo "dmg_size=$(stat -c%s "$DMG")" >> "$GITHUB_OUTPUT"
          echo "targz_size=$(stat -c%s "$TARGZ")" >> "$GITHUB_OUTPUT"
          if [ -n "$MSI" ]; then
            echo "msi_size=$(stat -c%s "$MSI")" >> "$GITHUB_OUTPUT"
          fi

      - name: Check R2 credentials
        id: r2check
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_PUBLIC_URL" ]; then
            echo "::warning::R2 credentials (R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_PUBLIC_URL) are not fully configured as repo secrets — skipping the public R2 publish. /download will fall back to its last-known-good release (see lib/desktop-release.ts). This is an owner action, not a code gap: rule 12 says build behind the gate rather than fail the run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish installers + release manifests to R2
        if: steps.r2check.outputs.configured == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          BUCKET: setnayan-media
          VERSION: ${{ steps.rel.outputs.version }}
          DMG: ${{ steps.rel.outputs.dmg }}
          MSI: ${{ steps.rel.outputs.msi }}
          TARGZ: ${{ steps.rel.outputs.targz }}
          TARGZ_SIG: ${{ steps.rel.outputs.targz_sig }}
          MSI_SIG: ${{ steps.rel.outputs.msi_sig }}
          DMG_SIZE: ${{ steps.rel.outputs.dmg_size }}
          MSI_SIZE: ${{ steps.rel.outputs.msi_size }}
          # Read directly from secrets, not a `needs.build.outputs.*` — the build
          # job is a matrix and doesn't expose per-leg outputs; secrets are
          # visible to every job in the run regardless of which job set them up.
          MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
          WIN_SIGNED: ${{ secrets.SSL_COM_ESIGNER_USERNAME != '' }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DMG_NAME=$(basename "$DMG")
          PUBLIC_URL_TRIMMED="${PUBLIC_URL%/}"

          echo "Uploading $DMG_NAME ($DMG_SIZE bytes, signed=$MAC_SIGNED)"
          for PREFIX in "desktop/$VERSION" "desktop/latest"; do
            aws --endpoint-url "$ENDPOINT" s3 cp "$DMG" "s3://$BUCKET/$PREFIX/$DMG_NAME" \
              --content-type application/x-apple-diskimage --cache-control "public, max-age=300"
          done
          # $MAC_URL is release.json's / /download's mac link — the .dmg, same
          # as before. The updater manifest below points at a DIFFERENT URL
          # ($MAC_UPDATE_URL, the .app.tar.gz) — see the "Resolve version"
          # step's comment on why those two must not be the same file.
          MAC_URL="$PUBLIC_URL_TRIMMED/desktop/latest/$DMG_NAME"

          TARGZ_NAME=$(basename "$TARGZ")
          echo "Uploading $TARGZ_NAME (updater artifact, $(stat -c%s "$TARGZ") bytes)"
          for PREFIX in "desktop/$VERSION" "desktop/latest"; do
            aws --endpoint-url "$ENDPOINT" s3 cp "$TARGZ" "s3://$BUCKET/$PREFIX/$TARGZ_NAME" \
              --content-type application/gzip --cache-control "public, max-age=300"
          done
          MAC_UPDATE_URL="$PUBLIC_URL_TRIMMED/desktop/latest/$TARGZ_NAME"
          # The `.sig` FILE'S CONTENTS are already the exact base64 string
          # `tauri-plugin-updater` expects in `latest.json`'s `signature`
          # field (`tauri-cli`'s `updater_signature::sign_file` writes it
          # base64-encoded, nothing further to do) — never uploaded itself,
          # only its content read into the manifest below.
          MAC_SIGNATURE=$(cat "$TARGZ_SIG")

          WINDOWS_JSON='null'
          if [ -n "$MSI" ]; then
            MSI_NAME=$(basename "$MSI")
            echo "Uploading $MSI_NAME ($MSI_SIZE bytes, signed=$WIN_SIGNED)"
            for PREFIX in "desktop/$VERSION" "desktop/latest"; do
              aws --endpoint-url "$ENDPOINT" s3 cp "$MSI" "s3://$BUCKET/$PREFIX/$MSI_NAME" \
                --content-type application/x-msi --cache-control "public, max-age=300"
            done
            WIN_URL="$PUBLIC_URL_TRIMMED/desktop/latest/$MSI_NAME"
            WINDOWS_JSON=$(jq -n --arg url "$WIN_URL" --argjson size "$MSI_SIZE" --arg filename "$MSI_NAME" --argjson signed "$WIN_SIGNED" \
              '{url: $url, sizeBytes: $size, filename: $filename, signed: $signed}')
            # The updater manifest's Windows signature: real content when
            # `.msi.sig` exists (see the "Resolve version" step — WIN_SIGNED
            # is the separate Authenticode/eSigner code-signing status, not
            # this), honestly empty otherwise so S12's client-side guard
            # refuses to auto-install rather than accept a manifest entry
            # with nothing behind it.
            WIN_UPDATE_SIGNATURE=""
            if [ -n "$MSI_SIG" ]; then
              WIN_UPDATE_SIGNATURE=$(cat "$MSI_SIG")
            fi
            if [ "$WIN_SIGNED" = "true" ]; then
              echo "### Windows build: SIGNED (SSL.com eSigner)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### Windows build: UNSIGNED" >> "$GITHUB_STEP_SUMMARY"
              echo "SmartScreen will warn on first run until the SSL_COM_ESIGNER_* secrets are set (cert ordered in X0). The rehearsal script (S13) teaches: **More info -> Run anyway**." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### Windows build: NOT PUBLISHED THIS RUN" >> "$GITHUB_STEP_SUMMARY"
            echo "No .msi artifact — /download keeps serving the last successful Windows build, if any." >> "$GITHUB_STEP_SUMMARY"
          fi

          # `release.json` — OUR OWN shape, consumed by lib/desktop-release.ts to
          # render /download. Deliberately separate from latest.json below: this
          # carries display fields (size, signed) the Tauri updater format has no
          # room for, and desktop-release.ts should not be coupled to whatever
          # S12 decides the updater manifest needs.
          jq -n \
            --arg version "$VERSION" \
            --arg publishedAt "$(date -u +%Y-%m-%d)" \
            --arg sha "$SHA" \
            --arg runId "$RUN_ID" \
            --arg macUrl "$MAC_URL" \
            --argjson macSize "$DMG_SIZE" \
            --argjson macSigned "$MAC_SIGNED" \
            --argjson windows "$WINDOWS_JSON" \
            '{
              version: $version,
              publishedAt: $publishedAt,
              commit: $sha,
              runId: $runId,
              mac: { aarch64: { url: $macUrl, sizeBytes: $macSize, signed: $macSigned } },
              windows: $windows
            }' > release.json
          cat release.json

          # `latest.json` — the Tauri v2 updater manifest (S12,
          # build-sessions/encoder/S12.md). darwin-aarch64's `url` is the
          # `.app.tar.gz` uploaded above ($MAC_UPDATE_URL) — NOT $MAC_URL, the
          # `.dmg` release.json/`/download` link; a `.dmg` isn't a gzip stream
          # and the plugin's macOS install path will fail on it. Every
          # `signature` is real ed25519 (S11's key) when its `.sig` file
          # existed, honestly empty otherwise — `updater.rs`'s
          # `manifest_signature_ok` on the client refuses to install against
          # an empty one rather than accept an unsigned manifest.
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg macUrl "$MAC_UPDATE_URL" \
            --arg macSig "$MAC_SIGNATURE" \
            --arg winUrl "${WIN_URL:-}" \
            --arg winSig "${WIN_UPDATE_SIGNATURE:-}" \
            '{
              version: $version,
              notes: ("Setnayan desktop " + $version),
              pub_date: $pub_date,
              platforms: (
                { "darwin-aarch64": { signature: $macSig, url: $macUrl } }
                + (if $winUrl != "" then { "windows-x86_64": { signature: $winSig, url: $winUrl } } else {} end)
              )
            }' > latest.json
          cat latest.json

          for PREFIX in "desktop/$VERSION" "desktop/latest"; do
            aws --endpoint-url "$ENDPOINT" s3 cp release.json "s3://$BUCKET/$PREFIX/release.json" \
              --content-type application/json --cache-control "public, max-age=60"
            aws --endpoint-url "$ENDPOINT" s3 cp latest.json "s3://$BUCKET/$PREFIX/latest.json" \
              --content-type application/json --cache-control "public, max-age=60"
          done

          echo "Published desktop/$VERSION and desktop/latest to r2://$BUCKET"
