name: auto-enable-automerge

# AUTO-UPLOAD guardrail (owner 2026-06-14): every non-draft PR has auto-merge
# armed automatically, so shipping to prod never depends on a session (Claude
# or human) remembering to run `gh pr merge --auto`. The actual merge is still
# gated by branch protection — auto-merge only fires once ALL required checks
# pass (typecheck+lint · production build · secret scan · migration timestamp
# guard · playwright e2e · bundle size · lighthouse). Broken code can never
# auto-merge; this only removes the "forgot to arm it" failure mode that let
# PRs pile up unmerged.
#
# To HOLD a PR (don't let it auto-merge), ANY of these three:
#   1. Label it `do-not-auto-merge`  ← PREFERRED, and the only one that is safe
#   2. Put `DO NOT AUTO-MERGE` in the title
#   3. Open it as a DRAFT (this workflow skips drafts)
#
# The label works AT ANY TIME, including on a PR that is already armed: applying
# it fires the `disarm-on-hold-label` job below, which actually runs
# `gh pr merge --disable-auto`. Before 2026-08-07 that recovery step existed only
# as a sentence in this comment, so labelling an already-armed PR did nothing —
# which is precisely how #4186 and #4209 merged while wearing the label.
#
# 🚨 WHY 1 AND 2 EXIST (added 2026-08-07 after a near miss). The standing rule is
# that public-facing LEGAL COPY is opened for the owner to read and merge in his
# own name as DPO — never merged by a machine. The only protection was "don't
# run `gh pr merge --auto`", which does nothing here: THIS WORKFLOW ARMS IT FOR
# YOU. PR #4209 (the privacy retention notice + the booking-fee disclosure) was
# opened deliberately unarmed, verified unarmed, and was ARMED BY THIS WORKFLOW
# about a minute later. It was caught only because a re-check happened to run.
#
# 🔑 A CONVENTION THAT LIVES IN SOMEONE'S HEAD IS NOT A CONTROL. "We don't arm
# legal PRs" was never enforced anywhere — and the two PRs relying on it
# (#4186, #4209) carried NO label and NO enforcement, only a title. Drafts were
# the documented hold, but a draft is worse for this case: the owner must mark
# it Ready to merge it, which re-fires this workflow and arms it — so the very
# act of approving becomes the act of losing the hold.
#
# RETIRE THIS at public-vendor launch: when updates move to a temp/staging
# site (see corpus deployment-phases), delete this workflow so prod stops
# auto-accepting every green PR.

on:
  pull_request:
    # `labeled` IS here — but it only ever reaches the DISARM job below, never the
    # arming job, which is gated on the event type. Adding the hold label must
    # never be the thing that arms a PR; it must always be a thing that STOPS one.
    # Removing the label does not re-arm — that is deliberate, and
    # `gh pr merge <#> --auto --merge` is the manual path back.
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── THE HOLD LABEL DISARMS, AT ANY TIME ────────────────────────────────────
  # 🚨 WHY THIS JOB EXISTS. The label hold added earlier on 2026-08-07 only ever
  # protected a PR that already CARRIED the label at the moment it was opened —
  # because `opened` is when the arming job runs, and nothing undid an arming
  # afterwards. Measured, same day:
  #
  #   label `do-not-auto-merge` created ....... 04:17:20Z
  #   #4186 opened ............................ 2026-08-06 11:46:40Z  (16h EARLIER)
  #   #4209 opened ............................ 04:02:57Z             (14m EARLIER)
  #   both labelled ........................... 04:17
  #   both MERGED ............................. 04:28:43 / 04:28:46
  #
  # Neither could possibly have been opened with a label that did not exist yet.
  # Both were armed at open, wore the hold label for eleven minutes, and merged
  # anyway — one of them the PUBLIC PRIVACY NOTICE published in the owner's name
  # as DPO, the exact document the hold was invented to protect.
  #
  # 🔑 THE FIX'S OWN LESSON, APPLIED ONE LEVEL DOWN. That PR's thesis was "a
  # convention that lives in someone's head is not a control." Its remedy then
  # documented the recovery step — `gh pr merge <#> --disable-auto` — in a
  # COMMENT, and a comment is a convention. Until this job existed, `--disable-auto`
  # appeared in this file exactly once, inside prose. Now it runs.
  disarm-on-hold-label:
    if: >-
      github.event.action == 'labeled'
      && github.event.label.name == 'do-not-auto-merge'
    runs-on: ubuntu-latest
    steps:
      - name: Disable auto-merge (the hold label was applied)
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --disable-auto \
          || echo "Nothing to disarm (auto-merge was not armed, or the PR is already merged)."

  enable-automerge:
    # Three independent holds. The LABEL is the real control; the title check is
    # a belt-and-braces catch for a PR opened before anyone thought to label it
    # (both PRs that needed this on 2026-08-07 had the words in the title and no
    # label at all). Draft stays as it was.
    #
    # ⚠ `labeled` is in the trigger list for the disarm job above and MUST NOT
    # reach this one — labelling a PR may never be what arms it.
    if: >-
      github.event.action != 'labeled'
      && github.event.pull_request.draft == false
      && !contains(github.event.pull_request.labels.*.name, 'do-not-auto-merge')
      && !contains(github.event.pull_request.title, 'DO NOT AUTO-MERGE')
    runs-on: ubuntu-latest
    steps:
      - name: Arm auto-merge (merge commit)
        env:
          # ⚠ Bot-merge workflow suppression (observed 2026-07-15, PRs #3243/#3245):
          # when auto-merge is ARMED with github.token, GitHub attributes the
          # eventual merge to app/github-actions and SUPPRESSES all main-branch
          # workflow triggers — supabase-migrations, ci, e2e, deploy-prod all
          # silently skip (Vercel's native git webhook still deploys; only
          # Actions are suppressed). PR #3242, armed by the owner's own gh CLI
          # (user PAT), triggered everything normally.
          # FIX: arm with AUTOMERGE_PAT (a classic PAT or GitHub-App token with
          # repo scope, created by the owner → repo secrets). Falls back to
          # github.token so this workflow never hard-fails while the secret is
          # unset — but until it IS set, merges it arms fire no main workflows
          # and migrations must be dispatched manually:
          #   gh workflow run supabase-migrations.yml --ref main
          # ✅ AUTOMERGE_PAT SET 2026-07-30 (fine-grained, repo-scoped:
          # Contents RW + Pull requests RW + Metadata R, no expiration). Merges
          # armed from here are now attributed to a real identity, so the push to
          # main TRIGGERS workflows again — deploy-prod applies migrations and
          # fires the Vercel hook without anyone dispatching by hand.
          #
          # What it cost while unset (2026-07-30, measured): THREE security
          # migrations sat unapplied — the community/person-spine ACL hygiene
          # (anon held TRUNCATE on four tables), SEC-4b, and the audit-trail
          # append-only trigger. Each landed only because a session happened to
          # check. If merges ever start showing `github-actions[bot]` as author
          # again, this secret is gone or expired — that is the tell.
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto --merge \
          || echo "Could not arm auto-merge (already merged, or not yet mergeable) — branch protection still gates the merge."
