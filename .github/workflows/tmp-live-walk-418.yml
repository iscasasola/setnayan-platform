# TEMPORARY — claude/hydration-418 diagnosis. Removed before the PR is marked ready.
# Signed-out, read-only: every non-GET request is ABORTED (logged, never sent), so nothing reaches prod data.
name: tmp live walk 418
on:
  pull_request:
    paths: ['.github/workflows/tmp-live-walk-418.yml', '.github/scratch/live-walk.cjs']
jobs:
  walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node .github/scratch/live-walk.cjs out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-walk, path: out }
