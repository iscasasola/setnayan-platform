name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Same rule as ci.yml: a newer push to the SAME pull request cancels the older
# run (its result can never gate anything); on main the newest push cancels the
# older run (ci.yml explains why). A manual dispatch gets a group of its own.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('e2e-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'e2e-main') || format('e2e-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  playwright:
    name: playwright e2e (chromium)
    runs-on: ubuntu-latest
    # Critical-path E2E tests (Task #35) — homepage renders, health
    # endpoints respond, signup routing works, 404 surface ships
    # editorial-brand-voice copy. Six tests today; future PRs extend
    # by copying patterns from apps/web/tests/e2e/*.spec.ts.
    #
    # Strategy: build + start the production server in CI, then run
    # Playwright against http://localhost:3000. Avoids the Vercel
    # preview-URL discovery dance (which requires a preview to already
    # have deployed by the time this job kicks off — race-y at best).
    # When Vercel preview deployments are integrated later, set
    # E2E_BASE_URL on the runner to skip the build + start step.
    # RAISED 15 → 25 on 2026-08-19, and the number is derived, not picked:
    # across 30 measured runs the SUCCESSES ranged 5–14 minutes against a 15
    # minute cap, i.e. one minute of headroom, and five runs died exactly at 15
    # — including one on `main`. A ceiling one minute above the observed maximum
    # is not a timeout, it is a coin toss.
    #
    # The cache below is the actual fix and should pull normal runs back to
    # ~5 min; this raise is what lets a slow run finish rather than being
    # reported as "cancelled", which reads like a flake and is not one.
    # ⚠ It also had to be raised for the cache to LAND AT ALL: this PR must pass
    # the very check it repairs, on a run that has no cache yet to benefit from.
    #
    # ⚠ 2026-10-27: the cap was hit again — 8 of 59 attempts — and NOT by the
    # suite (5.1–6.0 min in every success). The 2026-08-19 cache held the
    # browser but not the apt packages, and that download is what ran 10–17
    # minutes. See "WHERE THE 25 MINUTES ACTUALLY WENT" below. The cap stays at
    # 25: with the packages cached and overlapped with the build, the measured
    # successes (13.7–18.7 min when apt was fast) are the whole run.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # ═══ WHERE THE 25 MINUTES ACTUALLY WENT (measured 2026-10-27) ═══════════
      #
      # 59 job attempts on this workflow, 2026-10-24 → 2026-10-27. EIGHT died at
      # the 25-minute cap, and in ALL EIGHT the time went to one step — "Install
      # Playwright Chromium" — at 10.2–17.4 min, against a median of 0.2 min in
      # the 47 successes. The suite itself ran 5.1–6.0 min in every success and
      # was still passing when each of the eight was cut off.
      #
      # The browser was already cached (2026-08-19). What was NOT cached is the
      # ~26 MB of Ubuntu packages `playwright install-deps` fetches every run
      # (fonts, libnss3, xvfb …). On a bad hour the runner's apt mirror serves
      # them at ~43 kB/s: job 121690883112 logged "Fetched 25.9 MB in 10min 1s".
      # The 2026-08-19 fix diagnosed the right STEP and cached the wrong half of
      # it — that is why the cancellations came back.
      #
      # Two changes, either of which alone removes the cap-hit:
      #   1. the .deb files are cached too, so a hit downloads nothing; and
      #   2. the install runs IN THE BACKGROUND, behind the ~10-minute
      #      `next build`, so even a cache miss on a slow mirror costs nothing
      #      until it outlasts the build.
      #
      # NOT SHARDED, on purpose: the suite is ~6 of ~17 minutes and the build
      # (~10) would have to run once and be shipped to every shard; and this
      # account runs at most 20 jobs at once (changelog.d/rd-ci-cancels-
      # superseded-runs.md: 20 running, 95 waiting) — every shard is a slot
      # another PR waits for.
      - name: Resolve Playwright version
        id: pw
        # ImageOS / ImageVersion are runner MACHINE variables, which the `env`
        # expression context does not see — so they are handed over as outputs.
        run: |
          echo "version=$(pnpm --filter @setnayan/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
          echo "imageos=${ImageOS}" >> "$GITHUB_OUTPUT"

      # The browser binary, keyed on the resolved version so a Playwright bump
      # misses the cache and re-downloads instead of testing a stale browser.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium

      # The OS packages the browser needs, as .deb files. They live outside
      # ~/.cache/ms-playwright, so the browser cache above never held them.
      # Keyed on the runner image too: a new image (weekly) misses, restores the
      # previous set through restore-keys, downloads only what changed, and
      # saves a fresh set.
      - name: Cache Playwright system packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/playwright-apt
          key: ${{ runner.os }}-${{ steps.pw.outputs.image }}-playwright-${{ steps.pw.outputs.version }}-apt
          restore-keys: |
            ${{ runner.os }}-${{ steps.pw.outputs.imageos }}-

      - name: Install Playwright Chromium (browser only — on a cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @setnayan/web exec playwright install chromium

      # Started here, finished after the build ("Wait for …" below). A background
      # process outlives its step — the production server further down relies on
      # exactly that — and only ends with the job.
      - name: Start the Playwright system packages (in the background, behind the build)
        run: |
          mkdir -p ~/.cache/playwright-apt
          # apt-get keeps what it downloads by default; say so, so the copy-back
          # below cannot silently find nothing on an image that changed it.
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-keep-downloaded-packages > /dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          n=$(find ~/.cache/playwright-apt -name '*.deb' | wc -l)
          echo "restored $n cached .deb file(s)"
          if [ "$n" -gt 0 ]; then sudo cp ~/.cache/playwright-apt/*.deb /var/cache/apt/archives/; fi
          nohup bash -c 'pnpm --filter @setnayan/web exec playwright install-deps chromium > "$RUNNER_TEMP/pw-deps.log" 2>&1; echo $? > "$RUNNER_TEMP/pw-deps.exit"' > /dev/null 2>&1 &

      - name: Build web app
        run: pnpm --filter @setnayan/web build
        env:
          # Same dummy env-var pattern as the existing `build` job in
          # ci.yml — real values are set on Vercel; CI only needs the
          # build to succeed for E2E to have a server to hit.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # Fail-closed: no exit file → keep waiting (the job timeout is the
      # ceiling); a non-zero exit fails this step with the full apt log.
      - name: Wait for the Playwright system packages
        run: |
          waited=0
          while [ ! -f "$RUNNER_TEMP/pw-deps.exit" ]; do sleep 2; waited=$((waited + 2)); done
          echo "waited ${waited}s after the build for the system packages"
          code=$(cat "$RUNNER_TEMP/pw-deps.exit")
          if [ "$code" != "0" ]; then cat "$RUNNER_TEMP/pw-deps.log"; echo "::error::playwright install-deps exited $code"; exit 1; fi
          # The one line that says whether the cache worked: "Need to get 0 B/…"
          # means every package came from the restored .deb files.
          grep -E "^(Need to get|Fetched|[0-9]+ upgraded)" "$RUNNER_TEMP/pw-deps.log" || tail -5 "$RUNNER_TEMP/pw-deps.log"
          # Re-seed the cache dir with exactly the .debs of what is now installed
          # (an epoch's ':' is '%3a' in apt's file names), so superseded versions
          # do not pile up across images.
          dpkg-query -W -f='${Package}_${Version}_${Architecture}.deb\n' | sed 's/:/%3a/g' | sort -u > "$RUNNER_TEMP/installed-debs.txt"
          rm -rf ~/.cache/playwright-apt && mkdir -p ~/.cache/playwright-apt
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            if grep -qxF "$(basename "$f")" "$RUNNER_TEMP/installed-debs.txt"; then cp "$f" ~/.cache/playwright-apt/; fi
          done
          echo "cached $(find ~/.cache/playwright-apt -name '*.deb' | wc -l) .deb file(s), $(du -sh ~/.cache/playwright-apt | cut -f1)"

      - name: Start production server
        # `next start` binds to port 3000 (per the script in package.json).
        # Background it + wait for the health endpoint to confirm boot.
        run: |
          pnpm --filter @setnayan/web start &
          echo "Waiting for server to boot..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to boot in 30s"
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run Playwright tests
        run: pnpm --filter @setnayan/web test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-timings.json

      # Where the suite's minutes go, per spec file, on THIS run — so the next
      # "the e2e job is slow" starts from a measurement, not from the dot line.
      # Reads the JSON the reporter above wrote; changes no result.
      - name: Name the slowest spec files
        if: ${{ !cancelled() }}
        run: node scripts/e2e-timing-summary.mjs "$RUNNER_TEMP/e2e-timings.json"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
