name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck-lint:
    name: typecheck + lint
    runs-on: ubuntu-latest
    # ═══ THIS JOB IS THE ONLY BLOCKING SURFACE A GUARD CAN BE ADDED TO ═══
    #
    # Auto-merge waits on REQUIRED contexts only. A guard in a job of its own
    # goes red on the PR page and the PR merges anyway — the red tick is
    # decoration. That is not hypothetical: nine guards below had been running
    # on every PR while blocking nothing, one of them written two days after
    # two working controls ("Invite guests" / "Arrange the room") were deleted
    # from the couple's guest page with every other check green.
    #
    # Promoting a job to required needs a branch-protection edit, which is a
    # settings change nobody remembers to make. Adding a STEP to a job that is
    # already required needs nothing but this file. So: a new single-file guard
    # belongs HERE, as a step, not as a new job. Only give a guard its own job
    # when the owner is going to add its name to branch protection in the same
    # breath.
    #
    # The blocking-guards block below is `continue-on-error: true` + a single
    # aggregator, so that one failing guard cannot hide the other eight.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ══ BLOCKING GUARDS ══════════════════════════════════════════════════
      # Pure node, no node_modules — they run BEFORE install so a guard breach
      # is reported in seconds rather than after a five-minute typecheck.
      #
      # Every one carries `continue-on-error: true` so the whole set runs on
      # every PR and each keeps its own named step and its own log. The
      # "Every blocking guard must pass" step at the bottom is what turns them
      # red. Do not delete the continue-on-error without deleting the
      # aggregator too — on its own it means "this guard does not block".

      # Fails when a NEW page hand-rolls a masthead (an .sn-eye inside a <header>).
      # Until 2026-07-21 there was no shared page-header component, so ~80 dashboard pages each
      # hand-rolled the same block and a CARD token drifted onto all of them — `.sn-eye`'s own spec
      # comment in globals.css reads "Tile eyebrow". Nothing caught it because nothing was watching.
      # A RATCHET, not a wall: the existing files are baselined in
      # apps/web/scripts/page-masthead-baseline.json, so this only fails on NEW drift. Delete a line
      # from the baseline when you migrate a page to <PageMasthead>; never add one.
      - name: Lint page masthead
        id: guard_page_masthead
        continue-on-error: true
        working-directory: apps/web
        run: node scripts/lint-page-masthead.mjs

      # THE DESIGN PORT MAY NOT SILENTLY DELETE A CONTROL.
      #
      # On 2026-08-06 two real controls were deleted from the couple's guest page
      # ("Invite guests" + "Arrange the room") on a clean origin/main, and all
      # twelve existing lint scripts, typecheck AND Lighthouse passed
      # byte-identically. That is structural: this repo has no render harness, ~14%
      # of pages are named in any test, and every other guard fires on a wrong
      # thing ADDED while a port REMOVES. It has already cost us the YouTube API
      # Services disclosure on the /panood port, caught by a manual diff.
      #
      # Compares every route's destinations + bound actions against a GENERATED
      # baseline (apps/web/scripts/port-control-baseline.json). Missing fails;
      # added passes. A deliberate removal is handled by regenerating the
      # baseline in the SAME PR, which puts it in the diff as one readable line.
      #
      # DELETE THIS STEP, the two scripts and the baseline when the port is done —
      # a guard kept past its purpose becomes noise.
      - name: Lint port keeps every control
        id: guard_port_controls
        continue-on-error: true
        run: node apps/web/scripts/lint-port-no-lost-controls.mjs

      # Task #20 of the 2026-05-22 audit verified that every emitNotification
      # `relatedUrl` resolves to a real route under apps/web/app/**. This guard
      # keeps it that way — a broken `relatedUrl` ships a 404 link to the user's
      # inbox via Resend, and the owner won't see it until pilot. See
      # apps/web/scripts/lint-email-links.mjs for the matcher logic.
      - name: Lint email template links
        id: guard_email_links
        continue-on-error: true
        run: node apps/web/scripts/lint-email-links.mjs

      # Privacy invariant (admin account-access model, 2026-06-22): the admin
      # surface may NEVER read couple↔vendor chat bodies, thread attachments, or
      # raw face vectors. Chat RLS is participant-only; the service-role admin
      # client bypasses it, so this guard fails the build if any app/admin/** file
      # (outside the demo-vendors allow-list) reads chat content or face vectors.
      # Backs the published trust promise. See apps/web/scripts/lint-admin-chat-guard.mjs.
      - name: Lint admin chat-guard
        id: guard_admin_chat
        continue-on-error: true
        run: node apps/web/scripts/lint-admin-chat-guard.mjs

      # The auto-merge workflow arms EVERY non-draft PR. Public legal copy
      # (privacy notices, pricing disclosures) is opened for the owner to read
      # and merge in his own name as DPO — never by a machine. On 2026-08-07 the
      # privacy-retention PR was opened deliberately unarmed, verified unarmed,
      # and armed by that workflow a minute later; it was caught only because a
      # re-check happened to run. This guard keeps the hold conditions in place.
      # See apps/web/scripts/lint-automerge-hold.mjs.
      - name: Lint auto-merge hold
        id: guard_automerge_hold
        continue-on-error: true
        run: node apps/web/scripts/lint-automerge-hold.mjs

      # A `*_url` column can hold an `r2://bucket/key` reference, which a browser
      # cannot load — the picture silently never appears and no test catches a
      # broken <img>. The owner reported his shop logo missing on 2026-08-07.
      - name: Lint stored-asset refs
        id: guard_stored_asset_refs
        continue-on-error: true
        run: node apps/web/scripts/lint-stored-asset-refs.mjs

      # Keeps corner radii on the single --m-r-* token scale (owner-locked
      # "softer corners" 2026-06-20). Fails on any ad-hoc rounded-[Npx] /
      # border-radius:Npx / borderRadius:N that bypasses the tokens.
      # See apps/web/scripts/lint-radius.mjs.
      - name: Lint radius tokens
        id: guard_radius
        continue-on-error: true
        run: RADIUS_LINT_STRICT=1 node apps/web/scripts/lint-radius.mjs

      # Fails when a Tailwind COLOUR UTILITY names a palette entry that does not
      # exist. Tailwind DROPS such a class silently — no error, no warning, the
      # rule is simply absent and the element falls back to preflight styling.
      # Found `gold` (78 uses), `champagne` (17) and `sage` (4) dead in the
      # stylesheet for months. See apps/web/scripts/lint-colour-exists.mjs.
      - name: Lint colour names resolve
        id: guard_colour_exists
        continue-on-error: true
        run: node apps/web/scripts/lint-colour-exists.mjs
      # Every column added to public.events after the 20271007100000 lockdown must
      # carry its own GRANT SELECT (col). The table revokes table-level SELECT and
      # re-grants a computed allowlist, so an ungranted column is unreadable through
      # a user session — PostgREST refuses the WHOLE query and the surface goes
      # silently empty. The db coverage tests cannot catch this: their before()
      # re-applies the lockdown, which recomputes the allowlist over the new column.
      - name: Lint events column grants
        id: guard_events_grants
        continue-on-error: true
        run: node apps/web/scripts/lint-events-column-grants.mjs

      # THERE IS ONE COMMENT STRIPPER. Half the guards in this repo read source
      # text and match a pattern, so each needs comments removed first — and the
      # obvious two-replace regex strips BLOCK comments FIRST, so a line comment
      # holding `video/*` opens a comment that closes at the next real docblock
      # and blanks everything between. Measured 2026-08-30: one JSDoc added to
      # app/api/papic/guest-capture/route.ts cut what six guards could see from
      # 16,218 characters to 6,430, and they all went red on a change that
      # touched none of what they assert. That was the LOUD direction; the same
      # mechanism makes a guard pass while checking a blank.
      - name: Lint one comment stripper
        id: guard_one_stripper
        continue-on-error: true
        run: node apps/web/scripts/lint-one-comment-stripper.mjs

      # Fails when TODO / FIXME / HACK / WIP survives in RENDERED UI text under
      # apps/web/app (comments are stripped first, so a marker where it belongs
      # is always fine). The copy rule — "no TODO, no skeleton, no placeholder
      # text user-visible" — was already written in two files and shipped anyway:
      # the Patiktok booth rendered "TODO(0017-phase5.2)" and "TODO(0017-phase4.2)"
      # as on-screen text to couples who had PAID for the booth and are redirected
      # straight onto that page (2026-08-06). Prose is not a safety mechanism.
      # Escape hatch: `ui-note-allow: <reason>` on the line.
      # See apps/web/scripts/lint-no-engineering-notes-in-ui.mjs.
      - name: Lint engineering notes in UI
        id: guard_ui_notes
        continue-on-error: true
        run: cd apps/web && node scripts/lint-no-engineering-notes-in-ui.mjs

      # Fails when a marketing NAV_ROUTE pins something to the viewport top
      # without being listed in UNFIXED_ROUTES — i.e. the floating glass nav and
      # the page's own bar would overlap. /features and /tl/features shipped that
      # way: the nav sat on top of the section tabs and sliced the headline in
      # half, on the public page whose job is to look finished. Both components
      # were individually correct; the defect existed only between them, and only
      # at render. The OWNER found it on a phone.
      # See apps/web/scripts/lint-no-stacked-pinned-bars.mjs.
      - name: Lint stacked pinned bars
        id: guard_pinned_bars
        continue-on-error: true
        run: cd apps/web && node scripts/lint-no-stacked-pinned-bars.mjs

      # Fails when the 3D booth poster stand's position is hardcoded in
      # venue-objects.tsx instead of read from boothPosterLocalOffset, or when
      # BoothPoster re-declares the frame dimensions the placement maths depends
      # on. PR #3437 shipped `w / 2 + 0.42` measured off the shared 2.0 m
      # footprint — wrong body (the chassis is 1.8–3.4 m) and a gap smaller than
      # the stand's own 0.45 m half-width, so the banner sat inside the booth on
      # nine of ten chassis. A unit test CANNOT catch this: templateBoothObstacles
      # calls the helper internally, so "renderer and obstacle agree" compares the
      # module to itself and passes even when the renderer is hardcoded, and the
      # renderer is JSX with no render harness in the unit suite.
      # See apps/web/scripts/lint-booth-poster-placement.mjs.
      - name: Lint booth poster placement
        id: guard_booth_poster
        continue-on-error: true
        run: node apps/web/scripts/lint-booth-poster-placement.mjs

      # Structural half of the duplicated-rule ratchet. The real comparison —
      # scan vs committed baseline — is the "Duplicated-rule guards" step below,
      # because it needs the TypeScript scanners. THIS one needs nothing but the
      # files, so it runs install-free and closes the two ways a file-based guard
      # dies quietly:
      #   1. the baseline gets truncated, emptied or hand-sorted, so the differ
      #      compares nothing against nothing and reports "no widenings";
      #   2. the guard gets unwired — runner deleted, package.json script dropped,
      #      CI step removed — and the build still goes green. That is the worst
      #      failure mode available, because it manufactures confidence.
      # It asserts: header fact-counts match the body, per-kind floors are met,
      # ordering is canonical, keys are unique and correctly shaped, the mirrored
      # DUP_RULE_KINDS constant has not drifted, the "adding a line is a widening"
      # sentence is still in the header, and both the runner and its CI steps are
      # still in place. ⚠ Its wiring check matches a single-line `run:` naming
      # `lint-dup-rule-baseline.mjs` — keep this step's `run:` on one line.
      # See scripts/lint-dup-rule-baseline.mjs.
      - name: Lint duplicated-rule baseline
        id: guard_dup_rule_baseline
        continue-on-error: true
        run: node scripts/lint-dup-rule-baseline.mjs

      # Protects the 2026-07-01 vendor-dashboard perf work (PRs #2529/#2533/#2543/
      # #2546). The layout re-renders server-side on every navigation, so a broad
      # `revalidatePath('/vendor-dashboard', 'layout')` (or global `'/', 'layout'`)
      # silently re-inflates it by busting the client Router-Cache window for the
      # whole subtree. This guard fails when a NEW broad layout-wide bust appears
      # beyond the committed baseline (a few intentional admin/tour uses).
      # See apps/web/scripts/lint-vendor-layout-revalidate.mjs.
      - name: Lint vendor layout revalidate
        id: guard_vendor_revalidate
        continue-on-error: true
        run: node apps/web/scripts/lint-vendor-layout-revalidate.mjs

      # Fails when a `changelog.d/` directory exists anywhere but the repo root.
      # scripts/changelog-collect.mjs reads ONLY <repoRoot>/changelog.d, so a
      # fragment written to any other one is never folded into CHANGELOG.md and
      # never deleted — it just sits there looking like a healthy pending
      # fragment. The failure mode is pure silence, which is why it ran unnoticed
      # for months: by 2026-07-25 two orphan dirs held 172 stranded fragments
      # (167 in apps/web/changelog.d, 5 in apps/changelog.d) whose content never
      # reached the changelog. Both were migrated with `git mv`; this guard stops
      # a third from forming. Docs alone can't — changelog.d/README.md and
      # CLAUDE.md already said "put it in the root dir" the entire time the 172
      # piled up. See apps/web/scripts/lint-changelog-dir.mjs.
      - name: Lint changelog fragment dir
        id: guard_changelog_dir
        continue-on-error: true
        run: node apps/web/scripts/lint-changelog-dir.mjs

      # Fails when a 'use client' file reaches a `server-only` module through a
      # VALUE import, at any depth. That is a hard `next build` failure —
      # "You're importing a component that needs server-only" — and NOTHING
      # else in the toolchain can see it: `tsc` is not a bundler and does not
      # know what 'use client' means, and the node test runner resolves
      # `server-only` happily. `next build` is the sole detector, it costs
      # minutes, and it cannot run on the dev machine (7 GB heap → SIGTERM), so
      # the only feedback loop was "open a PR and wait". It cost PR #4201 five
      # red checks and ~20 minutes for a one-line import. This runs in ~1s.
      # The walk STOPS at 'use server' modules — a client importing an action
      # is the correct pattern, and following that edge reported 157 false
      # positives on the first run. See apps/web/scripts/lint-server-only-boundary.mjs.
      - name: Lint server-only boundary
        id: guard_server_only
        continue-on-error: true
        run: cd apps/web && node scripts/lint-server-only-boundary.mjs

      # Fails when a `supabase/migrations/` directory exists anywhere but the
      # repo root. `supabase db push` reads ONLY <repoRoot>/supabase/migrations,
      # so a migration written elsewhere is never applied — and it looks exactly
      # like a healthy pending migration sitting in the tree, which is worse than
      # missing, because a reader counts it as done.
      #
      # Not hypothetical: apps/supabase/migrations/ hid photo_messages.voice_depth
      # this way. Its route shipped and went live, the column never did, and
      # because PostgREST resolves an RPC by its exact NAMED arguments, every
      # guest message save returned save_failed — silently, with green CI, for
      # weeks. Same shape as the orphan changelog.d dirs that stranded 172
      # fragments. See apps/web/scripts/lint-migrations-dir.mjs.
      - name: Lint migrations dir
        id: guard_migrations_dir
        continue-on-error: true
        run: node apps/web/scripts/lint-migrations-dir.mjs

      # Fails when a migration this repo used to carry has GONE. On 2026-08-21 a
      # merge from a branch cut days earlier deleted three ALREADY-APPLIED
      # migrations along with most of four merged PRs; `supabase db push` then
      # refused, and because deploy-prod.yml migrates BEFORE firing the Vercel
      # hook, production stopped updating for an hour with six merges queued.
      # CI was green throughout — the clobber took the calling code too, so the
      # repo was internally consistent. See lint-migrations-never-deleted.mjs.
      - name: Lint migrations kept
        id: guard_migrations_kept
        continue-on-error: true
        run: node apps/web/scripts/lint-migrations-never-deleted.mjs

      # Fails when anything imports `next/font/google`, when a declared local
      # font file is missing, or when a committed face is referenced by
      # nothing. The build used to fetch every family from fonts.gstatic.com AT
      # BUILD TIME and DIED when that failed — twice on 2026-08-13, on two
      # unrelated PRs, each time presenting as a failure of the change under
      # test, and one of them taking the e2e suite down with it because the
      # tests never got a build. A build that depends on somebody else's uptime
      # is not reproducible. See apps/web/scripts/lint-fonts-are-local.mjs.
      - name: Lint fonts are local
        id: guard_fonts_local
        continue-on-error: true
        run: node apps/web/scripts/lint-fonts-are-local.mjs

      # Fails when a migration declares a FUNCTION-LEVEL `SET` on a custom
      # `setnayan.*` parameter. Prod refuses to create such a function —
      # "permission denied to set parameter" (42501) — because that clause is
      # validated at CREATE time and Supabase's `postgres` role is not a
      # superuser.
      #
      # 🔑 NO DB TEST CAN CATCH THIS. The PGlite replay every *.db.test.ts runs
      # against executes AS A SUPERUSER, so the one environment that would
      # notice is the one that permits it. Measured 2026-08-11: migration
      # 20271132819490 did exactly this — 8 db tests green, typecheck green, 18
      # checks green, PR merged — and `supabase db push` was rejected on the way
      # in. The deploy is migrate-then-deploy, so the app half was correctly
      # held back too; the feature existed in neither half while every signal
      # said it had shipped. See apps/web/scripts/lint-no-function-level-custom-set.mjs.
      - name: Lint no function-level custom SET
        id: guard_function_level_set
        continue-on-error: true
        run: node apps/web/scripts/lint-no-function-level-custom-set.mjs

      # Text on a fill it cannot be read against. Born 2026-08-08 with the gold
      # ruling: cream on the standard gold is 3.37:1 against a 4.5:1 floor, and
      # nothing in the stack notices — it compiles, renders and screenshots fine.
      # 76 call sites were failing while lib/palette-lock.test.ts stayed green,
      # because that test checks the TOKENS and this checks how they are PAIRED.
      - name: Lint label-on-fill contrast
        id: guard_label_contrast
        continue-on-error: true
        run: node apps/web/scripts/lint-label-on-fill-contrast.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm --filter @setnayan/web test:unit

      # CI-safe db-tests: replay every migration into in-process PGlite (no
      # external DB) and assert data-layer invariants. Runs the WHOLE
      # tests/db/*.db.test.ts suite (~20s total) — every db test now gates PRs,
      # not the old 2-test curated list (which silently let migration/schema
      # regressions through: PR4/PR5 db tests were never CI-run until now).
      # Gap audit 2026-07-23 · Batch B7.
      #
      # This glob ALSO carries the exposure-surface freeze
      # (tests/db/exposure-freeze.db.test.ts), which fails the build when anon /
      # authenticated gain reach they did not have in
      # supabase/security/exposure-surface.baseline.txt. Do not narrow this glob
      # to a curated list again — that is how the last set of db tests stopped
      # running.
      - name: Data-layer guards (DB replay)
        run: pnpm --filter @setnayan/web test:db:ci

      # ONE RULE, WRITTEN DOWN TWICE — the two mechanisable halves of the class
      # that cost a full day on 2026-07-27 (a shadowed exported helper, and a
      # hand-typed select that drops a column the canonical *_SELECT constant
      # includes). Fails when a NEW instance appears beyond the committed
      # apps/web/scripts/dup-rule.baseline.txt; removing a baselined line is a
      # narrowing and passes silently, so paying debt down never turns the build
      # red.
      #
      # It rides THIS job rather than getting its own, because it needs the TS
      # scanners (and therefore tsx) and this job has already installed. A
      # dedicated job would buy nothing but a second `pnpm install` per PR. The
      # structural half — is the baseline canonical, is the guard still wired —
      # is pure node and DOES get its own install-free job below.
      # See apps/web/scripts/lint-dup-rule.ts.
      - name: Duplicated-rule guards
        run: pnpm --filter @setnayan/web lint:dup-rule

      # ══ THE AGGREGATOR — this is what makes the guards above BLOCK ═══════
      #
      # Each guard step is `continue-on-error: true`, which rewrites its
      # `conclusion` to success but leaves its `outcome` truthful. So the guards
      # all run (one failure cannot hide another), and this single step reads
      # every outcome and fails the required job. One ::error:: annotation is
      # emitted per failing guard, so the PR page names each by its own title
      # without anyone opening a log.
      #
      # `!cancelled()` — not `success()` — so a typecheck failure earlier in the
      # job cannot swallow a guard breach either.
      #
      # FAIL-CLOSED: anything that is not exactly `success` counts as a failure,
      # including `skipped`, which is what a mis-edited `if:` produces. A guard
      # that did not run is worse than no guard, because it manufactures
      # confidence.
      - name: Every blocking guard must pass
        if: ${{ !cancelled() }}
        env:
          PAGE_MASTHEAD: ${{ steps.guard_page_masthead.outcome }}
          PORT_CONTROLS: ${{ steps.guard_port_controls.outcome }}
          EMAIL_LINKS: ${{ steps.guard_email_links.outcome }}
          ADMIN_CHAT: ${{ steps.guard_admin_chat.outcome }}
          RADIUS: ${{ steps.guard_radius.outcome }}
          COLOUR_EXISTS: ${{ steps.guard_colour_exists.outcome }}
          EVENTS_GRANTS: ${{ steps.guard_events_grants.outcome }}
          ONE_STRIPPER: ${{ steps.guard_one_stripper.outcome }}
          UI_NOTES: ${{ steps.guard_ui_notes.outcome }}
          PINNED_BARS: ${{ steps.guard_pinned_bars.outcome }}
          BOOTH_POSTER: ${{ steps.guard_booth_poster.outcome }}
          DUP_RULE_BASELINE: ${{ steps.guard_dup_rule_baseline.outcome }}
          VENDOR_REVALIDATE: ${{ steps.guard_vendor_revalidate.outcome }}
          CHANGELOG_DIR: ${{ steps.guard_changelog_dir.outcome }}
          SERVER_ONLY: ${{ steps.guard_server_only.outcome }}
          MIGRATIONS_DIR: ${{ steps.guard_migrations_dir.outcome }}
          MIGRATIONS_KEPT: ${{ steps.guard_migrations_kept.outcome }}
          FONTS_LOCAL: ${{ steps.guard_fonts_local.outcome }}
          FUNCTION_LEVEL_SET: ${{ steps.guard_function_level_set.outcome }}
          LABEL_CONTRAST: ${{ steps.guard_label_contrast.outcome }}
          AUTOMERGE_HOLD: ${{ steps.guard_automerge_hold.outcome }}
          STORED_ASSET_REFS: ${{ steps.guard_stored_asset_refs.outcome }}
        run: |
          failed=0
          check() {
            if [ "$2" = "success" ]; then
              printf '  PASS  %s\n' "$1"
            else
              printf '  FAIL  %s (outcome: %s)\n' "$1" "${2:-missing}"
              printf '::error title=%s::%s failed. Open the "%s" step in this job for its own message.\n' "$1" "$1" "$1"
              failed=1
            fi
          }
          check 'lint page masthead'          "$PAGE_MASTHEAD"
          check 'lint port keeps every control' "$PORT_CONTROLS"
          check 'lint email template links'   "$EMAIL_LINKS"
          check 'lint admin chat-guard'       "$ADMIN_CHAT"
          check 'lint radius tokens'          "$RADIUS"
          check 'lint colour names resolve'   "$COLOUR_EXISTS"
          check 'lint events column grants'  "$EVENTS_GRANTS"
          check 'lint one comment stripper'   "$ONE_STRIPPER"
          check 'lint engineering notes in ui' "$UI_NOTES"
          check 'lint stacked pinned bars'   "$PINNED_BARS"
          check 'lint booth poster placement' "$BOOTH_POSTER"
          check 'lint duplicated-rule baseline' "$DUP_RULE_BASELINE"
          check 'lint vendor layout revalidate' "$VENDOR_REVALIDATE"
          check 'lint changelog fragment dir'  "$CHANGELOG_DIR"
          check 'lint server-only boundary'   "$SERVER_ONLY"
          check 'lint fonts are local'        "$FONTS_LOCAL"
          check 'lint migrations dir'         "$MIGRATIONS_DIR"
          check 'lint migrations kept'        "$MIGRATIONS_KEPT"
          check 'lint no function-level custom SET' "$FUNCTION_LEVEL_SET"
          check 'lint label-on-fill contrast' "$LABEL_CONTRAST"
          check 'lint auto-merge hold'        "$AUTOMERGE_HOLD"
          check 'lint stored-asset refs'      "$STORED_ASSET_REFS"
          if [ "$failed" -ne 0 ]; then
            echo
            echo 'One or more blocking guards failed. Every failure is listed above with its'
            echo 'own annotation — fix them all; the first is not necessarily the only one.'
            exit 1
          fi
          echo
          echo 'All blocking guards passed.'

  build:
    name: production build
    runs-on: ubuntu-latest
    # Catches errors that typecheck misses — most notably Next's
    # compile-time `server-only` guard, which only fires in `next build`.
    # Vercel runs the same build, so if this passes locally + here, deploy
    # will pass too.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build web app
        run: pnpm --filter @setnayan/web build
        env:
          # Provide dummy values for env vars next.config / next build read at
          # build time. Real values are set on Vercel; CI only needs the build
          # to succeed, not to actually call Supabase/etc.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  bundle-size-check:
    name: bundle size check
    runs-on: ubuntu-latest
    # Hard ceiling: 200KB gzipped on the shared client bundle (union of
    # chunks loaded on every page). CLAUDE.md 2026-05-22 KPI lock —
    # without this guard, a single chunky import in a shared layout
    # silently regresses LCP for every couple-facing route. The script
    # at apps/web/scripts/check-bundle-size.mjs intersects build-manifest
    # routes, gzips each shared chunk on disk, and fails over budget.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build web app
        run: pnpm --filter @setnayan/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Check shared bundle size
        run: pnpm --filter @setnayan/web bundle-size-check

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-bottom-nav:
    name: lint bottom-nav template
    runs-on: ubuntu-latest
    # Enforces the UNBREAKABLE bottom-nav template (owner-locked 2026-06-13 ·
    # project_setnayan_bottom_nav_canonical). Fails if a doorway adds a
    # *-bottom-nav.tsx wrapper that doesn't delegate to the canonical
    # <BottomNav>, OR if the canonical primitive loses its locked-interaction
    # markers (the central --bn-* tuning props + the travel-stretch hook).
    # See apps/web/scripts/lint-bottom-nav.mjs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint bottom-nav template
        run: node apps/web/scripts/lint-bottom-nav.mjs

  lint-nav-icon-source:
    name: lint nav icon source
    runs-on: ubuntu-latest
    # Locks the nav/icon/menu-registry single-source invariant (Phase 9 ·
    # project_setnayan_nav_icon_menu_registry). Fails if a nav-chrome chokepoint
    # (customer/vendor/admin sidebar + bottom-nav, public marketing site-nav)
    # stops sourcing its menu labels/icons from the registry, OR if the registry
    # plumbing (resolver/defaults/icon converter) loses a required export.
    # Positive delegation guard — NOT a lucide ban. See
    # apps/web/scripts/lint-nav-icon-source.mjs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint nav icon source
        run: node apps/web/scripts/lint-nav-icon-source.mjs

  lint-entitlement-gates:
    name: lint entitlement gates
    runs-on: ubuntu-latest
    # Two guards on the couple-SKU ownership layer (added after the PR4/PR4b
    # "bundle buyer wrongly denied a paid SKU" bugs):
    #   1. couple-SKU gates must use the bundle-aware eventOwnsSku(), never the
    #      bare checkOrderOwnership() (blind to GUIDED_PACK/MEDIA_PACK ownership)
    #      — unless the SKU is in no bundle (explicit `bare-ok` annotation);
    #   2. the three bundle-membership mirrors (BUNDLE_MEMBERS · BUNDLE_CHILD_SKUS
    #      · bundles_granting_sku() SQL) must agree exactly.
    # Pure node, no install. See apps/web/scripts/lint-entitlement-gates.mjs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint entitlement gates
        run: node apps/web/scripts/lint-entitlement-gates.mjs

  lint-guest-legibility:
    name: lint guest legibility
    runs-on: ubuntu-latest
    # Guards the Guest Legibility Floor (02_Specifications/Guest_Legibility_Floor
    # _2026-06-20.md). After the 2026-06-20 "Lola Remedios" audit found the
    # dominant guest-facing failure was 7-11px load-bearing text (illegible to an
    # older guest), this fails when a guest-facing file (app/[slug], app/join, +
    # the shared guest components) introduces NEW text-[<=11px] beyond the
    # committed ratcheting baseline. Pure node, no install. See
    # apps/web/scripts/lint-guest-legibility.mjs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint guest legibility
        run: node apps/web/scripts/lint-guest-legibility.mjs

  lint-nested-forms:
    name: lint nested forms
    runs-on: ubuntu-latest
    # Fails on a <form> (or <ConfirmForm>, which renders its own <form>)
    # nested inside another form element under apps/web/app. Nested form tags
    # are invalid HTML — the browser hoists the inner form's $ACTION_ID_ input
    # into the outer form, so a no-JS / pre-hydration submit of the outer form
    # dispatches the INNER action (a real bug: no-JS "Save changes" deleted a
    # vendor's service — 2026-07-03). Tree is clean at landing; this blocks
    # regressions. Not yet a required check — owner promotes via branch
    # protection once proven quiet. See apps/web/scripts/lint-nested-forms.mjs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint nested forms
        run: node apps/web/scripts/lint-nested-forms.mjs

  migration-timestamp-guard:
    name: migration timestamp guard
    runs-on: ubuntu-latest
    # Runs scripts/check-migration-timestamps.mjs — the SAME check as
    # `pnpm migration:check` and the .githooks/pre-push hook (one source of
    # truth, no drift). Two rules:
    #   1. UNIQUE — no two migrations share a 14-digit prefix. A duplicate is the
    #      PK in schema_migrations, so `supabase db push` half-applies prod then
    #      crashes on the dup. (Caught twice in two days early on — PRs #77/#81.)
    #   2. ALLOCATED — a NEW migration must not use a hand-typed YYYYMMDD000000
    #      round prefix; those are how parallel branches collide (each passes CI
    #      alone, then clash on merge — a 2026-06-17 session hit it TWICE, each
    #      needing manual ledger surgery). `pnpm migration:new` hands out a
    #      collision-resistant, never-round prefix; this rule forces it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # RULE 2 distinguishes a NEW migration from one already on main, so it
      # needs the origin/main ref (the default checkout lacks it). Best-effort —
      # a fetch failure just skips RULE 2; RULE 1 still runs.
      - name: Fetch origin/main for the allocator rule
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main || true

      - name: Check migration prefixes (unique + allocator-sourced)
        run: node scripts/check-migration-timestamps.mjs

      - name: Unit-test the guard rules
        run: node --test scripts/check-migration-timestamps.test.mjs

      - name: Unit-test the migration doctor classifier
        run: node --test scripts/migration-doctor.test.mjs

  lint-exposure-baseline:
    name: lint exposure baseline
    runs-on: ubuntu-latest
    # Structural half of THE FREEZE (supabase/security/README.md). The real
    # comparison — live schema vs committed baseline — runs inside the
    # "typecheck + lint" job via test:db:ci, because it needs the migration
    # replay. THIS job needs nothing but the files, so it runs everywhere and
    # closes the two ways a file-based guard dies quietly:
    #   1. the baseline gets truncated/emptied, so the differ compares nothing
    #      against nothing and reports "no widenings";
    #   2. the guard gets unwired — test file deleted, renamed out of the
    #      tests/db/*.db.test.ts glob, or the CI step dropped — and the suite
    #      still goes green. That is the worst failure mode available, because
    #      it manufactures confidence.
    # So it asserts: header fact-count matches the body, per-kind floors are
    # met, ordering is canonical, keys are unique, the mirrored constants have
    # not drifted from exposure-surface.ts, and the freeze test is still wired
    # into both package.json and this workflow.
    # Pure node, no install. See scripts/lint-exposure-baseline.mjs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint exposure baseline
        run: node scripts/lint-exposure-baseline.mjs

