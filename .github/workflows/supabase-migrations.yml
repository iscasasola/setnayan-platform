name: supabase-migrations

# Auto-applies new Supabase migrations to production on every push to main
# that touches `supabase/migrations/**`. Closes the gap where Vercel deploys
# the app code with `next build` but never runs `supabase db push` — which
# left several recent migrations (e.g. event_vendors.source_venue_directory_id)
# unmerged in prod and surfaced as "Try again" errors on the marketplace.
#
# ─── ONE-TIME SETUP (owner) ──────────────────────────────────────────
# This workflow needs three pieces of state attached to the repo on
# GitHub. Set them once, then every merge to main with a new migration
# applies itself.
#
#   1. Settings → Secrets and variables → Actions → New repository secret
#         Name:  SUPABASE_ACCESS_TOKEN
#         Value: <personal access token from
#                 https://supabase.com/dashboard/account/tokens>
#
#   2. Same place, second secret:
#         Name:  SUPABASE_DB_PASSWORD
#         Value: <the database password — Supabase dashboard → Project
#                 Settings → Database → Connection string contains it,
#                 OR reset it under Database → Reset database password>
#
#   3. Settings → Secrets and variables → Actions → New repository VARIABLE
#         Name:  SUPABASE_PROJECT_REF
#         Value: njrupjnvkjkitfctetvi
#                (the project ref from NEXT_PUBLIC_SUPABASE_URL — kept as
#                 a variable, not a secret, since it's already in the
#                 client bundle. Variable lets future env-split land
#                 cleanly without rewriting the workflow.)
#
# After all three are set, the next migration commit to main triggers
# this workflow automatically. The Actions tab shows what got applied.
#
# ─── HOW TO RUN MANUALLY ─────────────────────────────────────────────
# Actions → supabase-migrations → Run workflow → main. Useful when:
#   • A previous run failed mid-apply and you want to retry
#   • A migration landed in main without touching `supabase/migrations/**`
#     (rare — the path filter exists to skip the workflow for unrelated
#     PRs, not to gate intentional applies)
#
# ─── HOW IT WORKS ────────────────────────────────────────────────────
# The Supabase CLI's `db push` reads `supabase_migrations.schema_migrations`
# in the target database and applies only versions that aren't already
# present. Re-running is a no-op. Migration ordering follows the
# alphabetical filename order under `supabase/migrations/`, so timestamp
# prefixes ARE the version identifier — duplicate timestamps cause CLI
# errors (caught here at apply time, not at runtime).

# STATE (2026-06-17): the push trigger is ARMED but the workflow is DORMANT —
# the `gate` step green no-ops on every migration merge until the 3 secrets are
# set, so arming it costs nothing today. This supersedes the 2026-05-24
# commented-out disable (its concern — "don't auto-apply a bad migration during
# the pilot" — is preserved: nothing applies until the owner sets the secrets).
#
# WHY enable it (eventually): applying migrations to prod manually, AHEAD of the
# PR merge, is the root cause of this repo's worst migration incidents — the
# `db push` jam, the silent QR-RPC drop, and the dup-collision ledger surgery
# (all 2026-06-17). Auto-apply-on-merge means migrations apply ONLY post-merge,
# under finalized timestamps, with applied==recorded — the whole class disappears.
#
# FLIP ON = just set the 3 (header) and the next migration merge self-applies.
# Until then: manual `supabase db push --db-url "$SUPABASE_DB_URL"` post-merge,
# or Actions → supabase-migrations → Run workflow (also no-ops without secrets).
on:
  # ARMED 2026-06-17 but DORMANT until the 3 secrets are set (the `gate` step
  # below green no-ops while they're unset, so this never spams red on a normal
  # migration merge). Setting the secrets is the single "flip on" action —
  # supersedes the 2026-05-24 commented-out disable.
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
  # ── The 30-min safety-net cron was REMOVED 2026-07-30. ──────────────────
  #
  # It existed because this workflow's `push` trigger can silently skip: the
  # shared concurrency group keeps only one in-progress + one pending run, so a
  # burst of migration merges supersedes the middle ones (observed live
  # 2026-07-22 with #3546 + #3549, and five more times on 2026-07-30).
  #
  # What made those skips PERSIST, though, was not the supersession — it was the
  # `paths:` filter above. A skipped apply could only be swept up by the next
  # merge that ALSO touched supabase/migrations/**, and on 2026-07-30 the merges
  # that followed were security and UI work, so nothing applied for 75 minutes.
  #
  # `deploy-prod.yml` now runs `db push --include-all` on EVERY push to main
  # (no paths filter) as the first half of migrate-then-deploy. So any merge, of
  # any kind, sweeps up everything pending — which is the protection this cron
  # was standing in for, event-driven instead of scheduled. Setnayan is
  # deliberately cron-free (owner, 2026-07-12, after stuck Vercel crons; see
  # memory project_setnayan_cron_free), and this was one of only two schedules
  # left in CI.
  #
  # ⛔ Do not re-add a schedule HERE, and especially not to deploy-prod — that
  # workflow's deploy-hook step is gated only on `gate.outputs.enabled`, never on
  # whether db push applied anything, so a cron there would fire a PRODUCTION
  # BUILD every firing (~48/day of unchanged code). If a burst ever does drop the
  # last run: `gh workflow run deploy-prod.yml --ref main`.

# Serialize applies across overlapping main pushes. `cancel-in-progress`
# left FALSE because a half-applied migration set is a worse state than
# a queued-up second run. (deploy-prod.yml shares this group, so the two never
# run `db push` against prod at the same time — they serialize.)
concurrency:
  group: supabase-migrations-prod
  cancel-in-progress: false

jobs:
  apply:
    name: apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      # Disable Supabase CLI telemetry. The CLI flushes analytics to PostHog on
      # exit; in CI that egress intermittently times out and the CLI returns a
      # NON-ZERO exit code AFTER the real work succeeded ("Finished supabase
      # link." → "Timeout while shutting down PostHog" → exit 1), reddening the
      # workflow at random. DO_NOT_TRACK (the cross-tool standard the Supabase
      # CLI honors) skips the telemetry entirely, so exit codes reflect only the
      # migration work.
      DO_NOT_TRACK: "1"
    steps:
      # Dormant-until-configured gate. With the push trigger ARMED, this runs on
      # every migration merge to main — but it must NOT spam a red failure while
      # the 3 secrets are unset (the pre-launch default). So it GREEN no-ops
      # until all three are present; the owner "flips it on" purely by setting
      # the secrets (see the header). Then every migration merge self-applies —
      # which removes the apply-ahead-of-merge anti-pattern that caused the
      # `db push` jam + the silent QR-RPC drop + the dup-collision ledger surgery.
      - name: Gate — is auto-apply configured?
        id: gate
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ All 3 secrets present — auto-apply ARMED; applying pending migrations."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Auto-apply dormant::Scaffolded but OFF — set SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD (secrets) and the SUPABASE_PROJECT_REF variable to enable (header has the steps). No migrations were applied."
          fi

      # Full history + all origin branches so that, if the apply fails on an
      # orphan, the migration doctor can name the still-open branch that carries
      # the orphan's file — turning a cryptic "Remote migration versions not
      # found" into an actionable diagnosis.
      - name: Checkout (full history)
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all origin branches (for orphan diagnosis)
        if: steps.gate.outputs.enabled == 'true'
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' || true

      - name: Setup Node (for the migration doctor)
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        if: steps.gate.outputs.enabled == 'true'
        uses: supabase/setup-cli@v1
        with:
          # PINNED, not `latest`. Supabase CLI v2.112.0 (released 2026-08-07
          # 10:08 UTC) broke `supabase link` with
          #   failed to get api keys: SchemaError(Expected a string matching the RegExp ...)
          # — it validates a timestamp the API returns against a stricter
          # RFC3339 regex than the API emits. Every prod deploy from 11:17 that
          # day failed at the link step, so THREE migrations merged green and
          # never reached the database: venue dimensions (the column did not
          # exist while the code reading it was live), creator-offers-free, and
          # an OAuth credential backfill.
          #
          # 🔑 `version: latest` means a third party can break this pipeline
          # without anyone touching this repo — and it fails AFTER the merge, so
          # CI is green and nobody is told. v2.111.0 (2026-07-31) is the last
          # release every deploy succeeded on.
          #
          # To move off the pin: bump it deliberately and watch one deploy go
          # green. Do not put `latest` back.
          version: 2.111.0

      - name: Link to Supabase project
        if: steps.gate.outputs.enabled == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: List local migrations
        if: steps.gate.outputs.enabled == 'true'
        run: |
          echo "Local migration files in this commit:"
          ls -1 supabase/migrations/ | grep -E '^[0-9]+_' || echo "(none)"

      - name: Apply pending migrations
        if: steps.gate.outputs.enabled == 'true'
        # --include-all: apply EVERY local migration missing from the remote
        # ledger, even one whose timestamp sorts BEFORE the latest applied
        # version. Without it, `db push` aborts ("Found local migration files to
        # be inserted before the last migration on remote database") whenever an
        # older-timestamp migration lands after a newer one was already applied —
        # which happens with cross-branch timestamp interleaving and after any
        # out-of-band apply. The repo's `pnpm migration:new` allocator keeps new
        # prefixes monotonic, so in the normal path --include-all is a no-op; it
        # only matters for the out-of-order tail, where skipping a real migration
        # is the worse failure. (2026-06-28: this is what unblocked the auto-apply
        # after the phantom-ledger reconciliation.)
        #
        # On failure — almost always a "Remote migration versions not found in
        # local migrations directory" orphan jam — run the migration doctor so
        # the run EXPLAINS which orphan is blocking it and the exact fix, instead
        # of leaving the next person to re-derive the diagnosis by hand. The
        # doctor's non-zero exit is swallowed with `|| true`; we then re-`exit 1`
        # so the workflow still fails (a jammed apply must stay red).
        run: |
          if ! supabase db push --include-all --yes; then
            echo "::error title=Migration apply failed::db push was rejected — running the migration doctor for diagnosis."
            node scripts/migration-doctor.mjs --linked | tee -a "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi

      - name: Show migration history after apply
        if: always() && steps.gate.outputs.enabled == 'true'
        run: supabase migration list
