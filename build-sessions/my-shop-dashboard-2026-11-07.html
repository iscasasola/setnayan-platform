<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supplier Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The full supplier dashboard — Today · Shop · Customers · Hub — as tiles with the shop's real figures, each with its own phone, tablet and desktop design, two sample shops, light and dark. 2026-11-07.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>

/* ─── THE APP'S REAL TOKENS — copied from apps/web/app/globals.css (light = `:root`, dark = `html.dark`). Prototypes use the app's tokens, never their own (owner 4 Nov).
   Layout: a slim control strip, then one device frame scaled to fit; inside it the shipped supplier shell — rail · bar · pinned row — and under the pinned row a DASHBOARD:
   1440 = a 4-column bento · 820 = a 2-column bento with a wide hero · 390 = a phone home screen (hero, a swipeable KPI strip, recent, a swipeable services strip, mini tiles, the next step in the thumb zone). */
:root{
  --cream:255 255 255; --ink:44 42 41; --accent:194 78 37; --on-accent:255 255 255; --ok:43 116 74; --warn:150 90 0; --danger:179 38 30; --link:59 78 103;
  --sn-canvas:#F7F5F0; --m-paper:#FFFFFF; --m-paper-2:#F4F2EC; --m-line:#E1DCD1; --m-line-soft:#EDE8DE; --m-ink:#2C2A29; --m-slate:#3A382F; --m-slate-3:#8A857B; --m-slate-4:#B5AF9E;
  --m-orange:#A9834B; --m-orange-2:#8A6B39; --m-orange-3:#CBA766; --m-orange-4:#F3ECDF; --m-orange-deep:#5C4726; --sn-gold-700:#8A6B39;
  --m-shadow-md:0 8px 24px -10px rgba(30,26,18,.18),0 2px 6px -2px rgba(30,26,18,.08);
  --raised:255 255 255; --font:'Hanken Grotesk',ui-sans-serif,system-ui,sans-serif; --mono:'Space Mono',ui-monospace,monospace;
  --scrim:rgba(30,26,18,.38);
  /* the one dark promo tile (the refs' "Upgrade Now") — the app's ink on light, the app's gold wash (--m-orange-4 dark) on dark */
  --promo-bg:#2C2A29; --promo-fg:#FBFAF7; --promo-soft:rgba(251,250,247,.66); --promo-pill:#E5794E; --promo-on-pill:#17160F;
  --photo-a:#D9C7A6; --photo-b:#8A6B39; --photo-c:#5C4726;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --cream:23 22 15; --ink:251 250 247; --accent:229 121 78; --on-accent:23 22 15; --ok:111 207 151; --warn:240 180 90; --danger:242 129 122; --link:157 178 206;
  --sn-canvas:#17160F; --m-paper:#232019; --m-paper-2:#2B2821; --m-line:rgba(251,250,247,.16); --m-line-soft:rgba(251,250,247,.10); --m-ink:#FBFAF7; --m-slate:#D6D1C7; --m-slate-3:#9A958C; --m-slate-4:#6A665E;
  --m-orange:#CBA766; --m-orange-2:#E2C98B; --m-orange-3:#A9834B; --m-orange-4:#413827; --m-orange-deep:#ECD9AE; --sn-gold-700:#E2C98B;
  --m-shadow-md:0 8px 24px -10px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.35); --raised:35 32 25; --scrim:rgba(0,0,0,.55); color-scheme:dark;
  --promo-bg:#413827; --promo-fg:#FBFAF7; --promo-soft:rgba(251,250,247,.7); --promo-pill:#E5794E; --promo-on-pill:#17160F;
  --photo-a:#6A5A3C; --photo-b:#3E3222; --photo-c:#2B2418;
}}
:root[data-theme="dark"]{
  --cream:23 22 15; --ink:251 250 247; --accent:229 121 78; --on-accent:23 22 15; --ok:111 207 151; --warn:240 180 90; --danger:242 129 122; --link:157 178 206;
  --sn-canvas:#17160F; --m-paper:#232019; --m-paper-2:#2B2821; --m-line:rgba(251,250,247,.16); --m-line-soft:rgba(251,250,247,.10); --m-ink:#FBFAF7; --m-slate:#D6D1C7; --m-slate-3:#9A958C; --m-slate-4:#6A665E;
  --m-orange:#CBA766; --m-orange-2:#E2C98B; --m-orange-3:#A9834B; --m-orange-4:#413827; --m-orange-deep:#ECD9AE; --sn-gold-700:#E2C98B;
  --m-shadow-md:0 8px 24px -10px rgba(0,0,0,.6),0 2px 6px -2px rgba(0,0,0,.35); --raised:35 32 25; --scrim:rgba(0,0,0,.55); color-scheme:dark;
  --promo-bg:#413827; --promo-fg:#FBFAF7; --promo-soft:rgba(251,250,247,.7); --promo-pill:#E5794E; --promo-on-pill:#17160F;
  --photo-a:#6A5A3C; --photo-b:#3E3222; --photo-c:#2B2418;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:rgb(var(--cream));color:rgb(var(--ink));font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid rgb(var(--accent));outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ─── the control strip ─── */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgb(var(--cream) / .92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--m-line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:rgb(var(--cream))}
.strip .eye{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sn-gold-700);margin-right:4px}
.strip .grow{flex:1}
.pb{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--m-line);background:var(--m-paper);font-size:13px;font-weight:600;color:rgb(var(--ink));white-space:nowrap}
.pb .soft{color:var(--m-slate-3);font-weight:500} .pb .vv{font-size:11px;color:rgb(var(--accent))}
.pb.rnd{width:40px;padding:0;justify-content:center;font-size:16px}

/* ─── the stage: one device frame, scaled to fit ─── */
.stage{padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;justify-content:center}
.fit{position:relative;overflow:hidden;border:1px solid var(--m-line);border-radius:14px;background:var(--sn-canvas);box-shadow:var(--m-shadow-md);max-width:100%}
.frame{transform-origin:0 0;position:relative;background:var(--sn-canvas);color:var(--m-ink);font-family:var(--font);display:grid;grid-template-rows:60px 1fr;overflow:hidden;height:var(--fh)}
.frame.w1440{width:1440px;grid-template-columns:240px 1fr}
.frame.w820{width:820px;grid-template-columns:72px 1fr}
.frame.w390{width:390px;grid-template-columns:1fr;grid-template-rows:56px 1fr}

/* rail — layout.tsx / front-door.css (unchanged) */
.rail{grid-row:1 / span 2;background:var(--m-paper);border-right:1px solid var(--m-line);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto}
.rail .home{display:flex;align-items:center;gap:12px;font-size:15px;padding:0 0 14px;border-bottom:1px solid var(--m-line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--m-ink);min-height:44px}
.rail .shop{font-size:13.5px;font-weight:700;color:var(--m-slate-3);margin-top:16px}
.rail .menu{font-size:10.5px;letter-spacing:.14em;color:var(--m-slate-4);font-weight:700}
.rail .it{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--m-slate-3);padding:11px 10px;border-radius:12px;margin:0 -10px;background:none;border:0;text-align:left;min-height:44px}
.rail .it.on{background:var(--m-orange-4);color:rgb(var(--accent));font-weight:600}
.rail .it .ic{width:22px;height:22px;display:inline-grid;place-items:center;font-size:16px}
.rail .it .ct{margin-left:auto;font-size:12px;color:var(--m-slate-3)}
.rail .foot{margin-top:auto;font-size:12px;color:var(--m-slate-3);line-height:1.6;border-top:1px solid var(--m-line);padding-top:16px}
.w820 .rail{padding:14px 8px;align-items:center;gap:8px}
.w820 .rail .it{flex-direction:column;gap:3px;font-size:10px;padding:8px 4px;margin:0;width:56px;text-align:center;justify-content:center}
.w820 .rail .home{flex-direction:column;font-size:10px;gap:3px;padding:0 0 10px;width:56px;text-align:center;justify-content:center}

/* bar (unchanged) */
.bar{height:60px;background:var(--m-paper);border-bottom:1px solid var(--m-line);display:flex;align-items:center;gap:10px;padding:0 24px;min-width:0}
.w390 .bar{height:56px;padding:0 12px}
.pick{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--sn-canvas);border:0;font-size:14px;font-weight:600;color:var(--m-ink);white-space:nowrap}
.pick .soft{color:var(--m-slate-3);font-weight:500} .pick .vv{font-size:11px;color:rgb(var(--accent))}
.bar .grow{flex:1}
.ava{width:44px;height:44px;border-radius:999px;background:var(--m-orange-4);color:var(--m-orange-deep);display:inline-grid;place-items:center;font-size:12px;font-weight:700;border:0;flex:none}
.rnd{width:44px;height:44px;border-radius:999px;border:1px solid var(--m-line);background:var(--m-paper);display:inline-grid;place-items:center;font-size:16px;color:var(--m-ink);flex:none}

/* BUTTON_RULE_2026-10-07: every control a 44-px pill, icon + word; terracotta = forward · green = confirm · grey = cancel · red = remove */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid transparent;position:relative;text-decoration:none}
.btn.pri{background:rgb(var(--accent));color:rgb(var(--on-accent))}
.btn.okb{background:rgb(var(--ok));color:#fff}
.btn.sec{background:var(--m-paper);border-color:var(--m-line);color:var(--m-ink)}
.btn.gry{background:color-mix(in srgb,var(--m-ink) 8%,transparent);color:var(--m-ink)}
.btn.red{background:rgb(var(--danger));color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn .i{font-size:15px;line-height:1}

/* main column — the scroll box; the pinned row sticks to its top (unchanged) */
.main{grid-column:2;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:auto;position:relative;scroll-behavior:smooth}
.w390 .main{grid-column:1}
.pin{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:4px;height:60px;padding:8px 24px;border-bottom:1px solid var(--m-line);background:var(--sn-canvas);flex:none}
.w390 .pin{padding:6px 16px;height:56px}
.door{appearance:none;display:inline-flex;align-items:center;gap:3px;min-height:44px;padding:0 5px;border:0;background:none;border-radius:10px;font-size:13.5px;color:color-mix(in srgb,var(--m-ink) 70%,transparent);white-space:nowrap}
.door b{font-size:15px;font-weight:700;color:var(--m-ink);font-variant-numeric:tabular-nums}
.door.hot,.door.hot b{color:rgb(var(--accent))}
.pin .grow{flex:1}

/* ─── THE DASHBOARD ─── */
.dash{padding:14px 24px 60px;min-width:0}
.w390 .dash{padding:10px 16px 150px}
.greet{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:6px 0 16px}
.greet h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:0;text-wrap:balance}
.greet p{margin:4px 0 0;font-size:14px;color:var(--m-slate-3)}
.greet .grow{flex:1}
.greet .date{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--m-line);background:var(--m-paper);font-size:13px;font-weight:600;white-space:nowrap}
.w390 .greet h1{font-size:24px}
.w390 .greet .date{display:none}
.grid{display:grid;gap:14px;align-items:stretch}
.w1440 .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.w820 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.w390 .grid{grid-template-columns:1fr;gap:12px}
.w390 .grid.mini{grid-template-columns:1fr 1fr}
/* a tile = a door. Frames only on what you press: every tile is pressable, so every tile has one. */
.tile{position:relative;border:1px solid var(--m-line);background:var(--m-paper);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;color:var(--m-ink);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:color-mix(in srgb,var(--m-ink) 30%,var(--m-line))}
.tile.s2{grid-column:span 2} .tile.r2{grid-row:span 2}
.w390 .tile.s2,.w390 .tile.r2{grid-column:auto;grid-row:auto}
.tile.open{grid-column:1 / -1;grid-row:auto;cursor:default;border-color:rgb(var(--accent));box-shadow:var(--m-shadow-md)}
.tile .th{display:flex;align-items:center;gap:8px;min-height:28px}
.tile .th .ti{width:28px;height:28px;border-radius:999px;background:color-mix(in srgb,rgb(var(--accent)) 12%,transparent);display:inline-grid;place-items:center;font-size:14px;flex:none}
.tile .th .tt{font-size:14px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .th .chev{color:rgb(var(--accent));font-size:16px;font-weight:700;flex:none}
.tile .big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}
.tile .big small{font-size:14px;font-weight:600;color:var(--m-slate-3);letter-spacing:0;margin-left:6px}
.tile .big.dash{color:var(--m-slate-4)}
.tile .ln{font-size:13px;color:var(--m-slate-3);line-height:1.35}
.tile .ln.warn{color:rgb(var(--warn))}
.trend{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--m-slate-3);margin-top:2px}
.trend b{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-weight:700;font-size:12px;background:color-mix(in srgb,var(--m-ink) 7%,transparent);color:var(--m-slate)}
.trend b.up{background:color-mix(in srgb,rgb(var(--ok)) 12%,transparent);color:rgb(var(--ok))}
.trend b.down{background:color-mix(in srgb,rgb(var(--danger)) 12%,transparent);color:rgb(var(--danger))}
.tile .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:999px;background:var(--m-paper-2);border:0;display:inline-grid;place-items:center;font-size:14px;color:var(--m-ink);z-index:2}
.tbody{padding-top:8px;border-top:1px solid var(--m-line);margin-top:4px;animation:pane-in .22s ease;cursor:default}
@keyframes pane-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.w1440 .tbody,.w820 .tbody{max-width:720px}
.foot-l{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px;font-size:13px;color:var(--m-slate-3);border-top:1px solid var(--m-line-soft)}
.foot-l b{color:var(--m-ink);font-weight:600}

/* the hero tile — the shop card */
.tile.hero{gap:12px}
.hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{flex:none;width:64px;height:64px;border-radius:16px;background:var(--m-paper-2);color:var(--m-ink);display:grid;place-items:center;font-size:20px;font-weight:600;letter-spacing:.05em}
.w390 .logo{width:52px;height:52px;font-size:17px;border-radius:14px}
.hero .mid{flex:1;min-width:160px}
.hero .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:20px;font-weight:700;letter-spacing:-.01em}
.w390 .hero .nm{font-size:18px}
.hero .sub{font-size:13.5px;color:var(--m-slate);margin-top:2px}
.hero .addr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--m-orange-2)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;border:0;white-space:nowrap}
.chip.ver{background:color-mix(in srgb,rgb(var(--ok)) 12%,transparent);color:rgb(var(--ok))}
.chip.get{background:var(--m-orange-4);color:var(--m-orange-deep)}
.ring{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.ring .r{width:80px;height:80px;border-radius:999px;display:grid;place-items:center;background:conic-gradient(var(--m-orange) var(--deg),var(--m-orange-3) 0)}
.ring .r i{width:60px;height:60px;border-radius:999px;background:var(--m-orange-4);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:16px;color:var(--m-ink);font-style:normal}
.w390 .ring .r{width:64px;height:64px} .w390 .ring .r i{width:48px;height:48px;font-size:13px}
.eye{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sn-gold-700)}
.next{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:14px;padding:12px 14px;background:color-mix(in srgb,rgb(var(--accent)) 8%,transparent);margin-top:auto}
.next .t{flex:1;min-width:160px} .next .t b{display:block;font-size:14px;font-weight:600} .next .t span{font-size:12.5px;color:var(--m-slate-3)}
.w390 .next{display:none} /* on the phone the next step lives in the thumb zone */

/* phone strips — swipeable rows of tiles */
.hstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hstrip::-webkit-scrollbar{display:none}
.hstrip .tile{flex:0 0 150px;scroll-snap-align:start;padding:14px}
.hstrip .tile.photo{flex-basis:160px}
.hstrip .tile .big{font-size:28px}
.sec-h{display:flex;align-items:center;gap:8px;padding:16px 0 8px;font-size:12.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--m-ink) 55%,transparent)}
.sec-h .inf{margin-left:auto}
.inf{width:28px;height:28px;border-radius:999px;border:0;background:none;display:inline-grid;place-items:center;padding:0}
.inf i{width:16px;height:16px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--m-ink) 55%,transparent);display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:color-mix(in srgb,var(--m-ink) 65%,transparent);font-family:var(--mono);font-style:normal;text-transform:none;letter-spacing:0}

/* people rows (recent asks · helpers) */
.prow{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 0;border-top:1px solid var(--m-line-soft)}
.prow.first{border-top:0}
.pava{flex:none;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--m-orange-4);color:var(--m-orange-deep)}
.pava.q{background:color-mix(in srgb,var(--m-ink) 6%,transparent);color:var(--m-slate-3)}
.prow .t{flex:1;min-width:0} .prow .nm{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .prow .ln{display:block;font-size:12.5px;color:var(--m-slate-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.badge{flex:none;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.ok{color:rgb(var(--ok));background:color-mix(in srgb,rgb(var(--ok)) 12%,transparent)}
.badge.wait{color:rgb(var(--warn));background:color-mix(in srgb,rgb(var(--warn)) 12%,transparent)}
.badge.quiet{color:color-mix(in srgb,var(--m-ink) 62%,transparent);background:color-mix(in srgb,var(--m-ink) 7%,transparent)}

/* services as photo tiles — "Top Selling Products" */
.svcgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.w820 .svcgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.svc{position:relative;border:1px solid var(--m-line);border-radius:14px;overflow:hidden;background:var(--m-paper-2);min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;text-align:left;color:var(--m-ink);cursor:pointer}
.svc .cover{position:absolute;inset:0;background:linear-gradient(135deg,var(--photo-a),var(--photo-b) 60%,var(--photo-c))}
.svc .cover::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 70% 20%,rgba(255,255,255,.35),transparent 70%)}

const frame=document.getElementById('frame'),fitBox=document.getElementById('fit');
function render(o={}){

/* 📌 an opened section glides into view (owner 4 Nov, app-wide): tap-open + overflow → its head glides to the pin line; it fits → no move */
function glide(k){
  const sc=document.getElementById('scroller');const r=sc&&sc.querySelector(`[data-tile="${CSS.escape(k)}"]`);if(!r) return;
  const pinH=S.w===390?56:60;const top=r.offsetTop-pinH;
  const bottom=r.offsetTop+r.offsetHeight;const viewTop=sc.scrollTop+pinH,viewBot=sc.scrollTop+sc.clientHeight;
  if(r.offsetTop<viewTop||bottom>viewBot) sc.scrollTo({top:Math.max(0,top),behavior:'smooth'});
}
function fit(){const w=S.w,fh=FH[w];const avail=Math.min(document.querySelector('.stage').clientWidth,w);const s=Math.min(1,avail/w);frame.style.transform=`scale(${s})`;fitBox.style.width=(w*s)+'px';fitBox.style.height=(fh*s)+'px';}

/* ═══════════════ actions ═══════════════ */
function toast(t,undo){S.toast={t,undo};clearTimeout(toastTimer);toastTimer=setTimeout(()=>{S.toast=null;render();},undo?6000:2600);}
function openTile(k){ if(S.w!==390&&S.open===k){S.open=null;render();return;} S.open=k;render({glide:k}); }
function notice(t){S.sheet={t,l:'Not drawn in this prototype — the shipped page opens here. Nothing moves there.'};render();}
function goSec(sec,open){S.sec=sec;S.open=null;S.hit=null;render({top:true});if(open)setTimeout(()=>openTile(open),60);}
function act(a,el){
  const [v,...rest]=a.split(':');const arg=rest.join(':');
  switch(v){
    case 'tile': openTile(arg); break;
    case 'svc': openTile('svc:'+arg); break;
    case 'cust': openTile('cust:'+arg); break;
    case 'day': openTile('day:'+arg); break;
    case 'close': S.open=null; render(); break;
    case 'sec': goSec(arg); break;
    case 'go': {const [sec,k]=arg.split(':');goSec(sec,k);break;}
    case 'hub': S.hubEvent=arg;goSec('hub');break;
    case 'add': S.kind='';S.name='';S.price='';S.pricing='';openTile('add');break;
    case 'save-svc': {
      const nm=(S.name||S.kind||'').trim();if(!nm){toast('Pick what you offer first');render();break;}
      const id='new'+(++n);S.svcs.push({id,t:esc(nm),cards:S.price?[['Good',esc(nm),'₱'+esc(S.price)]]:[],live:false,cover:false,tools:[],scanner:'No scanner'});
      const i=SETUP.findIndex(s=>s[0]==='Add what you offer');if(i>=0&&S.setup[i]==='now'){S.setup[i]='done';if(S.setup[i+1]==='later')S.setup[i+1]='now';}
      S.open='svc:'+id;toast('✓ Saved · Ready — goes live when you are verified');render({glide:'svc:'+id});break;}
    case 'remove': {
      if(arg.startsWith('svc:')){const k=arg.slice(4);const i=S.svcs.findIndex(s=>s.id===k);if(i<0)break;const [s]=S.svcs.splice(i,1);S.removed.push({kind:'svc',s,i});if(S.open==='svc:'+k)S.open=null;toast(`Removed ${s.t}`,true);render();}
      else if(arg.startsWith('cust:')){const k=arg.slice(5);const i=S.cust.findIndex(c=>c.id===k);if(i<0)break;const [c]=S.cust.splice(i,1);S.removed.push({kind:'cust',s:c,i});if(S.open==='cust:'+k)S.open=null;toast(`Archived ${c.who}`,true);render();}
      else if(arg.startsWith('pay:')){const i=+arg.slice(4);const [p]=S.pay.splice(i,1);S.removed.push({kind:'pay',s:p,i});toast(`Removed ${p}`,true);render();}
      break;}
    case 'undo': {const r=S.removed.pop();if(r){const arr=r.kind==='svc'?S.svcs:r.kind==='cust'?S.cust:S.pay;arr.splice(Math.min(r.i,arr.length),0,r.s);S.toast=null;clearTimeout(toastTimer);render();}break;}
    case 'tool': {const [id,i]=arg.split(':');const s=S.svcs.find(x=>x.id===id);if(s){s.tools[+i][2]=!s.tools[+i][2];render();}break;}
    case 'live': {const s=S.svcs.find(x=>x.id===arg);if(s){if(!s.live&&!verified()){toast('Get verified first — it goes live once Setnayan approves your shop');render();break;}s.live=!s.live;toast(s.live?'✓ Shown on Explore':'Hidden from Explore');render();}break;}
    case 'agree': {const c=S.cust.find(x=>x.id===arg);if(c){c.lane='booked';c.l='Agreed · deposit to come';F().waiting=Math.max(0,F().waiting-1);toast(`✓ Agreed · ${c.who} is booked`);S.open=null;render();}break;}
    case 'set-since': S.since=true;toast(profilePct()===100?'✓ Profile complete':'✓ Saved');render();break;
    case 'setup-done': {const i=+arg;S.setup[i]='done';if(S.setup[i+1]==='later')S.setup[i+1]='now';toast(`✓ ${SETUP[i][0]} · done`);render();break;}
    case 'checkin': S.checked++;toast(`✓ Checked in · ${S.checked}`);render();break;
    case 'dayoff': {const off=F().off;const i=off.indexOf(arg);if(i>=0)off.splice(i,1);else off.push(arg);toast(i>=0?'Open for bookings':'Marked as a day off');render();break;}
    case 'bar': S.hit=S.hit===+arg?null:+arg;render();break;
    case 'gear': {const rows=S.sec==='shop'?[['verify','Verification and documents'],['plan','Plan and billing'],['helpers','Helpers'],['nope:Notifications','Notifications']]:S.sec==='customers'?[['cu-dates','Date tools'],['cu-tools','Customer tools'],['nope:Archived and closed chats','Archived and closed chats'],['nope:Notifications','Notifications']]:S.sec==='hub'?[['hb-team','Your team on this event'],['hb-pages','The event’s pages'],['nope:Hub settings','Hub settings'],['nope:Notifications','Notifications']]:[['td-setup','Get your shop live'],['go:shop:hero','Your shop'],['nope:Days off','Days off'],['nope:Notifications','Notifications']];
      S.sheet={t:'Settings',l:`${SECTIONS.find(s=>s[0]===S.sec)[1]} ⚙ — the set-once things, as folds.`,rows:rows.map((r,i)=>row({t:r[1],ic:I.doc,first:i===0,act:r[0].includes(':')?r[0]:'gear-go:'+r[0]})).join('')};render();break;}
    case 'gear-go': S.sheet=null;openTile(arg);break;
    case 'close-sheet': S.sheet=null;render();break;
    case 'nope': S.sheet=null;notice(arg);break;
    case 'tip': S.sheet={t:'About this',l:arg};render();break;
    case 'copy': {const t=SHOP.addr;const done=()=>{toast('✓ Copied');};(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).then(done,done);break;}
    case 'doc': S.docs[+arg]=1;toast(S.docs.every(Boolean)?'✓ All four sent · Setnayan is checking':'Sent · Setnayan is checking it');render();break;
    case 'code': S.codes[arg]=true;toast(S.codes.email&&S.codes.phone?'✓ Both contacts confirmed':'Code sent · confirmed');render();break;
    case 'sw': S[arg]=!S[arg];render();break;
    case 'pay-add': S.pay.push(arg);toast('✓ Added · '+arg);render();break;
    case 'pick': {const [m,val]=[arg.split(':')[0],arg.split(':').slice(1).join(':')];pick(m,val,arg);break;}
    case 'menu': openMenu(el,arg);break;
  }
}
function pick(m,val,arg){
  if(m==='seg'){const sec=arg.split(':')[1];const v=arg.split(':').slice(2).join(':');S.seg[sec]=v;
    if(sec==='shop'){({Services:()=>openTile('services'),Details:()=>openTile('hero'),Page:()=>openTile('page'),Portfolio:()=>openTile('gallery'),Promote:()=>openTile('promote'),Analytics:()=>openTile('opened'),Plan:()=>openTile('plan')}[v]||render)();}
    else {({Events:()=>openTile('cu-events'),Dates:()=>openTile('cu-dates'),Money:()=>openTile('cu-money')}[v]||render)();}
    return;}
  if(m==='plan'){S.plan=val;render();return;}
  if(m==='kind'){S.kind=val;render();return;}
  if(m==='pricing'){S.pricing=val;render();return;}
  if(m==='gigs'){S.gigs=val;render();return;}
  if(m==='hubev'){const c=S.cust.find(x=>x.who===val);if(c)S.hubEvent=c.id;render();return;}
  if(m.startsWith('scanner')){const id=arg.split(':')[1];const s=S.svcs.find(x=>x.id===id);if(s){s.scanner=arg.split(':').slice(2).join(':');render();}return;}
  render();
}

/* ─── swipe left to remove (swipe-to-delete.tsx: axis locks at 8 px; reveal 84 px; a long pull removes at once) ─── */
let D=null,swallow=false;
frame.addEventListener('pointerdown',e=>{
  const r=e.target.closest('.row[data-swipe]');if(!r||e.button!==0)return;if(e.target.closest('.rv'))return;
  D={r,inn:r.querySelector('.rowin'),x0:e.clientX,y0:e.clientY,horiz:false,tx:0,open:r.classList.contains('rev'),s:frame.getBoundingClientRect().width/S.w};
});
frame.addEventListener('pointermove',e=>{
  if(!D)return;const dx=(e.clientX-D.x0)/D.s,dy=(e.clientY-D.y0)/D.s;
  if(!D.horiz){ if(Math.abs(dy)>8&&Math.abs(dy)>=Math.abs(dx)){D=null;return;} if(Math.abs(dx)>8){D.horiz=true;D.r.classList.add('drag');D.inn.style.transition='none';try{D.r.setPointerCapture(e.pointerId)}catch(_){}} else return; }
  let tx=(D.open?-84:0)+dx;tx=Math.min(0,Math.max(tx,-S.w*0.6));D.tx=tx;D.inn.style.transform=`translateX(${tx}px)`;
});
function endSwipe(){
  if(!D)return;const d=D;D=null;if(!d.horiz)return;
  swallow=true;setTimeout(()=>{swallow=false;},350);
  d.inn.style.transition='';const rowW=d.r.offsetWidth;const k=d.r.dataset.swipe;
  if(d.tx<-rowW*0.55){d.inn.style.transform=`translateX(${-rowW}px)`;d.r.classList.add('gone');setTimeout(()=>act('remove:'+k),180);return;}
  if(d.tx<-84*0.6){d.inn.style.transform='translateX(-84px)';d.r.classList.add('rev');}
  else {d.inn.style.transform='';d.r.classList.remove('rev');}
  setTimeout(()=>d.r.classList.remove('drag'),250);
}
